<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>vlburukov — Space Blast</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: #050508;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
      position: fixed;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #050508;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left, .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    .hud-right { align-items: flex-end; }
    .hud-mini {
      padding: 5px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,0.48);
      border: 1px solid rgba(148,163,184,0.18);
      color: #94a3b8;
      font-size: 10px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .hud-mini b { color: #e2e8f0; margin-left: 4px; font-size: 12px; }
    .hud-label { color: #94a3b8; font-size: 9px; letter-spacing: 1.5px; margin-bottom: 2px; }
    #pause-btn {
      pointer-events: auto;
      border: 1px solid rgba(0,229,255,0.35);
      background: rgba(0,0,0,0.58);
      color: #00e5ff;
      width: 42px; height: 42px;
      border-radius: 14px;
      font-size: 20px; font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    #pause-btn:active { transform: scale(.94); }
    #score-box {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(0, 212, 255, 0.25);
    }

    #score {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #00e5ff;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
    }

    #lives {
      font-size: 18px;
      letter-spacing: 4px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 77, 109, 0.25);
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 12, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #00e5ff, #a855f7, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    #overlay .subtitle {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    #final-score {
      font-size: 56px;
      font-weight: 800;
      margin: 8px 0 6px;
      color: #00e5ff;
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
    }

    #final-label {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn {
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      border: none;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 0 6px 28px rgba(0, 212, 255, 0.35), 0 0 0 1px rgba(255,255,255,0.1);
      letter-spacing: 0.5px;
    }

    .btn:active { transform: scale(0.96); }
    .menu-actions { display:flex; flex-direction:column; gap:12px; width:min(280px,100%); }
    .btn-secondary {
      background: rgba(15,23,42,.88); border:1px solid rgba(0,229,255,.5);
      color:#bffaff; font-size:15px; font-weight:700; padding:13px 22px;
      border-radius:40px; cursor:pointer; box-shadow:0 0 18px rgba(0,229,255,.12);
    }
    .shop-card {
      width:min(340px,100%); max-height:62vh; overflow:auto; margin:0 0 14px;
      padding:12px; border:1px solid rgba(0,229,255,.25); border-radius:18px;
      background:rgba(10,15,30,.88); text-align:left;
    }
    .shop-row { display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 4px; border-bottom:1px solid rgba(148,163,184,.12); }
    .shop-row:last-child { border-bottom:0; }
    .shop-name { color:#e2e8f0; font-size:14px; font-weight:700; }
    .shop-desc { color:#94a3b8; font-size:11px; margin-top:3px; }
    .shop-buy { border:1px solid rgba(168,85,247,.65); background:rgba(124,58,237,.25);
      color:#fff; border-radius:12px; padding:9px 10px; font-weight:700; min-width:76px; }
    .shop-buy:disabled { opacity:.35; }
    #boss-bar-wrap { position:absolute; top:126px; left:12%; width:76%; height:10px;
      border:1px solid rgba(255,80,120,.75); border-radius:8px; overflow:hidden;
      background:rgba(0,0,0,.65); z-index:12; display:none; }
    #boss-bar { height:100%; width:100%; background:linear-gradient(90deg,#ff2d75,#a855f7);
      box-shadow:0 0 12px #ff2d75; transition:width .1s; }
    #boss-label { position:absolute; top:108px; width:100%; text-align:center; font-size:10px;
      color:#ff8db5; letter-spacing:3px; z-index:12; display:none; text-shadow:0 0 10px #ff2d75; }
    .power-toast { position:absolute; top:150px; left:0; right:0; text-align:center;
      color:#67f7ff; font-weight:800; font-size:13px; text-shadow:0 0 12px #00e5ff;
      z-index:16; pointer-events:none; opacity:0; transition:opacity .2s; }
    .power-toast.show { opacity:1; }

    #combo {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      text-shadow: 0 0 16px rgba(251, 191, 36, 0.7);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      z-index: 15;
    }

    #combo.show {
      opacity: 1;
    }

    .hint {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      color: #475569;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
      padding: 0 20px;
    }

    .hint.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="hud-left">
        <div id="score-box"><div class="hud-label">СЧЁТ</div><div id="score">0</div></div>
        <div class="hud-mini">РЕКОРД <b id="best-score">0</b></div>
        <div class="hud-mini">ВРЕМЯ <b id="survival-time">0:00</b></div>
      </div>
      <div class="hud-right">
        <div id="lives">♥ ♥ ♥ ♥</div>
        <button id="pause-btn" aria-label="Пауза">Ⅱ</button>
      </div>
    </div>

    <div id="combo">x2</div>
    <div id="boss-label">БИТВА С БОССОМ</div>
    <div id="boss-bar-wrap"><div id="boss-bar"></div></div>
    <div id="power-toast" class="power-toast"></div>

    <canvas id="game"></canvas>

    <div class="hint" id="hint">
      Веди пальцем · сбивай ☢ бомбы · выбери оружие в меню
    </div>

    <div id="overlay">
      <h1>SPACE BLAST</h1>
      <p class="subtitle">NEON ARCADE · ВЫЖИВАНИЕ<br>Боссы · оружие · улучшения</p>
      <div class="menu-actions">
        <button class="btn" id="start-btn">ИГРАТЬ</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const hint = document.getElementById('hint');
    const comboEl = document.getElementById('combo');
    const bestScoreEl = document.getElementById('best-score');
    const survivalTimeEl = document.getElementById('survival-time');
    const pauseBtn = document.getElementById('pause-btn');
    const bossBarWrap = document.getElementById('boss-bar-wrap');
    const bossBar = document.getElementById('boss-bar');
    const bossLabel = document.getElementById('boss-label');
    const powerToast = document.getElementById('power-toast');
    let W, H, dpr;
    let animationId = null;
    let gameRunning = false;
    let isPaused = false;
    let score = 0;
    let bestScore = 0;
    let credits = 0;
    let beamRate = 0; // 0..3 only increases beam fire rate
    const BEAM_RATE_COSTS = [50, 110, 200];
    try {
      bestScore = Number(localStorage.getItem('spaceBlastBest') || 0);
      credits = Number(localStorage.getItem('spaceBlastCredits') || 0);
      beamRate = Math.min(3, Math.max(0, Number(localStorage.getItem('spaceBlastBeamRate') || 0)));
    } catch(e) {}
    bestScoreEl.textContent = bestScore;

    let selectedDiff = 'medium';
    let selectedWeapon = 'beam'; // beam | rockets
    try {
      selectedDiff = localStorage.getItem('spaceBlastDiff') || 'medium';
      selectedWeapon = localStorage.getItem('spaceBlastWeapon') || 'beam';
      if (selectedWeapon === 'knives') selectedWeapon = 'beam';
    } catch(e) {}
    let moveSpeed = 0; // horizontal movement intensity 0..1+

    // Settings (saved)
    let settings = {
      vibration: true,
      sound: true,
      shake: 'medium',   // off | low | medium | high
      particles: 'medium', // low | medium | high
      sensitivity: 'medium' // low | medium | high — control follow speed
    };
    try {
      settings = Object.assign(settings, JSON.parse(localStorage.getItem('spaceBlastSettings') || '{}'));
    } catch(e) {}

    function saveSettings() {
      try { localStorage.setItem('spaceBlastSettings', JSON.stringify(settings)); } catch(e) {}
    }

    // --- Immersive procedural audio ---
    let audioCtx = null;
    let masterGain = null;
    let noiseBuffer = null;

    function ensureAudio() {
      if (!settings.sound) return null;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.55;
          masterGain.connect(audioCtx.destination);
          const len = Math.floor(audioCtx.sampleRate * 1.2);
          noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function envGain(ctx, start, peak, attack, hold, release) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), start + attack);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.7), start + attack + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, start + attack + hold + release);
      return g;
    }

    /** type: hit | small | medium | large | nuclear | boss */
    function playExplosion(type, pan) {
      const ctx = ensureAudio();
      if (!ctx || !masterGain || !noiseBuffer) return;
      const t0 = ctx.currentTime;
      pan = pan || 0;
      let out = masterGain;
      if (ctx.createStereoPanner) {
        const panner = ctx.createStereoPanner();
        panner.pan.value = Math.max(-0.85, Math.min(0.85, pan));
        panner.connect(masterGain);
        out = panner;
      }
      const profiles = {
        hit:     { noise: 0.16, noiseDur: 0.07, thump: 95, thumpPeak: 0.18, crack: 560, crackPeak: 0.07, rumble: 0 },
        small:   { noise: 0.3,  noiseDur: 0.22, thump: 72, thumpPeak: 0.34, crack: 390, crackPeak: 0.15, rumble: 40 },
        medium:  { noise: 0.42, noiseDur: 0.38, thump: 55, thumpPeak: 0.48, crack: 300, crackPeak: 0.22, rumble: 34 },
        large:   { noise: 0.55, noiseDur: 0.55, thump: 42, thumpPeak: 0.62, crack: 240, crackPeak: 0.28, rumble: 26 },
        boss:    { noise: 0.62, noiseDur: 0.72, thump: 34, thumpPeak: 0.72, crack: 190, crackPeak: 0.34, rumble: 22 },
        nuclear: { noise: 0.88, noiseDur: 1.2,  thump: 26, thumpPeak: 0.95, crack: 150, crackPeak: 0.42, rumble: 16 }
      };
      const p = profiles[type] || profiles.small;

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const nFilter = ctx.createBiquadFilter();
      nFilter.type = 'lowpass';
      nFilter.frequency.setValueAtTime(1600 + Math.random() * 700, t0);
      nFilter.frequency.exponentialRampToValueAtTime(160 + Math.random() * 90, t0 + p.noiseDur * 0.65);
      nFilter.Q.value = 0.65;
      const nGain = envGain(ctx, t0, p.noise, 0.004, p.noiseDur * 0.12, p.noiseDur * 0.88);
      noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(out);
      noise.start(t0); noise.stop(t0 + p.noiseDur + 0.05);

      const thump = ctx.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(p.thump * (0.9 + Math.random() * 0.2), t0);
      thump.frequency.exponentialRampToValueAtTime(26, t0 + 0.2 + p.noiseDur * 0.15);
      const tGain = envGain(ctx, t0, p.thumpPeak, 0.006, 0.04, 0.25 + p.noiseDur * 0.12);
      thump.connect(tGain); tGain.connect(out);
      thump.start(t0); thump.stop(t0 + 0.5);

      const crack = ctx.createOscillator();
      crack.type = 'triangle';
      crack.frequency.setValueAtTime(p.crack * (0.85 + Math.random() * 0.3), t0);
      crack.frequency.exponentialRampToValueAtTime(p.crack * 0.22, t0 + 0.09);
      const cGain = envGain(ctx, t0, p.crackPeak, 0.002, 0.012, 0.1);
      crack.connect(cGain); cGain.connect(out);
      crack.start(t0); crack.stop(t0 + 0.14);

      if (p.rumble > 0) {
        const rumble = ctx.createOscillator();
        rumble.type = 'sine';
        rumble.frequency.setValueAtTime(p.rumble, t0);
        rumble.frequency.linearRampToValueAtTime(p.rumble * 0.55, t0 + p.noiseDur);
        const rGain = envGain(ctx, t0, type === 'nuclear' ? 0.55 : 0.26, 0.02, p.noiseDur * 0.28, p.noiseDur * 0.72);
        rumble.connect(rGain); rGain.connect(out);
        rumble.start(t0); rumble.stop(t0 + p.noiseDur + 0.12);
      }

      if (type === 'nuclear') {
        const boom2 = ctx.createOscillator();
        boom2.type = 'sine';
        boom2.frequency.setValueAtTime(48, t0 + 0.12);
        boom2.frequency.exponentialRampToValueAtTime(20, t0 + 0.55);
        const b2g = envGain(ctx, t0 + 0.12, 0.48, 0.02, 0.08, 0.45);
        boom2.connect(b2g); b2g.connect(out);
        boom2.start(t0 + 0.12); boom2.stop(t0 + 0.7);

        const sizzle = ctx.createBufferSource();
        sizzle.buffer = noiseBuffer;
        const sF = ctx.createBiquadFilter();
        sF.type = 'highpass';
        sF.frequency.value = 2500;
        const sG = envGain(ctx, t0, 0.18, 0.01, 0.18, 0.95);
        sizzle.connect(sF); sF.connect(sG); sG.connect(out);
        sizzle.start(t0); sizzle.stop(t0 + 1.15);
      }
    }

    function explosionSoundFromCount(count, x) {
      const pan = W ? ((x || W / 2) / W) * 2 - 1 : 0;
      if (count >= 70) playExplosion('large', pan);
      else if (count >= 28) playExplosion('medium', pan);
      else if (count >= 10) playExplosion('small', pan);
      else playExplosion('hit', pan);
    }

    function shakeMul() {
      return ({ off: 0, low: 0.45, medium: 1, high: 1.55 }[settings.shake] ?? 1);
    }
    function particleMul() {
      return ({ low: 0.45, medium: 1, high: 1.5 }[settings.particles] ?? 1);
    }
    function sensitivityLerp() {
      return ({ low: 0.28, medium: 0.42, high: 0.58 }[settings.sensitivity] ?? 0.42);
    }
    const DIFF = {
      easy:   { cap: 1.25, timeDiv: 70, spawnBase: 70, spawnMin: 36, speedMul: 0.85, tankHp: 2, bossHp: 18, bossEvery: 45, fastMul: 0.7 },
      medium: { cap: 1.55, timeDiv: 55, spawnBase: 58, spawnMin: 28, speedMul: 1.0,  tankHp: 3, bossHp: 26, bossEvery: 38, fastMul: 1.0 },
      hard:   { cap: 2.05, timeDiv: 42, spawnBase: 48, spawnMin: 18, speedMul: 1.2,  tankHp: 4, bossHp: 36, bossEvery: 30, fastMul: 1.25 }
    };
    let boss = null;
    let bossSpawnedFor = 0;
    let powerModeTimer = 0;
    let bombFlash = 0;
    let bombRing = 0;
    let bombSpawnTimer = 0;
    let nextBombAt = 60 * 12; // first bomb ~12s
    let lastBossShot = 0;
    let lives = 4;
    let keys = {};
    let lastShot = 0;
    let enemySpawnTimer = 0;
    let particles = [];
    let stars = [];
    let trails = [];
    let shake = 0;
    let combo = 0;
    let comboTimer = 0;
    let time = 0;
    let gameTime = 0; // seconds of active play
    let difficulty = 1; // scales over time

    // Player
    const player = {
      x: 0,
      y: 0,
      w: 52,
      h: 40,
      speed: 9.5,
      targetX: 0
    };

    let bullets = [];
    let enemies = [];
    let powerUps = [];
    let nebulaClouds = [];
    let asteroids = [];

    // Single map: Crimson Nebula
    const currentMap = {
      id: 'crimson',
      name: 'Crimson Nebula',
      bg: '#0c0610',
      starColor: [255, 180, 200],
      accent: [255, 80, 120],
      vignette: 'rgba(40,0,20,0.5)'
    };

    function vibrate(pattern) {
      if (!settings.vibration || !navigator.vibrate) return;
      try {
        if (typeof pattern === 'number') {
          navigator.vibrate(Math.max(4, Math.round(pattern * 0.4)));
        } else if (Array.isArray(pattern)) {
          navigator.vibrate(pattern.map((v, i) => i % 2 === 0 ? Math.max(4, Math.round(v * 0.4)) : v));
        }
      } catch(e) {}
    }

    function addShake(amount) {
      shake = Math.max(shake, amount * shakeMul());
    }

    function resize() {
      const container = document.getElementById('game-container');
      dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      W = container.clientWidth;
      H = container.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      player.x = W / 2 - player.w / 2;
      player.targetX = player.x;
      player.y = H - 90;
    }

    window.addEventListener('resize', () => {
      resize();
      initStars();
    });
    resize();

    function initStars() {
      stars = [];
      nebulaClouds = [];
      asteroids = [];
      for (let i = 0; i < 70; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: Math.random() * 2.2 + 0.3,
          speed: Math.random() * 1.8 + 0.25,
          brightness: Math.random() * 0.6 + 0.3
        });
      }
      for (let i = 0; i < 5; i++) {
        nebulaClouds.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 80 + Math.random() * 120,
          speed: 0.15 + Math.random() * 0.25,
          alpha: 0.04 + Math.random() * 0.06,
          hue: 330 + Math.random() * 40
        });
      }
      for (let i = 0; i < 8; i++) {
        asteroids.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 4 + Math.random() * 10,
          speed: 0.6 + Math.random() * 1.4,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03
        });
      }
    }
    initStars();

    // Keyboard
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch / Pointer – smooth tracking
    let pointerActive = false;

    function getPointerX(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return clientX - rect.left;
    }

    function onPointerStart(e) {
      e.preventDefault();
      pointerActive = true;
      player.targetX = getPointerX(e) - player.w / 2;
      ensureAudio();
      vibrate(8);
    }

    function onPointerMove(e) {
      e.preventDefault();
      if (!pointerActive) return;
      player.targetX = getPointerX(e) - player.w / 2;
    }

    function onPointerEnd() {
      pointerActive = false;
    }

    canvas.addEventListener('touchstart', onPointerStart, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerEnd);
    canvas.addEventListener('touchcancel', onPointerEnd);

    canvas.addEventListener('mousedown', onPointerStart);
    canvas.addEventListener('mousemove', e => {
      if (pointerActive) onPointerMove(e);
    });
    window.addEventListener('mouseup', onPointerEnd);

    function shoot() {
      if (!gameRunning) return;
      const now = performance.now();
      const center = player.x + player.w / 2;
      const py = player.y + 2;

      if (selectedWeapon === 'beam') {
        // Fire rate scales with beamRate upgrades only
        const delays = [125, 95, 72, 52]; // level 0..3
        const fireDelay = Math.max(48, delays[beamRate] - difficulty * 3);
        if (now - lastShot < fireDelay) return;
        lastShot = now;
        const h = 26 + beamRate * 4;
        const w = 9 + beamRate;
        bullets.push({
          type: 'beam', x: center - w / 2, y: py, w, h,
          vx: 0, vy: -(15 + beamRate * 1.2), speed: 15 + beamRate * 1.2,
          side: 0, dmg: 1, rot: 0, pulse: Math.random() * Math.PI * 2
        });
      } else {
        // Homing rockets: faster movement → much higher fire rate
        // Standing still: ~every 280ms | full strafe: ~every 70ms
        const motion = Math.min(1.4, moveSpeed);
        const fireDelay = Math.max(65, 280 - motion * 160 - difficulty * 6);
        if (now - lastShot < fireDelay) return;
        lastShot = now;
        // At high speed sometimes launch a pair
        const count = motion > 0.85 && Math.random() < 0.45 ? 2 : 1;
        for (let k = 0; k < count; k++) {
          bullets.push({
            type: 'rocket',
            x: center - 7 + (k === 1 ? 10 : (count === 2 ? -6 : 0)),
            y: py,
            w: 14, h: 22,
            vx: (k === 1 ? 1.2 : (count === 2 ? -1.2 : 0)),
            vy: -4, speed: 5.5 + motion * 1.5, side: 0, dmg: 3, rot: 0,
            targetId: null, trailTimer: 0
          });
        }
      }
      if (bullets.length > 100) bullets.splice(0, bullets.length - 100);
    }

    function spawnEnemy() {
      const size = 42 + Math.random() * 22;
      const dcfg = DIFF[selectedDiff] || DIFF.medium;
      const fastChance = Math.min(0.05 + difficulty * 0.02, 0.18) * dcfg.fastMul;
      const tankChance = Math.min(0.03 + difficulty * 0.015, 0.14);
      const roll = Math.random();
      let type = 'normal';
      if (roll < tankChance) type = 'tank';
      else if (roll < tankChance + fastChance) type = 'fast';

      let speed, hp, color;
      const rocketSpeed = selectedWeapon === 'rockets' ? 1.15 + Math.min(0.35, (difficulty - 1) * 0.2) : 1;
      const speedBoost = (1 + (difficulty - 1) * 0.25) * dcfg.speedMul * rocketSpeed;

      if (type === 'fast') {
        speed = (2.2 + Math.random() * 1.0) * speedBoost;
        hp = 1;
        color = [255, 80, 120];
      } else if (type === 'tank') {
        speed = (0.85 + Math.random() * 0.5) * speedBoost;
        hp = dcfg.tankHp;
        color = [160, 80, 255];
      } else {
        speed = (1.2 + Math.random() * 0.9) * speedBoost;
        hp = 1;
        color = [255, 140 + Math.random() * 40, 40];
      }

      enemies.push({
        x: Math.random() * (W - size - 20) + 10,
        y: -size - 10,
        w: size,
        h: size,
        speed,
        hp,
        maxHp: hp,
        type,
        color,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.08
      });
      if (enemies.length > 55) enemies.splice(0, enemies.length - 55);
    }

    function createExplosion(x, y, color, count = 14, silent) {
      if (!silent) explosionSoundFromCount(count, x);
      const n = Math.max(3, Math.round(count * particleMul()));
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5.5 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.018 + Math.random() * 0.025,
          color,
          size: Math.random() * 4 + 1.5,
          type: Math.random() < 0.3 ? 'spark' : 'dust'
        });
      }
      const cap = settings.particles === 'low' ? 180 : settings.particles === 'high' ? 520 : 360;
      if (particles.length > cap) particles.splice(0, particles.length - cap);
    }

    function createHitSpark(x, y) {
      const n = Math.max(2, Math.round(5 * particleMul()));
      for (let i = 0; i < n; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 0.7,
          decay: 0.05,
          color: [0, 230, 255],
          size: Math.random() * 2.5 + 1,
          type: 'spark'
        });
      }
      if (particles.length > 420) particles.splice(0, particles.length - 420);
    }

    function updateCombo() {
      combo++;
      comboTimer = 90;
      if (combo >= 2) {
        comboEl.textContent = `x${combo}`;
        comboEl.classList.add('show');
      }
    }

    function formatTime(seconds) {
      const total = Math.floor(seconds);
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }

    function loseLife(vib, shakeAmt) {
      lives--;
      updateLives();
      combo = 0;
      comboEl.classList.remove('show');
      vibrate(vib);
      addShake(shakeAmt);
      if (lives <= 0) {
        gameOver();
        return true;
      }
      return false;
    }

    let bombOriginX = 0;
    let bombOriginY = 0;
    let bombShockwaves = [];

    function detonateBomb(ox, oy) {
      if (!gameRunning || isPaused) return;
      const bx = ox != null ? ox : W / 2;
      const by = oy != null ? oy : H * 0.45;
      bombOriginX = bx;
      bombOriginY = by;

      const bossWasActive = !!boss;
      let cleared = enemies.length;
      for (const e of enemies) {
        score += e.type === 'tank' ? 25 : 10;
        createExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color, 14, true);
      }
      enemies = [];

      if (boss) {
        createExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, [255, 80, 40], 80, true);
        boss = null;
        score += 500;
        bossBarWrap.style.display = 'none';
        bossLabel.style.display = 'none';
      }
      scoreEl.textContent = score;

      // Epic nuclear visual sequence
      bombFlash = 1.15;
      bombRing = 1;
      bombShockwaves = [
        { r: 0, max: Math.max(W, H) * 0.55, life: 1, width: 6, color: '255,240,180' },
        { r: 0, max: Math.max(W, H) * 0.85, life: 1, width: 4, color: '255,100,40' },
        { r: 0, max: Math.max(W, H) * 1.15, life: 1, width: 3, color: '180,40,255' }
      ];
      addShake(22);
      playExplosion('nuclear', (bx / Math.max(1, W)) * 2 - 1);

      createExplosion(bx, by, [255, 255, 200], 110, true);
      createExplosion(bx, by, [255, 160, 40], 80, true);
      createExplosion(bx, by, [255, 50, 30], 60, true);
      createExplosion(bx, by, [180, 40, 255], 40, true);

      // Secondary debris sparks
      for (let i = 0; i < 28; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 9;
        particles.push({
          x: bx, y: by,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1,
          decay: 0.012 + Math.random() * 0.02,
          color: Math.random() < 0.5 ? [255, 200, 80] : [255, 80, 40],
          size: 2 + Math.random() * 5,
          type: 'spark'
        });
      }

      showToast(bossWasActive ? '☢ ЯДЕРНЫЙ УДАР · БОСС УНИЧТОЖЕН!' : `☢ ЯДЕРНЫЙ УДАР · ЦЕЛЕЙ: ${cleared}`);
      vibrate([50, 30, 70, 30, 90]);
    }

    function spawnBombPickup() {
      const size = 40;
      powerUps.push({
        type: 'bomb',
        x: 24 + Math.random() * (W - size - 48),
        y: -size - 10,
        w: size,
        h: size,
        speed: 1.5 + Math.random() * 0.5,
        bob: Math.random() * Math.PI * 2
      });
    }

    function update() {
      if (!gameRunning || isPaused) return;
      time++;
      gameTime += 1 / 60; // approx seconds
      if (bombFlash > 0) bombFlash = Math.max(0, bombFlash - 0.022);
      if (bombRing > 0) bombRing = Math.max(0, bombRing - 0.018);
      for (let i = bombShockwaves.length - 1; i >= 0; i--) {
        const sw = bombShockwaves[i];
        sw.r += (sw.max - sw.r) * 0.08 + 6;
        sw.life -= 0.016;
        if (sw.life <= 0 || sw.r >= sw.max) bombShockwaves.splice(i, 1);
      }
      survivalTimeEl.textContent = formatTime(gameTime);

      // Difficulty ramps with time, capped by selected mode
      const dcfg = DIFF[selectedDiff] || DIFF.medium;
      if (selectedWeapon === 'rockets') {
        // Rocket mode: starts manageable, fully opens over ~30s, stays intense
        const t = Math.min(1, gameTime / 30);
        // Smooth ease-in then strong pressure
        const curve = t * t * (3 - 2 * t); // smoothstep
        const rocketCap = dcfg.cap * 1.85 + 0.55; // much higher than beam
        difficulty = 1 + curve * (rocketCap - 1);
      } else {
        difficulty = Math.min(dcfg.cap, 1 + Math.pow(gameTime / dcfg.timeDiv, 0.95));
      }

      // Smooth player movement
      if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.targetX += player.speed;

      player.targetX = Math.max(4, Math.min(W - player.w - 4, player.targetX));
      // Very smooth, almost magnetic follow — max comfort on mobile
      const prevX = player.x;
      player.x += (player.targetX - player.x) * sensitivityLerp();
      // Normalize movement intensity (px/frame → 0..1+)
      moveSpeed = Math.min(1.6, Math.abs(player.x - prevX) / 4.5);

      // Auto fire (slightly faster at higher difficulty)
      shoot();

      // Trail
      if (time % 2 === 0) {
        trails.push({
          x: player.x + player.w / 2,
          y: player.y + player.h,
          life: 1,
          size: 6 + Math.random() * 4
        });
        if (trails.length > 180) trails.shift();
      }

      // Bullets — beam / knives / homing rockets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.type === 'rocket') {
          // Seek nearest enemy or boss
          let tx = null, ty = null, best = 1e9;
          for (const e of enemies) {
            const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
            const d = (cx - b.x) * (cx - b.x) + (cy - b.y) * (cy - b.y);
            if (d < best) { best = d; tx = cx; ty = cy; }
          }
          if (boss) {
            const cx = boss.x + boss.w / 2, cy = boss.y + boss.h / 2;
            const d = (cx - b.x) * (cx - b.x) + (cy - b.y) * (cy - b.y);
            if (d < best) { best = d; tx = cx; ty = cy; }
          }
          if (tx != null) {
            const ang = Math.atan2(ty - (b.y + b.h / 2), tx - (b.x + b.w / 2));
            const turn = 0.12;
            const cur = Math.atan2(b.vy, b.vx || 0.001);
            let diff = ang - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const na = cur + Math.max(-turn, Math.min(turn, diff));
            const maxSpd = 9.5;
            b.speed = Math.min(maxSpd, b.speed + 0.12);
            b.vx = Math.cos(na) * b.speed;
            b.vy = Math.sin(na) * b.speed;
            b.rot = na + Math.PI / 2;
          } else {
            b.vy = Math.max(b.vy - 0.15, -b.speed);
            b.rot = Math.atan2(b.vy, b.vx || 0.001) + Math.PI / 2;
          }
          b.x += b.vx;
          b.y += b.vy;
          // Smoke trail
          b.trailTimer = (b.trailTimer || 0) + 1;
          if (b.trailTimer % 2 === 0) {
            particles.push({
              x: b.x + b.w / 2, y: b.y + b.h,
              vx: (Math.random() - 0.5) * 0.8, vy: 1 + Math.random(),
              life: 0.7, decay: 0.04,
              color: [255, 140 + Math.random() * 60, 40],
              size: 3 + Math.random() * 3, type: 'dust'
            });
          }
        } else if (b.type === 'knife') {
          b.x += b.vx;
          b.y += b.vy;
          b.rot += b.spin || 0.15;
        } else {
          b.x += b.vx || 0;
          b.y += b.vy != null ? b.vy : -b.speed;
        }
        if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) bullets.splice(i, 1);
      }

      // Enemies — spawn rate from difficulty preset (rockets: denser late-game)
      enemySpawnTimer++;
      const rocketMul = selectedWeapon === 'rockets' ? 1.35 : 1;
      const spawnRate = Math.max(
        selectedWeapon === 'rockets' ? Math.max(12, dcfg.spawnMin - 8) : dcfg.spawnMin,
        dcfg.spawnBase / rocketMul - difficulty * (selectedWeapon === 'rockets' ? 9 : 6)
      );
      if (enemySpawnTimer > spawnRate) {
        spawnEnemy();
        const doubleChance = selectedWeapon === 'rockets'
          ? (0.08 + difficulty * 0.08)
          : (selectedDiff === 'hard' ? 0.14 : 0.07);
        if (difficulty > 1.25 && Math.random() < doubleChance) {
          spawnEnemy();
        }
        // Rockets after 20s: occasional triple pressure
        if (selectedWeapon === 'rockets' && gameTime > 20 && difficulty > 1.8 && Math.random() < 0.12) {
          spawnEnemy();
        }
        enemySpawnTimer = 0;
      }

      // Nuclear bomb pickups — ~2 per minute (random interval ~20–40s)
      bombSpawnTimer++;
      if (bombSpawnTimer >= nextBombAt) {
        spawnBombPickup();
        bombSpawnTimer = 0;
        nextBombAt = 60 * (15 + Math.random() * 13); // 15–28 seconds, ~2.5/min
      }

      // Power-ups (falling bombs) — collect by touch OR shoot to detonate
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.speed;
        p.bob += 0.08;
        p.x += Math.sin(p.bob) * 0.4;

        let triggered = false;
        const px = p.x + p.w / 2;
        const py = p.y + p.h / 2;

        // Shot by player bullets → nuclear detonation
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < p.x + p.w && b.x + b.w > p.x &&
              b.y < p.y + p.h && b.y + b.h > p.y) {
            bullets.splice(j, 1);
            triggered = true;
            break;
          }
        }

        // Collect by touching ship
        if (!triggered &&
            p.x < player.x + player.w && p.x + p.w > player.x &&
            p.y < player.y + player.h && p.y + p.h > player.y) {
          triggered = true;
        }

        if (triggered) {
          powerUps.splice(i, 1);
          if (p.type === 'bomb') detonateBomb(px, py);
          continue;
        }

        if (p.y > H + 40) powerUps.splice(i, 1);
      }

      // Boss cadence from difficulty preset
      const bossRound = Math.floor(gameTime / dcfg.bossEvery);
      if (bossRound > bossSpawnedFor && !boss) {
        bossSpawnedFor = bossRound;
        const bossHp = dcfg.bossHp + bossRound * (selectedDiff === 'hard' ? 8 : 5);
        boss = { x: W/2 - 48, y: -100, w: 96, h: 64, hp: bossHp,
          maxHp: bossHp, phase: 0, fireClock: 0 };
        bossBarWrap.style.display = 'block';
        bossLabel.style.display = 'block';
        showToast('⚠ БОСС ПРИБЛИЖАЕТСЯ');
      }
      if (boss) {
        boss.phase += 0.035;
        boss.y = Math.min(82, boss.y + 1.25);
        boss.x = Math.max(8, Math.min(W - boss.w - 8,
          W/2 - boss.w/2 + Math.sin(boss.phase) * Math.max(0, W*0.32)));
        boss.fireClock++;
        if (boss.fireClock > 95) {
          boss.fireClock = 0;
          enemies.push({ x: boss.x + boss.w/2 - 14, y: boss.y + boss.h,
            w: 28, h: 28, speed: 2.6, hp: 1, maxHp: 1, type:'fast',
            color:[255,40,130], rot:0, rotSpeed:0.06 });
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < boss.x + boss.w && b.x + b.w > boss.x &&
              b.y < boss.y + boss.h && b.y + b.h > boss.y) {
            boss.hp -= (b.dmg || 1);
            bullets.splice(j, 1);
            createHitSpark(b.x, b.y);
            bossBar.style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
            if (boss.hp <= 0) {
              createExplosion(boss.x + boss.w/2, boss.y + boss.h/2, [255,45,150], 60, true);
              playExplosion('boss', ((boss.x + boss.w/2) / Math.max(1, W)) * 2 - 1);
              score += 500;
              scoreEl.textContent = score;
              boss = null;
              bossBarWrap.style.display = 'none';
              bossLabel.style.display = 'none';
              showToast('БОСС УНИЧТОЖЕН');
              vibrate([20,30,20,30,60]); addShake(12);
              break; // Critical: stop checking bullets after boss becomes null.
            }
          }
        }
      }
      if (powerModeTimer > 0) powerModeTimer--;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;
        e.rot += e.rotSpeed;

        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x &&
              b.y < e.y + e.h && b.y + b.h > e.y) {
            e.hp -= (b.dmg || 1);
            createHitSpark(b.x + b.w / 2, b.y);
            if (b.type === 'beam') {
              createExplosion(b.x + b.w / 2, b.y, [0, 230, 255], 8, true);
              createHitSpark(e.x + e.w / 2, e.y + e.h / 2);
            }
            bullets.splice(j, 1);

            if (e.hp <= 0) {
              const killColor = b.type === 'beam' ? [80, 240, 255] : e.color;
              createExplosion(e.x + e.w / 2, e.y + e.h / 2, killColor, e.type === 'tank' ? 26 : 16);
              if (b.type === 'beam') createExplosion(e.x + e.w / 2, e.y + e.h / 2, [255, 255, 255], 10, true);
              enemies.splice(i, 1);
              const points = e.type === 'tank' ? 30 : (e.type === 'fast' ? 15 : 10);
              score += points * Math.min(combo + 1, 5);
              scoreEl.textContent = score;
              updateCombo();
              vibrate(e.type === 'tank' ? [12, 30, 12] : 15);
              addShake(e.type === 'tank' ? 8 : 4);
            } else {
              vibrate(6);
              addShake(2);
            }
            break;
          }
        }

        // The enemy may have been removed after a bullet hit; do not process it again.
        if (e.hp <= 0) continue;

        // Player collision — smaller hurtbox for comfort
        if (e.x < player.x + player.w - 14 && e.x + e.w > player.x + 14 &&
            e.y < player.y + player.h - 10 && e.y + e.h > player.y + 10) {
          createExplosion(e.x + e.w / 2, e.y + e.h / 2, [255, 60, 80], 20);
          enemies.splice(i, 1);
          if (loseLife([30, 40, 50], 12)) return;
        }

        // Off screen
        if (e.y > H + 50) {
          enemies.splice(i, 1);
          if (loseLife(25, 6)) return;
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Trails
      for (let i = trails.length - 1; i >= 0; i--) {
        trails[i].life -= 0.06;
        trails[i].y += 1.5;
        if (trails[i].life <= 0) trails.splice(i, 1);
      }

      // Combo timer
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
          combo = 0;
          comboEl.classList.remove('show');
        }
      }

      // Shake decay
      if (shake > 0) shake *= 0.85;
      if (shake < 0.3) shake = 0;

      // Stars + map props
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) {
          s.y = -5;
          s.x = Math.random() * W;
        }
      }
      for (const c of nebulaClouds) {
        c.y += c.speed;
        if (c.y - c.r > H) {
          c.y = -c.r;
          c.x = Math.random() * W;
        }
      }
      for (const a of asteroids) {
        a.y += a.speed;
        a.rot += a.rotSpeed;
        if (a.y - a.r > H) {
          a.y = -a.r;
          a.x = Math.random() * W;
        }
      }
    }

    function drawShip(x, y, w, h) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      // Strong engine glow
      const glow = 0.65 + Math.sin(time * 0.28) * 0.35;
      const grad = ctx.createRadialGradient(0, h / 2 + 8, 0, 0, h / 2 + 14, 28);
      grad.addColorStop(0, `rgba(180, 100, 255, ${glow})`);
      grad.addColorStop(0.4, `rgba(0, 220, 255, ${glow * 0.5})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, h / 2 + 12, 28, 0, Math.PI * 2);
      ctx.fill();

      // Soft body glow
      const bodyG = ctx.createRadialGradient(0, 0, 4, 0, 0, w * 0.55);
      bodyG.addColorStop(0, 'rgba(0, 220, 255, 0.25)');
      bodyG.addColorStop(1, 'transparent');
      ctx.fillStyle = bodyG;
      ctx.beginPath();
      ctx.arc(0, 0, w * 0.55, 0, Math.PI * 2);
      ctx.fill();

      // Main body
      ctx.fillStyle = '#f0f9ff';
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 - 4);
      ctx.lineTo(w / 2 - 1, h / 2 - 8);
      ctx.lineTo(w / 2 - 10, h / 2 + 2);
      ctx.lineTo(0, h / 2 - 12);
      ctx.lineTo(-(w / 2 - 10), h / 2 + 2);
      ctx.lineTo(-(w / 2 - 1), h / 2 - 8);
      ctx.closePath();
      ctx.fill();

      // Edge highlight
      ctx.strokeStyle = 'rgba(0, 220, 255, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Cockpit
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.ellipse(0, -h / 6, 9, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(-2, -h / 6 - 2, 3.5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wings accent
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.moveTo(-w / 2 + 6, h / 2 - 10);
      ctx.lineTo(-w / 2 - 6, h / 2 + 4);
      ctx.lineTo(-w / 2 + 14, h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w / 2 - 6, h / 2 - 10);
      ctx.lineTo(w / 2 + 6, h / 2 + 4);
      ctx.lineTo(w / 2 - 14, h / 2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x + e.w / 2, e.y + e.h / 2);
      ctx.rotate(e.rot);

      const [r, g, b] = e.color;
      const scale = 0.5 + (e.hp / e.maxHp) * 0.5;

      // Outer glow
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, e.w * 0.7);
      glow.addColorStop(0, `rgba(${r},${g},${b},0.35)`);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, e.w * 0.7, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      if (e.type === 'tank') {
        // Hexagon
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
          const px = Math.cos(a) * e.w * 0.48;
          const py = Math.sin(a) * e.h * 0.48;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else if (e.type === 'fast') {
        // Diamond / arrow
        ctx.moveTo(0, -e.h * 0.5);
        ctx.lineTo(e.w * 0.45, 0);
        ctx.lineTo(0, e.h * 0.5);
        ctx.lineTo(-e.w * 0.45, 0);
        ctx.closePath();
      } else {
        // Classic alien
        ctx.moveTo(0, -e.h * 0.48);
        ctx.lineTo(e.w * 0.48, e.h * 0.25);
        ctx.lineTo(e.w * 0.28, e.h * 0.48);
        ctx.lineTo(-e.w * 0.28, e.h * 0.48);
        ctx.lineTo(-e.w * 0.48, e.h * 0.25);
        ctx.closePath();
      }
      ctx.fill();

      // Eyes / core
      ctx.fillStyle = '#0f0f1a';
      ctx.beginPath();
      ctx.arc(-e.w * 0.15, -e.h * 0.08, e.w * 0.1, 0, Math.PI * 2);
      ctx.arc(e.w * 0.15, -e.h * 0.08, e.w * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // HP indicator for tanks
      if (e.type === 'tank' && e.hp < e.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-e.w * 0.3, e.h * 0.55, e.w * 0.6, 5);
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(-e.w * 0.3, e.h * 0.55, e.w * 0.6 * (e.hp / e.maxHp), 5);
      }

      ctx.restore();
    }

    function draw() {
      // Background (map-dependent)
      ctx.fillStyle = currentMap.bg;
      ctx.fillRect(0, 0, W, H);

      // Nebula clouds (Crimson map)
      for (const c of nebulaClouds) {
        const ng = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        ng.addColorStop(0, `hsla(${c.hue}, 80%, 45%, ${c.alpha})`);
        ng.addColorStop(0.5, `hsla(${c.hue + 20}, 70%, 30%, ${c.alpha * 0.5})`);
        ng.addColorStop(1, 'transparent');
        ctx.fillStyle = ng;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Vignette
      const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
      vig.addColorStop(0, 'transparent');
      vig.addColorStop(1, currentMap.vignette);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);

      // Screen shake
      ctx.save();
      if (shake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * shake,
          (Math.random() - 0.5) * shake
        );
      }

      // Stars
      const [sr, sg, sb] = currentMap.starColor;
      for (const s of stars) {
        ctx.fillStyle = `rgba(${sr},${sg},${sb},${s.brightness})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Asteroids (Crimson map)
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.fillStyle = 'rgba(120, 70, 90, 0.55)';
        ctx.beginPath();
        ctx.moveTo(a.r, 0);
        for (let i = 1; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          const rr = a.r * (0.7 + (i % 2) * 0.3);
          ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Engine trails
      for (const t of trails) {
        ctx.globalAlpha = t.life * 0.6;
        const tg = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.size);
        tg.addColorStop(0, 'rgba(168, 85, 247, 0.8)');
        tg.addColorStop(0.5, 'rgba(0, 212, 255, 0.3)');
        tg.addColorStop(1, 'transparent');
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Projectiles
      for (const b of bullets) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        if (b.type === 'rocket') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(b.rot || 0);
          const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 16);
          rg.addColorStop(0, 'rgba(255,160,40,0.9)');
          rg.addColorStop(1, 'transparent');
          ctx.fillStyle = rg;
          ctx.beginPath();
          ctx.arc(0, 8, 14, 0, Math.PI * 2);
          ctx.fill();
          // Body
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(6, 8);
          ctx.lineTo(0, 5);
          ctx.lineTo(-6, 8);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#f97316';
          ctx.fillRect(-3, 6, 6, 5);
          // Flame
          ctx.fillStyle = `rgba(255,${120 + Math.random()*80},30,0.9)`;
          ctx.beginPath();
          ctx.moveTo(-3, 11);
          ctx.lineTo(0, 18 + Math.random() * 6);
          ctx.lineTo(3, 11);
          ctx.fill();
          ctx.restore();
        } else if (b.type === 'knife') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(b.rot || 0);
          ctx.fillStyle = '#e2e8f0';
          ctx.beginPath();
          ctx.moveTo(0, -11);
          ctx.lineTo(4, 6);
          ctx.lineTo(0, 3);
          ctx.lineTo(-4, 6);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-1.5, 3, 3, 8);
          ctx.fillStyle = '#f472b6';
          ctx.fillRect(-2, 9, 4, 2);
          ctx.restore();
        } else {
          // Neon beam strip — core + outer glow + tip flare
          b.pulse = (b.pulse || 0) + 0.35;
          const pulse = 0.75 + Math.sin(b.pulse) * 0.25;
          const glowR = 12 + beamRate * 2;
          const outer = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR + 8);
          outer.addColorStop(0, `rgba(120,255,255,${0.55 * pulse})`);
          outer.addColorStop(0.45, `rgba(0,200,255,${0.25 * pulse})`);
          outer.addColorStop(1, 'transparent');
          ctx.fillStyle = outer;
          ctx.beginPath();
          ctx.arc(cx, cy, glowR + 8, 0, Math.PI * 2);
          ctx.fill();

          // Soft vertical streak
          const streak = ctx.createLinearGradient(cx, b.y - 6, cx, b.y + b.h + 8);
          streak.addColorStop(0, 'rgba(180,255,255,0)');
          streak.addColorStop(0.2, `rgba(0,245,255,${0.35 * pulse})`);
          streak.addColorStop(0.5, `rgba(255,255,255,${0.5 * pulse})`);
          streak.addColorStop(1, 'rgba(0,180,255,0)');
          ctx.fillStyle = streak;
          ctx.fillRect(cx - (4 + beamRate), b.y - 8, 8 + beamRate * 2, b.h + 16);

          // Core body
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(b.x + 2, b.y, Math.max(2, b.w - 4), b.h);
          ctx.fillStyle = '#67e8f9';
          ctx.fillRect(b.x, b.y + 2, b.w, Math.max(2, b.h - 4));
          ctx.fillStyle = '#22d3ee';
          ctx.fillRect(b.x + 1, b.y + 4, Math.max(1, b.w - 2), Math.max(1, b.h - 8));

          // Bright tip
          ctx.fillStyle = `rgba(255,255,255,${pulse})`;
          ctx.beginPath();
          ctx.arc(cx, b.y + 2, 3 + beamRate * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Enemies
      for (const e of enemies) {
        drawEnemy(e);
      }

      // Neon boss
      if (boss) {
        ctx.save();
        ctx.shadowBlur = 24; ctx.shadowColor = '#ff2d75';
        ctx.fillStyle = '#a21caf';
        ctx.beginPath();
        ctx.moveTo(boss.x + boss.w*.5, boss.y + boss.h);
        ctx.lineTo(boss.x, boss.y + boss.h*.2);
        ctx.lineTo(boss.x + boss.w*.12, boss.y);
        ctx.lineTo(boss.x + boss.w*.88, boss.y);
        ctx.lineTo(boss.x + boss.w, boss.y + boss.h*.2);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#ff6aa9'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillRect(boss.x+22,boss.y+20,12,6);
        ctx.fillRect(boss.x+boss.w-34,boss.y+20,12,6);
        ctx.fillStyle = '#ff2d75'; ctx.fillRect(boss.x+boss.w*.35,boss.y+36,boss.w*.3,5);
        ctx.restore();
      }

      // Falling nuclear bomb pickups (large, easy to catch)
      for (const p of powerUps) {
        if (p.type !== 'bomb') continue;
        const cx = p.x + p.w / 2;
        const cy = p.y + p.h / 2;
        const pulse = 0.7 + Math.sin(time * 0.15 + p.bob) * 0.3;
        ctx.save();
        const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 32);
        g.addColorStop(0, `rgba(255, 180, 40, ${0.6 * pulse})`);
        g.addColorStop(0.5, `rgba(255, 60, 30, ${0.28 * pulse})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(cx, cy + 2, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff6b2d';
        ctx.beginPath();
        ctx.arc(cx, cy + 2, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffe566';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☢', cx, cy + 2);
        ctx.fillStyle = '#c2410c';
        ctx.fillRect(cx - 18, cy + 12, 8, 10);
        ctx.fillRect(cx + 10, cy + 12, 8, 10);
        ctx.restore();
      }

      // Player
      drawShip(player.x, player.y, player.w, player.h);

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        if (p.type === 'spark') {
          ctx.fillStyle = `rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${p.life})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Nuclear detonation — multi-layer flash + shockwaves from impact point
      if (bombFlash > 0 || bombShockwaves.length) {
        ctx.save();
        const ox = bombOriginX || W / 2;
        const oy = bombOriginY || H * 0.45;

        if (bombFlash > 0) {
          // Full-screen white-hot core
          ctx.globalAlpha = Math.min(0.85, bombFlash * 0.9);
          const flash = ctx.createRadialGradient(ox, oy, 4, ox, oy, Math.max(W, H) * 0.95);
          flash.addColorStop(0, 'rgba(255,255,255,1)');
          flash.addColorStop(0.08, 'rgba(255,255,210,1)');
          flash.addColorStop(0.22, 'rgba(255,200,60,0.95)');
          flash.addColorStop(0.45, 'rgba(255,80,30,0.65)');
          flash.addColorStop(0.7, 'rgba(160,30,120,0.35)');
          flash.addColorStop(1, 'rgba(40,0,40,0)');
          ctx.fillStyle = flash;
          ctx.fillRect(0, 0, W, H);

          // Secondary screen tint
          ctx.globalAlpha = Math.min(0.35, bombFlash * 0.4);
          ctx.fillStyle = 'rgba(255, 60, 20, 1)';
          ctx.fillRect(0, 0, W, H);
        }

        // Expanding shockwave rings
        for (const sw of bombShockwaves) {
          ctx.globalAlpha = Math.max(0, sw.life * 0.9);
          ctx.strokeStyle = `rgba(${sw.color},${sw.life})`;
          ctx.lineWidth = sw.width + (1 - sw.life) * 8;
          ctx.beginPath();
          ctx.arc(ox, oy, sw.r, 0, Math.PI * 2);
          ctx.stroke();
          // Soft outer glow ring
          ctx.globalAlpha = Math.max(0, sw.life * 0.25);
          ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.arc(ox, oy, sw.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function updateLives() {
      if (lives <= 0) {
        livesEl.textContent = '💀';
      } else {
        livesEl.textContent = '♥ '.repeat(lives).trim();
      }
    }

    function startGame() {
      score = 0;
      lives = 4;
      boss = null; bossSpawnedFor = 0; powerModeTimer = 0;
      bombFlash = 0; bombRing = 0; bombSpawnTimer = 0; bombShockwaves = [];
      nextBombAt = 60 * (8 + Math.random() * 10); // first bomb after ~8–18s
      powerUps = [];
      bossBarWrap.style.display = 'none'; bossLabel.style.display = 'none';
      overlay.innerHTML = renderMainMenu();
      bindMainMenu();
      combo = 0;
      comboTimer = 0;
      gameTime = 0;
      difficulty = 1;
      bullets = [];
      enemies = [];
      particles = [];
      trails = [];
      shake = 0;
      scoreEl.textContent = '0';
      survivalTimeEl.textContent = '0:00';
      isPaused = false;
      pauseBtn.textContent = 'Ⅱ';
      updateLives();
      comboEl.classList.remove('show');
      player.x = W / 2 - player.w / 2;
      player.targetX = player.x;
      overlay.classList.add('hidden');
      hint.classList.add('hidden');
      gameRunning = true;
      enemySpawnTimer = 0;
      lastShot = 0;
      if (!animationId) loop();
      ensureAudio();
      vibrate(20);
    }

    function gameOver() {
      gameRunning = false;
      isPaused = false;
      pauseBtn.textContent = 'Ⅱ';
      const earned = Math.floor(score / 14) + Math.floor(gameTime / 5);
      credits += earned;
      try { localStorage.setItem('spaceBlastCredits', String(credits)); } catch(e) {}
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        try { localStorage.setItem('spaceBlastBest', String(bestScore)); } catch(e) {}
      }
      vibrate([40, 60, 80, 60, 100]);
      overlay.innerHTML = `
        <h1>GAME OVER</h1>
        <div id="final-score">${score}</div>
        <div id="final-label">очков · +${earned} ⚡</div>
        <button class="btn" id="restart-btn">ЕЩЁ РАЗ</button>
        <button class="btn-secondary" id="menu-btn" style="margin-top:12px">В МЕНЮ</button>
      `;
      overlay.classList.remove('hidden');
      document.getElementById('restart-btn').addEventListener('click', startGame);
      document.getElementById('menu-btn').addEventListener('click', showMainMenu);
    }

    function togglePause() {
      if (!gameRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶' : 'Ⅱ';
      if (isPaused) {
        overlay.innerHTML = `
          <h1>ПАУЗА</h1>
          <p class="subtitle">Игра остановлена.</p>
          <div class="menu-actions">
            <button class="btn" id="resume-btn">ПРОДОЛЖИТЬ</button>
            <button class="btn-secondary" id="pause-settings-btn">⚙ НАСТРОЙКИ</button>
            <button class="btn-secondary" id="pause-menu-btn">В ГЛАВНОЕ МЕНЮ</button>
          </div>
        `;
        overlay.classList.remove('hidden');
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('pause-settings-btn').addEventListener('click', openSettings);
        document.getElementById('pause-menu-btn').addEventListener('click', showMainMenu);
      } else {
        overlay.classList.add('hidden');
      }
    }

    pauseBtn.addEventListener('click', togglePause);
    window.addEventListener('keydown', e => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && gameRunning && !isPaused) togglePause();
    });

    function showToast(message) {
      powerToast.textContent = message;
      powerToast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => powerToast.classList.remove('show'), 1500);
    }

    function selStyle(active) {
      return active
        ? 'border-color:#00e5ff;box-shadow:0 0 14px rgba(0,229,255,.3);background:rgba(0,229,255,.12)'
        : '';
    }

    function renderMainMenu() {
      const nextCost = beamRate < 3 ? BEAM_RATE_COSTS[beamRate] : null;
      const rateLabel = ['базовая', 'быстрая', 'очень быстрая', 'максимум'][beamRate];
      let beamRow = `<div style="color:#94a3b8;font-size:12px;margin-bottom:6px">Скорость луча: <b style="color:#67e8f9">${rateLabel}</b> · ${beamRate}/3</div>`;
      if (nextCost != null) {
        beamRow += `<button class="btn-secondary" id="buy-beam-rate" ${credits < nextCost ? 'disabled' : ''} style="width:100%;margin-bottom:10px">⚡ Ускорить луч · ${nextCost} (есть ${credits})</button>`;
      } else {
        beamRow += `<div style="color:#64748b;font-size:11px;margin-bottom:10px">Луч на максимальной скорострельности</div>`;
      }
      return `<h1>SPACE BLAST</h1>
        <p class="subtitle">CRIMSON NEBULA · ${credits} ⚡</p>
        <div style="width:min(300px,100%);text-align:left;margin-bottom:10px">
          <div style="color:#64748b;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">СЛОЖНОСТЬ</div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
            <button class="btn-secondary diff-btn" data-diff="easy" style="${selStyle(selectedDiff==='easy')}">Лёгкий</button>
            <button class="btn-secondary diff-btn" data-diff="medium" style="${selStyle(selectedDiff==='medium')}">Средний</button>
            <button class="btn-secondary diff-btn" data-diff="hard" style="${selStyle(selectedDiff==='hard')}">Сложный</button>
          </div>
          <div style="color:#64748b;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">ОРУЖИЕ</div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">
            <button class="btn-secondary wpn-btn" data-wpn="beam" style="${selStyle(selectedWeapon==='beam')}">━━ Неоновый луч</button>
            <button class="btn-secondary wpn-btn" data-wpn="rockets" style="${selStyle(selectedWeapon==='rockets')}">🚀 Ракеты (скорость = больше выстрелов)</button>
          </div>
          <div style="color:#64748b;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">ПРОКАЧКА ЛУЧА (только скорострельность)</div>
          ${beamRow}
        </div>
        <div class="menu-actions">
          <button class="btn" id="start-btn">ИГРАТЬ</button>
          <button class="btn-secondary" id="settings-btn">⚙ НАСТРОЙКИ</button>
        </div>`;
    }

    function openSettings() {
      gameRunning = false;
      isPaused = false;
      const row = (label, key, options) => {
        const btns = options.map(([val, name]) =>
          `<button class="btn-secondary set-opt" data-key="${key}" data-val="${val}" style="padding:10px 12px;font-size:13px;${selStyle(String(settings[key])===String(val))}">${name}</button>`
        ).join('');
        return `<div style="margin-bottom:12px"><div style="color:#64748b;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">${label}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${btns}</div></div>`;
      };
      overlay.innerHTML = `<h1>НАСТРОЙКИ</h1>
        <p class="subtitle">Сохраняются на этом устройстве</p>
        <div style="width:min(320px,100%);text-align:left;max-height:58vh;overflow:auto;padding:0 4px">
          ${row('ЗВУК', 'sound', [[true,'Вкл'],[false,'Выкл']])}
          ${row('ВИБРАЦИЯ', 'vibration', [[true,'Вкл'],[false,'Выкл']])}
          ${row('ТРЯСКА ЭКРАНА', 'shake', [['off','Выкл'],['low','Слабо'],['medium','Средне'],['high','Сильно']])}
          ${row('ЧАСТИЦЫ / ЭФФЕКТЫ', 'particles', [['low','Мало'],['medium','Норм'],['high','Много']])}
          ${row('ЧУВСТВИТЕЛЬНОСТЬ', 'sensitivity', [['low','Медленно'],['medium','Норм'],['high','Быстро']])}
        </div>
        <div class="menu-actions" style="margin-top:14px">
          <button class="btn-secondary" id="settings-back">НАЗАД</button>
        </div>`;
      overlay.classList.remove('hidden');
      overlay.querySelectorAll('.set-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          let val = btn.dataset.val;
          if (key === 'vibration' || key === 'sound') val = val === 'true';
          settings[key] = val;
          saveSettings();
          if (key === 'vibration' && val) vibrate(18);
          if (key === 'sound' && val) playExplosion('medium', 0);
          openSettings();
        });
      });
      document.getElementById('settings-back').addEventListener('click', showMainMenu);
    }

    function bindMainMenu() {
      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('settings-btn').addEventListener('click', openSettings);
      const buyBeam = document.getElementById('buy-beam-rate');
      if (buyBeam) buyBeam.addEventListener('click', () => {
        if (beamRate >= 3) return;
        const cost = BEAM_RATE_COSTS[beamRate];
        if (credits < cost) return;
        credits -= cost;
        beamRate += 1;
        try {
          localStorage.setItem('spaceBlastCredits', String(credits));
          localStorage.setItem('spaceBlastBeamRate', String(beamRate));
        } catch(e) {}
        vibrate(16);
        showMainMenu();
      });
      overlay.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedDiff = btn.dataset.diff;
          try { localStorage.setItem('spaceBlastDiff', selectedDiff); } catch(e) {}
          showMainMenu();
        });
      });
      overlay.querySelectorAll('.wpn-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedWeapon = btn.dataset.wpn;
          try { localStorage.setItem('spaceBlastWeapon', selectedWeapon); } catch(e) {}
          showMainMenu();
        });
      });
    }

    function showMainMenu() {
      gameRunning = false; isPaused = false;
      bullets = []; enemies = []; particles = []; trails = []; powerUps = [];
      bombShockwaves = [];
      boss = null; bossBarWrap.style.display = 'none'; bossLabel.style.display = 'none';
      comboEl.classList.remove('show'); powerToast.classList.remove('show');
      overlay.innerHTML = renderMainMenu();
      overlay.classList.remove('hidden');
      bindMainMenu();
    }

    startBtn.addEventListener('click', startGame);

    // Initial draw
    draw();
  </script>
</body>
</html>
