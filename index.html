<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>vlburukov — Space Blast</title>
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="Space Blast — neon arcade shooter">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space Blast">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="space-blast-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="space-blast-icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: #0A0A0A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
      position: fixed;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #0A0A0A;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left, .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    .hud-right { align-items: flex-end; }
    .hud-mini {
      padding: 5px 10px;
      border-radius: 12px;
      background: rgba(10,10,10,0.72);
      border: 1px solid rgba(255,255,255,0.1);
      color: #9CA3AF;
      font-size: 10px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .hud-mini b { color: #F3F4F6; margin-left: 4px; font-size: 12px; }
    .hud-label { color: #9CA3AF; font-size: 9px; letter-spacing: 1.5px; margin-bottom: 2px; }
    #defense-toggle {
      pointer-events: auto; touch-action: manipulation; cursor: pointer;
      border: 1px solid rgba(80, 210, 255, 0.38);
      background: rgba(7, 18, 32, 0.86); color: #9bb6c8;
      border-radius: 11px; padding: 7px 9px; min-height: 34px;
      font-size: 9px; line-height: 1.15; font-weight: 800; letter-spacing: .35px;
      white-space: nowrap; box-shadow: 0 0 12px rgba(40,170,255,.08);
    }
    #defense-toggle.active { color: #75e5ff; border-color: rgba(80,220,255,.8);
      background: rgba(10,65,90,.72); box-shadow: 0 0 14px rgba(40,190,255,.22); }
    #pause-btn {
      pointer-events: auto;
      border: 1px solid rgba(90,228,170,0.45);
      background: rgba(10,10,10,0.75);
      color: #5AE4AA;
      width: 42px; height: 42px;
      border-radius: 14px;
      font-size: 20px; font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    #pause-btn:active { transform: scale(.94); }
    #score-box[hidden], #best-score[hidden] { display: none !important; }
    #score-box {
      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 16px;
      border: 1px solid rgba(90, 228, 170, 0.28);
    }

    #score {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #5AE4AA;
      text-shadow: 0 0 12px rgba(90, 228, 170, 0.35);
    }

    #lives {
      font-size: 18px;
      letter-spacing: 4px;
      color: #F87171;
      text-shadow: none;
      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #FFFFFF;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #overlay .subtitle {
      color: #9CA3AF;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    #final-score {
      font-size: 56px;
      font-weight: 800;
      margin: 8px 0 6px;
      color: #5AE4AA;
      text-shadow: 0 0 24px rgba(90, 228, 170, 0.3);
    }

    #final-label {
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn {
      background: #5AE4AA;
      border: none;
      color: #0A0A0A;
      font-size: 17px;
      font-weight: 800;
      padding: 16px 48px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
      box-shadow: 0 4px 20px rgba(90, 228, 170, 0.25);
      letter-spacing: 0.5px;
    }

    .btn:active { transform: scale(0.96); filter: brightness(0.95); }
    .menu-actions { display:flex; flex-direction:column; gap:12px; width:min(280px,100%); }
    .btn-secondary {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.14);
      color: #F3F4F6;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: none;
    }
    .btn-secondary:active { border-color: rgba(90,228,170,0.55); color: #5AE4AA; }
    .shop-card {
      width:min(340px,100%); max-height:62vh; overflow:auto; margin:0 0 14px;
      padding:12px; border:1px solid rgba(255,255,255,0.1); border-radius:16px;
      background:rgba(16,16,16,.95); text-align:left;
    }
    .shop-row { display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 4px; border-bottom:1px solid rgba(148,163,184,.12); }
    .shop-row:last-child { border-bottom:0; }
    .shop-name { color:#e2e8f0; font-size:14px; font-weight:700; }
    .shop-desc { color:#94a3b8; font-size:11px; margin-top:3px; }
    .shop-buy { border:1px solid rgba(90,228,170,.5); background:rgba(90,228,170,.12);
      color:#5AE4AA; border-radius:12px; padding:9px 10px; font-weight:700; min-width:76px; }
    .shop-buy:disabled { opacity:.35; }
    #boss-bar-wrap { position:absolute; top:126px; left:12%; width:76%; height:10px;
      border:1px solid rgba(90,228,170,.55); border-radius:8px; overflow:hidden;
      background:rgba(0,0,0,.65); z-index:12; display:none; }
    #boss-bar { height:100%; width:100%; background:#5AE4AA;
      box-shadow:0 0 12px rgba(90,228,170,.45); transition:width .1s; }
    #boss-label { position:absolute; top:108px; width:100%; text-align:center; font-size:10px;
      color:#5AE4AA; letter-spacing:3px; z-index:12; display:none; text-shadow:none; }
    .power-toast { position:absolute; top:150px; left:0; right:0; text-align:center;
      color:#5AE4AA; font-weight:800; font-size:13px; text-shadow:0 0 12px rgba(90,228,170,.35);
      z-index:16; pointer-events:none; opacity:0; transition:opacity .2s; }
    .power-toast.show { opacity:1; }

    #combo {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 800;
      color: #5AE4AA;
      text-shadow: 0 0 16px rgba(90, 228, 170, 0.45);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      z-index: 15;
    }

    #combo.show {
      opacity: 1;
    }

    .hint {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      color: #475569;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
      padding: 0 20px;
    }

    .hint.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="hud-left">
        <div class="hud-mini">ВРЕМЯ <b id="survival-time">0:00</b></div>
        <button id="defense-toggle" type="button" aria-pressed="false">ПЕРЕХВАТ: ВЫКЛ</button>
        <div id="score-box" hidden><div id="score">0</div></div>
        <span id="best-score" hidden>0</span>
      </div>
      <div class="hud-right">
        <div id="lives">♥ ♥ ♥ ♥</div>
        <button id="pause-btn" aria-label="Пауза">Ⅱ</button>
      </div>
    </div>

    <div id="combo">x2</div>
    <div id="boss-label">БИТВА С БОССОМ</div>
    <div id="boss-bar-wrap"><div id="boss-bar"></div></div>
    <div id="power-toast" class="power-toast"></div>

    <canvas id="game"></canvas>

    <div class="hint" id="hint"></div>

    <div id="overlay">
      <h1>SPACE BLAST</h1>
      <p class="subtitle">NEON ARCADE · ВЫЖИВАНИЕ<br>Боссы · оружие · улучшения</p>
      <div class="menu-actions">
        <button class="btn" id="start-btn">ИГРАТЬ</button>
      </div>
    </div>
  </div>

  <script>
    const IS_FIREFOX = /firefox|fxios/i.test(navigator.userAgent);
    const canvas = document.getElementById('game');
    // Firefox can stutter with desynchronized high-DPI Canvas layers on some GPUs.
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: !IS_FIREFOX });
    const gradientCache = new Map();
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const hint = document.getElementById('hint');
    const comboEl = document.getElementById('combo');
    const bestScoreEl = document.getElementById('best-score');
    const survivalTimeEl = document.getElementById('survival-time');
    const pauseBtn = document.getElementById('pause-btn');
    const defenseToggle = document.getElementById('defense-toggle');
    const bossBarWrap = document.getElementById('boss-bar-wrap');
    const bossBar = document.getElementById('boss-bar');
    const bossLabel = document.getElementById('boss-label');
    const powerToast = document.getElementById('power-toast');
    let W, H, dpr;
    let animationId = null;
    let gameRunning = false;
    let isPaused = false;
    let score = 0;
    let bestScore = 0;
    try {
      bestScore = Number(localStorage.getItem('spaceBlastBest') || 0);
    } catch(e) {}
    bestScoreEl.textContent = bestScore;

    let moveSpeed = 0;
    // Adaptive action director — dynamic difficulty + events
    let director = {
      pressure: 1,
      killStreak: 0,
      safeTimer: 0,
      eventTimer: 0,
      nextEvent: 16,
      mode: 'flow' // flow | assault | swarm | calm
    };

    // Settings (saved)
    let settings = {
      sound: true,
      shake: 'medium',
      particles: 'medium',
      haptics: true
    };
    try {
      settings = Object.assign(settings, JSON.parse(localStorage.getItem('spaceBlastSettings') || '{}'));
      delete settings['vibration']; // discard old saved preference
    } catch(e) {}

    function saveSettings() {
      try { localStorage.setItem('spaceBlastSettings', JSON.stringify(settings)); } catch(e) {}
    }

    // --- Immersive procedural audio ---
    let audioCtx = null;
    let masterGain = null;
    let audioCompressor = null;
    let noiseBuffer = null;

    function resumeAudioSafely(audio) {
      if (!audio || audio.state === 'running') return;
      try {
        const result = audio.resume();
        if (result && typeof result.catch === 'function') result.catch(() => {});
      } catch (e) {}
    }

    function unlockAudio() {
      if (!settings.sound) return;
      const audio = ensureAudio();
      resumeAudioSafely(audio);
    }

    // iOS Safari needs Web Audio to be created/resumed during a real user gesture.
    // Listen to both legacy touch events and Pointer Events for broad iPhone/iPad support.
    document.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });
    document.addEventListener('pointerdown', unlockAudio, true);
    document.addEventListener('click', unlockAudio, true);

    function ensureAudio() {
      if (!settings.sound) return null;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          // Firefox can expose harsh clipping when several procedural SFX overlap.
          // A gentle master compressor keeps peaks controlled without muting explosions.
          audioCompressor = audioCtx.createDynamicsCompressor();
          audioCompressor.threshold.setValueAtTime(-19, audioCtx.currentTime);
          audioCompressor.knee.setValueAtTime(22, audioCtx.currentTime);
          audioCompressor.ratio.setValueAtTime(10, audioCtx.currentTime);
          audioCompressor.attack.setValueAtTime(0.004, audioCtx.currentTime);
          audioCompressor.release.setValueAtTime(0.18, audioCtx.currentTime);
          masterGain.gain.value = 0.48;
          // Keep the original dynamic range: avoid aggressive compression artifacts in Firefox.
          masterGain.connect(audioCtx.destination);

          const len = Math.max(1, Math.floor(audioCtx.sampleRate * 2.6));
          noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

          audioCtx.addEventListener?.('statechange', () => {
            if (audioCtx && audioCtx.state === 'running' && musicPlaying) scheduleMusic();
          });
        }
        // On iOS the context may become suspended/interrupted after app switching or locking.
        // A fresh touch/click invokes unlockAudio again and resumes it from a user gesture.
        resumeAudioSafely(audioCtx);
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    let musicNodes = [];
    let musicPlaying = false;

    let musicTimer = null;
    let musicNextNoteTime = 0;
    let musicStep = 0;
    const MUSIC_NOTES = [146, 155, 174, 146, 138, 155, 146, 130];
    const MUSIC_BPM = 112;
    const MUSIC_BEAT = 60 / MUSIC_BPM;

    function trackMusicNode(node) {
      musicNodes.push(node);
      node.onended = () => {
        const index = musicNodes.indexOf(node);
        if (index !== -1) musicNodes.splice(index, 1);
        try { node.disconnect(); } catch (e) {}
      };
    }

    function scheduleMusicNote(freq, start) {
      const c = audioCtx;
      const beat = MUSIC_BEAT;
      const osc = c.createOscillator();
      const filter = c.createBiquadFilter();
      const gain = c.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = freq;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, start);
      filter.frequency.exponentialRampToValueAtTime(300, start + beat * 0.7);
      filter.Q.value = 1.2;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.028, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + beat * 0.8);
      osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
      osc.start(start); osc.stop(start + beat * 0.85); trackMusicNode(osc);

      const sine = c.createOscillator();
      const sineGain = c.createGain();
      sine.type = 'sine'; sine.frequency.value = freq * 2;
      sineGain.gain.setValueAtTime(0.0001, start);
      sineGain.gain.exponentialRampToValueAtTime(0.012, start + 0.06);
      sineGain.gain.exponentialRampToValueAtTime(0.0001, start + beat * 0.6);
      sine.connect(sineGain); sineGain.connect(masterGain);
      sine.start(start); sine.stop(start + beat * 0.7); trackMusicNode(sine);

      if (musicStep % MUSIC_NOTES.length === 0) {
        const bass = c.createOscillator();
        const bassFilter = c.createBiquadFilter();
        const bassGain = c.createGain();
        bass.type = 'square'; bass.frequency.value = 65;
        bassFilter.type = 'lowpass'; bassFilter.frequency.value = 180;
        bassGain.gain.setValueAtTime(0.0001, start);
        bassGain.gain.exponentialRampToValueAtTime(0.055, start + 0.06);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, start + MUSIC_NOTES.length * beat * 0.92);
        bass.connect(bassFilter); bassFilter.connect(bassGain); bassGain.connect(masterGain);
        bass.start(start); bass.stop(start + MUSIC_NOTES.length * beat); trackMusicNode(bass);
      }
    }

    // NEW: Web Audio lookahead scheduler; audio time, not JS timers, determines note timing.
    function scheduleMusic() {
      if (!musicPlaying || !gameRunning || !audioCtx || isPaused) return;
      const lookahead = 0.2;
      while (musicNextNoteTime < audioCtx.currentTime + lookahead) {
        scheduleMusicNote(MUSIC_NOTES[musicStep % MUSIC_NOTES.length], musicNextNoteTime);
        musicNextNoteTime += MUSIC_BEAT;
        musicStep++;
      }
    }

    function startMusic() {
      const c = ensureAudio();
      if (!c || !masterGain || musicPlaying) return;
      musicPlaying = true;
      musicStep = 0;
      musicNextNoteTime = c.currentTime + 0.05;
      scheduleMusic();
      // NEW: short scheduler tick only fills the audio lookahead queue; notes are timestamped by AudioContext.
      musicTimer = window.setInterval(scheduleMusic, 25);
    }

    function stopMusic() {
      musicPlaying = false;
      if (musicTimer !== null) { clearInterval(musicTimer); musicTimer = null; }
      musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
      musicNodes = [];
    }

    function envGain(ctx, start, peak, attack, hold, release) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), start + attack);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.7), start + attack + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, start + attack + hold + release);
      return g;
    }

    /** type: hit | small | medium | large | nuclear | boss */
    function playExplosion(type, pan) {
      const ctx = ensureAudio();
      if (!ctx || !masterGain || !noiseBuffer) return;
      const t0 = ctx.currentTime;
      pan = pan || 0;
      // Отдельная громкость обычных взрывов фигурок.
      // Босс и ядерный взрыв сохраняют исходный уровень.
      const figureOutput = ctx.createGain();
      figureOutput.gain.setValueAtTime(
        (type === 'boss' || type === 'nuclear') ? 1 : 0.35,
        t0
      );
      figureOutput.connect(masterGain);
      let out = figureOutput;
      if (ctx.createStereoPanner) {
        const panner = ctx.createStereoPanner();
        panner.pan.value = Math.max(-0.85, Math.min(0.85, pan));
        panner.connect(figureOutput);
        out = panner;
      }
      const profiles = {
        hit:     { noise: 0.1024, noiseDur: 0.07, thump: 95, thumpPeak: 0.1152, crack: 560, crackPeak: 0.0448, rumble: 0 },
        small:   { noise: 0.192,  noiseDur: 0.22, thump: 72, thumpPeak: 0.2176, crack: 390, crackPeak: 0.096, rumble: 40 },
        medium:  { noise: 0.3072, noiseDur: 0.42, thump: 48, thumpPeak: 0.352, crack: 280, crackPeak: 0.1664, rumble: 30 },
        large:   { noise: 0.3968, noiseDur: 0.62, thump: 36, thumpPeak: 0.448, crack: 220, crackPeak: 0.2048, rumble: 22 },
        boss:    { noise: 0.62, noiseDur: 0.72, thump: 34, thumpPeak: 0.72, crack: 190, crackPeak: 0.34, rumble: 22 },
        nuclear: { noise: 0.88, noiseDur: 1.2,  thump: 26, thumpPeak: 0.95, crack: 150, crackPeak: 0.42, rumble: 16 }
      };
      const p = profiles[type] || profiles.small;

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const nFilter = ctx.createBiquadFilter();
      nFilter.type = 'lowpass';
      nFilter.frequency.setValueAtTime(1600 + Math.random() * 700, t0);
      nFilter.frequency.exponentialRampToValueAtTime(160 + Math.random() * 90, t0 + p.noiseDur * 0.65);
      nFilter.Q.value = 0.65;
      const nGain = envGain(ctx, t0, p.noise, 0.004, p.noiseDur * 0.12, p.noiseDur * 0.88);
      noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(out);
      noise.start(t0); noise.stop(t0 + p.noiseDur + 0.05);

      const thump = ctx.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(p.thump * (0.9 + Math.random() * 0.2), t0);
      thump.frequency.exponentialRampToValueAtTime(26, t0 + 0.2 + p.noiseDur * 0.15);
      const tGain = envGain(ctx, t0, p.thumpPeak, 0.006, 0.04, 0.25 + p.noiseDur * 0.12);
      thump.connect(tGain); tGain.connect(out);
      thump.start(t0); thump.stop(t0 + 0.5);

      const crack = ctx.createOscillator();
      crack.type = 'triangle';
      crack.frequency.setValueAtTime(p.crack * (0.85 + Math.random() * 0.3), t0);
      crack.frequency.exponentialRampToValueAtTime(p.crack * 0.22, t0 + 0.09);
      const cGain = envGain(ctx, t0, p.crackPeak, 0.002, 0.012, 0.1);
      crack.connect(cGain); cGain.connect(out);
      crack.start(t0); crack.stop(t0 + 0.14);

      if (p.rumble > 0) {
        const rumble = ctx.createOscillator();
        rumble.type = 'sine';
        rumble.frequency.setValueAtTime(p.rumble, t0);
        rumble.frequency.linearRampToValueAtTime(p.rumble * 0.55, t0 + p.noiseDur);
        const rGain = envGain(ctx, t0, type === 'nuclear' ? 0.55 : 0.1664, 0.02, p.noiseDur * 0.28, p.noiseDur * 0.72);
        rumble.connect(rGain); rGain.connect(out);
        rumble.start(t0); rumble.stop(t0 + p.noiseDur + 0.12);
      }

      if (type === 'nuclear') {
        const boom2 = ctx.createOscillator();
        boom2.type = 'sine';
        boom2.frequency.setValueAtTime(48, t0 + 0.12);

      const [sr, sg, sb] = currentMap.starColor;
      for (const star of stars) {
        sc.fillStyle = `rgba(${sr},${sg},${sb},${star.brightness})`;
        sc.beginPath(); sc.arc(star.x, star.y, star.size, 0, Math.PI * 2); sc.fill();
      }
      for (const cloud of nebulaClouds) {
        const gradient = nc.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
        gradient.addColorStop(0, `hsla(${cloud.hue},70%,45%,${cloud.alpha})`);
        gradient.addColorStop(1, `hsla(${cloud.hue},70%,25%,0)`);
        nc.fillStyle = gradient;
        nc.beginPath(); nc.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2); nc.fill();
      }
      parallaxStarOffset = 0;
      parallaxNebulaOffset = 0;
    }
    function drawTiledLayer(layer, offset, alpha) {
      if (!layer) return;
      const y = ((offset % H) + H) % H;
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.drawImage(layer, 0, y - H, W, H);
      ctx.drawImage(layer, 0, y, W, H);
      ctx.restore();
    }

    function initStars() {
      stars = [];
      nebulaClouds = [];
      asteroids = [];
      for (let i = 0; i < 105; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: Math.random() * 2.2 + 0.3,
          speed: Math.random() * 1.8 + 0.25,

        });
      }
      for (let i = 0; i < 4; i++) {
        nebulaClouds.push({
          x: W * (0.12 + Math.random() * 0.76),

          alpha: 0.007 + Math.random() * 0.010,
          hue: (currentMap.nebulaHue || 215) + Math.random() * 24
        });
      }
      for (let i = 0; i < 6; i++) {
        asteroids.push({

        });

    }
    initStars();

    // Keyboard
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch / Pointer – smooth tracking
    let pointerActive = false;

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const isTouch = !!e.touches || e.pointerType === 'touch';
      return { x: clientX - rect.left, y: clientY - rect.top, isTouch };
    }

    function onPointerStart(e) {
      e.preventDefault();
      pointerActive = true;
      const p = getPointerPos(e);
      ensureAudio();
      player.targetX = p.x - player.w / 2;
      player.targetY = p.y - player.h / 2 - 48; // NEW: keep the ship above the finger/cursor

    }

    function onPointerMove(e) {
      e.preventDefault();
      if (!pointerActive) return;
      const p = getPointerPos(e);
      player.targetX = p.x - player.w / 2;
      player.targetY = p.y - player.h / 2 - 48; // NEW: keep the ship above the finger/cursor
    }

    function onPointerEnd() {
      pointerActive = false;
    }

    canvas.addEventListener('touchstart', onPointerStart, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerEnd);
    canvas.addEventListener('touchcancel', onPointerEnd);

    canvas.addEventListener('mousedown', onPointerStart);
    canvas.addEventListener('mousemove', e => {
      if (pointerActive) onPointerMove(e);
    });
    window.addEventListener('mouseup', onPointerEnd);

    function shoot() {
      if (!gameRunning) return;
      if (enemies.length === 0 && !boss) return;
      // Shoot only at enemies that have fully appeared; ignore those still entering
      let hasVisible = false;
      if (boss) hasVisible = true;
      else {
        for (let i = 0; i < enemies.length; i++) {
          if (enemies[i].y >= 0) { hasVisible = true; break; }
        }
      }
      if (!hasVisible) return;
      const center = player.x + player.w / 2;
      const py = player.y + 2;
      const comboBoost = Math.min(combo * 3, 40);
      const fireDelay = Math.max(28, 65 - difficulty * 4 - comboBoost);
      if (shotCooldown > 0) return;
      shotCooldown = fireDelay / 1000;
      bullets.push(makePlayerBullet({
        type: 'beam', x: center - 2, y: py, w: 4, h: 12,
        vx: 0, vy: -17, speed: 17,
        side: 0, dmg: 1, rot: 0, pulse: Math.random() * Math.PI * 2
      }));
      playShot('beam');

      while (bullets.length > 100) removePooled(bullets, 0, bulletPool, MAX_BULLET_POOL);
    }

    function spawnEnemy(forceAi) {
      const size = 42 + Math.random() * 22;
      const p = director.pressure;
      const fastChance = Math.min(0.04 + p * 0.04, 0.2) * BASE.fastMul;
      const tankChance = Math.min(0.03 + p * 0.025, 0.14);
      const roll = Math.random();
      let type = 'normal';
      if (roll < tankChance) type = 'tank';
      else if (roll < tankChance + fastChance) type = 'fast';

      let speed, hp, color;
      const cfgSp = (typeof waveCfg === 'function' ? waveCfg() : null);
      const waveSpeed = cfgSp ? cfgSp.speedMul : 1;
      const speedBoost = (0.85 + p * 0.15) * BASE.speedMul * waveSpeed * 0.92;

      if (type === 'fast') {
        speed = (3.2 + Math.random() * 1.2) * speedBoost;
        hp = 1;
        color = [255, 100, 120];
      } else if (type === 'tank') {
        speed = (1.8 + Math.random() * 0.6) * speedBoost;
        hp = BASE.tankHp + (p > 1.6 ? 1 : 0);
        color = [140, 140, 160];
      } else {
        speed = (2.4 + Math.random() * 1.0) * speedBoost;
        hp = 1;
        color = [200, 160, 120];
      }

      // AI mix shifts with director mode
      const aiRoll = Math.random();
      let ai = 'weave';
      if (forceAi) ai = forceAi;
      else if (director.mode === 'assault') {
        if (aiRoll > 0.55) ai = 'chase';
        else if (aiRoll > 0.35) ai = 'kamikaze';
        else if (aiRoll > 0.2) ai = 'shooter';
        else ai = 'flank';
      } else if (director.mode === 'swarm') {
        ai = aiRoll > 0.5 ? 'weave' : 'chase';
      } else if (director.mode === 'calm') {
        ai = aiRoll > 0.7 ? 'chase' : 'weave';
      } else {
        if (aiRoll > 0.9) ai = 'kamikaze';
        else if (aiRoll > 0.78) ai = 'flank';
        else if (aiRoll > 0.62) ai = 'shooter';
        else if (type === 'fast' || aiRoll > 0.4) ai = 'chase';
        else if (type === 'tank' || aiRoll < 0.18) ai = 'tank';
      }

      // Every level has its own enemy behaviour mix; director events can still force an AI.
      if (!forceAi && Math.random() < 0.72) {
        const roster = levelScenario().ai;
        ai = roster[Math.floor(Math.random() * roster.length)];
      }

      if (ai === 'kamikaze' || ai === 'dive') {
        color = ai === 'dive' ? [255, 145, 65] : [255, 70, 70];
        speed *= 1.1;
      } else if (ai === 'shooter') {
        color = [100, 190, 220];
      } else if (ai === 'flank') {
        color = [230, 190, 80];
      }

      const fromSide = false;
      const spawnY = -size - 10;
      enemies.push(makeEnemy({
        x: fromSide ? (Math.random() < 0.5 ? -size - 30 : W + 30) : Math.random() * (W - size - 20) + 10,
        y: fromSide ? (20 + Math.random() * H * 0.25) : spawnY,
        w: size,
        h: size,
        speed,
        hp,
        maxHp: hp,
        type,
        color,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.08,
        ai,
        phase: Math.random() * Math.PI * 2,
        vx: fromSide ? (Math.random() < 0.5 ? 2.0 : -2.0) : (Math.random() - 0.5) * 1.0,
        aimLean: 0.35 + Math.random() * 0.45,
        fireCd: 0.8 + Math.random() * 0.7,
        flankDir: Math.random() < 0.5 ? -1 : 1,
        dive: false
      }));
      const spawnedEnemy = enemies[enemies.length - 1];
      const enemyCap = 68;
      while (enemies.length > enemyCap) removePooled(enemies, 0, enemyPool, MAX_ENEMY_POOL);
      // Interception is triggered later, only when a falling enemy reaches the lower danger zone.
    }

    function launchDefenseMissile(target) {
      if (!target || defenseMissiles.length >= 68) return false;
      const fromLeft = target.x + target.w / 2 > W / 2;
      const x = fromLeft ? -14 : W + 14;
      const y = Math.max(48, Math.min(H - 130, target.y + target.h * 0.55 + (Math.random() - 0.5) * 90));
      const angle = Math.atan2(target.y + target.h / 2 - y, target.x + target.w / 2 - x);
      defenseMissiles.push({ x, y, vx: Math.cos(angle) * 5.2, vy: Math.sin(angle) * 5.2,
        angle, speed: 9.5, target, life: 5.5, trail: 0 });
      return true;
    }

    function updateDefenseMissiles(dt) {
      for (let i = defenseMissiles.length - 1; i >= 0; i--) {
        const m = defenseMissiles[i];
        m.life -= dt;
        const targetIndex = enemies.indexOf(m.target);
        // If the player destroys a missile's target first, the interceptor
        // detonates at its current position instead of disappearing silently.
        if (targetIndex < 0) {
          createExplosion(m.x, m.y, [75, 220, 255], 13, true);
          createHitSpark(m.x, m.y);
          removeAtSwap(defenseMissiles, i);
          continue;
        }
        if (m.life <= 0) {
          m.target.interceptAssigned = false;
          removeAtSwap(defenseMissiles, i);
          continue;
        }
        const target = m.target;
        const tx = target.x + target.w / 2, ty = target.y + target.h / 2;
        const desired = Math.atan2(ty - m.y, tx - m.x);
        let delta = Math.atan2(Math.sin(desired - m.angle), Math.cos(desired - m.angle));
        m.angle += Math.max(-3.8 * dt, Math.min(3.8 * dt, delta));
        m.vx = Math.cos(m.angle) * m.speed; m.vy = Math.sin(m.angle) * m.speed;
        m.x += m.vx * dt * 60; m.y += m.vy * dt * 60;
        m.trail += dt;
        if (Math.hypot(tx - m.x, ty - m.y) < Math.max(14, target.w * 0.42)) {
          createExplosion(tx, ty, [75, 220, 255], 18, true);
          createHitSpark(tx, ty);
          const points = target.type === 'tank' ? 30 : (target.type === 'fast' ? 15 : 10);
          successfulIntercepts++;
          score += points; scoreEl.textContent = score;
          floatingTexts.push({ x: tx, y: ty, text: 'ПЕРЕХВАТ', life: .75, maxLife: .75, vy: -25, color: '#75e5ff' });
          removePooled(enemies, targetIndex, enemyPool, MAX_ENEMY_POOL);
          director.killStreak = Math.min(20, director.killStreak + 1);
          wave.kills++;
          removeAtSwap(defenseMissiles, i);
        }
      }
    }

    function drawDefenseMissiles() {
      if (!defenseMissiles.length) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const m of defenseMissiles) {
        ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
        ctx.fillStyle = 'rgba(70,210,255,.22)'; ctx.beginPath(); ctx.ellipse(-8,0,13,4,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8beaff'; ctx.fillRect(-8,-2.2,13,4.4);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(3,-1.4,4,2.8);
        ctx.fillStyle = '#55cfff'; ctx.fillRect(-12,-1.1,4,2.2);
        ctx.restore();
      }
      ctx.restore();
    }

    function triggerDirectorEvent() {
      // Only during active fight — never during clearing/breather
      if (!gameRunning || wave.phase !== 'fight') return;
      const roll = Math.random();
      if (roll < 0.3) {
        director.mode = 'assault';
        showToast('⚡ ШТУРМ');
        spawnEnemy('chase');
        if (wave.n >= 6 && Math.random() < 0.35) spawnEnemy('kamikaze');
      } else if (roll < 0.55) {
        director.mode = 'swarm';
        showToast('🌀 РОЙ');
        spawnEnemy('weave');
        if (wave.n >= 7 && Math.random() < 0.3) spawnEnemy('chase');
      } else if (roll < 0.78) {
        director.mode = 'assault';
        showToast('↗ ФЛАНГ');
        spawnEnemy('flank');
      } else {
        // Quiet moment — no toast, just briefly lower pressure
        director.mode = 'calm';
      }
      director.eventTimer = 0;
      director.nextEvent = 20 + Math.random() * 14;
    }

    function updateDirector(dt) {
      if (wave.phase !== 'fight') {
        difficulty = director.pressure;
        return;
      }
      // Stay near level design pressure; small boost from streaks
      const cfg = waveCfg();
      let target = cfg.pressure + Math.min(0.2, director.killStreak * 0.015);
      if (director.mode === 'assault') target += 0.12;
      if (director.mode === 'swarm') target += 0.08;
      if (director.mode === 'calm') target -= 0.12;
      target = Math.max(cfg.pressure - 0.15, Math.min(cfg.pressure + 0.3, target));
      director.pressure += (target - director.pressure) * Math.min(1, dt * 0.3);
      difficulty = director.pressure;

      director.eventTimer += dt;
      if (director.eventTimer >= director.nextEvent) triggerDirectorEvent();
      if ((director.mode === 'assault' || director.mode === 'swarm') && director.eventTimer > 6) {
        director.mode = 'flow';
      }
      if (director.mode === 'calm' && director.eventTimer > 5) director.mode = 'flow';
    }


    function haptic(pattern) {
      try { if (settings.haptics !== false && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    }

    function createExplosion(x, y, color, count = 14, silent) {
      if (count >= 60) { haptic([25, 20, 45]); hitstopTimer = Math.max(hitstopTimer, 0.025); } // NEW: ~50 ms hitstop
      if (!silent) explosionSoundFromCount(count, x);
      let n = Math.max(4, Math.round(count * particleMul()));
      const base = color || [255, 160, 60];
      // A bright core flash and a readable expanding shock ring.
      if (Math.random() < (count >= 10 ? 0.96 : 0.78)) {
        const fl = getParticle();
        fl.x = x; fl.y = y; fl.vx = 0; fl.vy = 0; fl.life = 1; fl.decay = 0.105;
        fl.color = [255, 255, 245]; fl.size = 9 + count * 0.28; fl.type = 'flash';
        particles.push(fl);
      }
      if (Math.random() < (count >= 10 ? 0.9 : 0.68)) {
        const rg = getParticle();
        rg.x = x; rg.y = y; rg.vx = 0; rg.vy = 0; rg.life = 1; rg.decay = 0.052;
        rg.color = base; rg.size = 16 + count * 0.46; rg.type = 'ring';
        particles.push(rg);
      }
      if (count >= 28 && Math.random() < 0.72) {
        const outer = getParticle();
        outer.x = x; outer.y = y; outer.vx = 0; outer.vy = 0;
        outer.life = 1; outer.decay = 0.034;
        outer.color = [255, 205, 130]; outer.size = 24 + count * 0.52;
        outer.type = 'ring';
        particles.push(outer);
      }
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6.5 + 1.8;
        const isSpark = Math.random() < 0.52;
        const c = isSpark
          ? [255, 210 + Math.random() * 40, 140 + Math.random() * 50]
          : [
              Math.min(255, base[0] + (Math.random() * 30 - 8)),
              Math.min(255, base[1] + (Math.random() * 30 - 8)),
              Math.min(255, base[2] + (Math.random() * 20 - 4))
            ];
        const p = getParticle();
        p.x = x; p.y = y;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed - Math.random() * 1.2;
        p.life = 1;
        p.decay = isSpark ? 0.021 + Math.random() * 0.026 : 0.018 + Math.random() * 0.02;
        p.color = c;
        p.size = isSpark ? Math.random() * 2.8 + 1.0 : Math.random() * 4 + 1.5;
        p.type = isSpark ? 'spark' : 'dust';
        particles.push(p);
      }
      // Fewer embers
      const embers = Math.min(5, Math.round(2 * particleMul()));
      for (let i = 0; i < embers; i++) {
        const em = getParticle();
        em.x = x + (Math.random() - 0.5) * 6;
        em.y = y + (Math.random() - 0.5) * 6;
        em.vx = (Math.random() - 0.5) * 1;
        em.vy = -1.2 - Math.random() * 2;
        em.life = 1;
        em.decay = 0.015 + Math.random() * 0.012;
        em.color = [255, 140 + Math.random() * 70, 40];
        em.size = 1.8 + Math.random() * 2;
        em.type = 'ember';
        particles.push(em);
      }
      const cap = settings.particles === 'low' ? 32
        : settings.particles === 'high' ? 105 : 68;
      while (particles.length > cap) {
        const oldest = particles[0];
        const last = particles.length - 1;
        if (last > 0) particles[0] = particles[last];
        particles.pop();
        releaseParticle(oldest);
      }
    }

    function metaCfg() {
      return META_CFG[Math.min(META_CFG.length, Math.max(1, selectedLevel)) - 1];
    }

    function waveCfg() {
      const meta = metaCfg();
      const rw = RUN_WAVE[Math.min(3, Math.max(1, wave.n)) - 1];
      const mul = rw.mul;
      return {
        n: wave.n,
        dur: 40,
        spawnMul: meta.spawnMul * mul,
        speedMul: meta.speedMul * (wave.n === 3 ? 1.05 : wave.n === 1 ? 0.90 : 0.96),
        pressure: meta.pressure * mul,
        label: rw.label
      };
    }

    function spawnLevelBoss(hard) {
      if (boss) return;
      const meta = selectedLevel;
      const scenario = levelScenario();
      // Clear any leftover nuclear visuals and pickups before the boss encounter starts.
      bombFlash = 0; bombRing = 0; bombShockwaves.length = 0;
      for (let i = powerUps.length - 1; i >= 0; i--) {
        if (powerUps[i].type === 'bomb') removeAtSwap(powerUps, i);
      }
      const bossHp = BASE.bossHp + (hard ? 22 : 12) + Math.floor(meta * 2.2);
      boss = { x: W/2 - 48, y: -100, w: 96, h: 64, hp: bossHp,
        maxHp: bossHp, phase: 0, combatPhase: 1, phase2Clock: 0, volleyAngle: -Math.PI / 2,
        fireClock: 0, minionClock: 0, telegraph: 0, telegraphAngle: -Math.PI / 2,
        levelStyle: meta, moveMode: scenario.move };
      bossBarWrap.style.display = 'block';
      bossLabel.style.display = 'block';
      showToast(`БОСС · ${scenario.name.toUpperCase()}`);
    }

    function completeRun() {
      // Level progression is identical on every map.
      let unlockedNext = false;
      if (selectedLevel >= maxUnlocked && maxUnlocked < 20) {
        maxUnlocked = selectedLevel + 1;
        unlockedNext = true;
        try { localStorage.setItem('spaceBlastMaxLevel', String(maxUnlocked)); } catch(e) {}
      }
      winRun(unlockedNext, '');
    }

    function nextWaveInRun() {
      if (wave.n >= 3) {
        completeRun();
        return;
      }
      wave.n += 1;
      wave.kills = 0;
      wave.timer = 0;
      wave.phase = 'fight';
      clearPooled(enemies, enemyPool, MAX_ENEMY_POOL);
      clearPooled(bullets, bulletPool, MAX_BULLET_POOL);
      clearPooled(enemyBullets, enemyBulletPool, MAX_ENEMY_BULLET_POOL);
      const cfg = waveCfg();
      director.pressure = cfg.pressure;
      director.mode = wave.n === 3 ? 'assault' : (wave.n === 2 ? 'swarm' : 'flow');
      director.eventTimer = 0;
      director.nextEvent = 20 + Math.random() * 12;
      showToast(wave.n === 3 ? 'ТРЕТЬЯ ВОЛНА' : cfg.label);
      // A level-specific boss closes every run; its behaviour changes by level.
      if (wave.n === 3) {
        spawnLevelBoss(selectedLevel >= 8);
      }
    }

    function advanceWavePhase() {
      if (wave.phase === 'fight') {
        wave.phase = 'clearing';
        wave.timer = 0;
        director.mode = 'calm';
        showToast('ЗАЧИСТКА');
      } else if (wave.phase === 'clearing') {
        if (enemies.length === 0 && !boss) {
          wave.phase = 'breather';
          wave.timer = 0;
          director.mode = 'calm';
          showToast(`ВОЛНА ${wave.n} ✓`);
        }
      } else if (wave.phase === 'breather') {
        nextWaveInRun();
      }
    }

    function winRun(unlockedNext, mapJustOpened) {
      gameRunning = false;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        try { localStorage.setItem('spaceBlastBest', String(bestScore)); } catch(e) {}
      }
      const extra = unlockedNext ? `<p class="subtitle" style="margin-bottom:12px">Открыт уровень ${maxUnlocked}</p>` : '';
      const interceptSummary = defenseModeUsed ? `<p class="subtitle" style="margin:0 0 14px">Успешных перехватов: <strong>${successfulIntercepts}</strong></p>` : '';
      const hasNext = selectedLevel < 20;
      overlay.innerHTML = `
        <h1>ПОБЕДА</h1>
        <div id="final-label">УРОВЕНЬ ${selectedLevel}</div>
        <p class="subtitle" style="margin-bottom:12px">Время ${formatTime(gameTime)}</p>
        ${interceptSummary}
        ${extra}
        ${hasNext ? `<button class="btn" id="next-level-btn">СЛЕДУЮЩИЙ УРОВЕНЬ · ${selectedLevel + 1}</button>` : `<p class="subtitle">Ты прошёл все 20 уровней!</p>`}
        <button class="btn-secondary" id="menu-btn" style="margin-top:10px">В МЕНЮ</button>
      `;
      overlay.classList.remove('hidden');
      const nextBtn = document.getElementById('next-level-btn');
      if (nextBtn) nextBtn.addEventListener('click', () => { selectedLevel = Math.min(20, selectedLevel + 1); try { localStorage.setItem('spaceBlastLevel', String(selectedLevel)); } catch(e) {} startGame(selectedLevel); });
      document.getElementById('menu-btn').addEventListener('click', showMainMenu);
    }

    function createHitSpark(x, y) {
      const n = Math.max(1, Math.round(3 * particleMul()));
      for (let i = 0; i < n; i++) {
        const p = getParticle();
        p.x = x; p.y = y;
        p.vx = (Math.random() - 0.5) * 5.5;
        p.vy = (Math.random() - 0.5) * 5.5;
        p.life = 0.65;
        p.decay = 0.055;
        p.color = [0, 230, 255];
        p.size = Math.random() * 2 + 0.8;
        p.type = 'spark';
        particles.push(p);
      }
      const sparkCap = 95;
      while (particles.length > sparkCap) {
        releaseParticle(particles.pop());
      }
    }

    function updateCombo() {
      combo++;
      comboTimer = 1.5;
      if (combo >= 2) {
        comboEl.textContent = `x${combo}`;
        comboEl.classList.add('show');
      }
      // Kill-cam flash on streak 3, 5, 8...
      if (combo === 3 || combo === 5 || combo >= 8 && combo % 3 === 0) {
        killFlash = combo >= 8 ? 0.55 : 0.4;
        slowMo = combo >= 5 ? 10 : 6;
        addShake(combo >= 5 ? 7 : 4);

      }
    }


    function playLock() {
      const ctx = ensureAudio();
      if (!ctx || !masterGain) return;
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(720, t0);
      o.frequency.exponentialRampToValueAtTime(1400, t0 + 0.06);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.08, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.1);
    }

    function formatTime(seconds) {
      const total = Math.floor(seconds);
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }

    function loseLife(vib, shakeAmt) {
      if (player.invuln > 0) return false;
      player.invuln = 1.5;
      haptic(45);
      lives--;
      updateLives();
      combo = 0;
      comboEl.classList.remove('show');
      director.killStreak = 0;
      director.pressure = Math.max(0.8, director.pressure - 0.18);
      director.mode = 'calm';
      director.eventTimer = 0;
      director.nextEvent = 14 + Math.random() * 8;

      addShake(shakeAmt);
      if (lives <= 0) {
        gameOver();
        return true;
      }
      return false;
    }

    let bombOriginX = 0;
    let bombOriginY = 0;
    let bombShockwaves = [];

    function detonateBomb(ox, oy) {
      if (!gameRunning || isPaused) return;
      const bx = ox != null ? ox : W / 2;
      const by = oy != null ? oy : H * 0.45;
      bombOriginX = bx;
      bombOriginY = by;

      // Nuclear pickups and blasts are disabled during boss encounters.
      if (boss) return;
      const bossWasActive = false;
      let cleared = enemies.length;
      for (const e of enemies) {
        score += e.type === 'tank' ? 25 : 10;
        createExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color, 14, true);
      }
      clearPooled(enemies, enemyPool, MAX_ENEMY_POOL);
      clearPooled(enemyBullets, enemyBulletPool, MAX_ENEMY_BULLET_POOL);

      scoreEl.textContent = score;

      // Elegant nuclear explosion — full-screen clear
      bombFlash = 1.4;
      bombRing = 1;
      bombShockwaves = [
        { r: 0, max: Math.max(W, H) * 0.7, life: 1, width: 4, color: '255,255,240' },
        { r: 0, max: Math.max(W, H) * 1.0, life: 1, width: 3, color: '90,228,170' },
        { r: 0, max: Math.max(W, H) * 1.35, life: 1, width: 2.5, color: '180,140,255' },
        { r: 0, max: Math.max(W, H) * 1.7, life: 1, width: 2, color: '255,160,80' }
      ];
      addShake(16);
      playExplosion('nuclear', (bx / Math.max(1, W)) * 2 - 1);
      haptic([35, 25, 70]);
      hitstopTimer = Math.max(hitstopTimer, 0.05); // NEW: ~50 ms hitstop

      // Recycle previous particles before the nuclear burst visuals.
      clearParticles();
      // Soft center bloom + sparse elegant sparks
      createExplosion(bx, by, [255, 255, 220], 60, true);
      createExplosion(bx, by, [90, 228, 170], 40, true);

      for (let i = 0; i < 12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 5;
        const p = getParticle();
        p.x = bx; p.y = by;
        p.vx = Math.cos(ang) * spd;
        p.vy = Math.sin(ang) * spd;
        p.life = 1;
        p.decay = 0.012 + Math.random() * 0.012;
        p.color = Math.random() < 0.5 ? [255, 255, 200] : [90, 228, 170];
        p.size = 2 + Math.random() * 3;
        p.type = 'spark';
        particles.push(p);
      }

      showToast(bossWasActive ? '☢ ЯДЕРНЫЙ ВЗРЫВ · БОСС УНИЧТОЖЕН!' : `☢ ЯДЕРНЫЙ ВЗРЫВ · ЦЕЛЕЙ: ${cleared}`);

    }

    function spawnBombPickup() {
      const size = 40;
      powerUps.push({
        type: 'bomb',
        x: 24 + Math.random() * (W - size - 48),
        y: -size - 10,
        w: size,
        h: size,
        speed: 1.5 + Math.random() * 0.5,
        bob: Math.random() * Math.PI * 2
      });
    }

    function update(dt = 1 / 60) {
      if (!gameRunning || isPaused) return;
      const frameScale = dt * 60;
      shotCooldown = Math.max(0, shotCooldown - dt);
      time += frameScale;
      gameTime += dt;

      // NEW: floating combat text drifts upward and fades over about one second.
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const popup = floatingTexts[i];
        popup.y += popup.vy * dt;
        popup.life = Math.max(0, popup.life - dt);
        if (popup.life <= 0) {
          const last = floatingTexts.length - 1;
          if (i !== last) floatingTexts[i] = floatingTexts[last];
          floatingTexts.pop();
        }
      }
      if (bombFlash > 0) bombFlash = Math.max(0, bombFlash - 0.96 * dt);
      if (bombRing > 0) bombRing = Math.max(0, bombRing - 1.08 * dt);
      if (killFlash > 0) killFlash = Math.max(0, killFlash - 2.4 * dt);
      for (let i = bombShockwaves.length - 1; i >= 0; i--) {
        const sw = bombShockwaves[i];
        sw.r += ((sw.max - sw.r) * 0.08 + 6) * frameScale;
        sw.life -= 0.96 * dt;
        if (sw.life <= 0 || sw.r >= sw.max) {
          const last = bombShockwaves.length - 1;
          if (i !== last) bombShockwaves[i] = bombShockwaves[last];
          bombShockwaves.pop();
        }
      }
      const shownSecond = Math.floor(gameTime);
      if (shownSecond !== lastShownSecond) {
        lastShownSecond = shownSecond;
        survivalTimeEl.textContent = formatTime(gameTime);
      }

      updateDirector(dt);

      // Player movement
      {
        if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= player.speed * frameScale;
        if (keys['ArrowRight'] || keys['KeyD']) player.targetX += player.speed * frameScale;
        if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= player.speed * frameScale;
        if (keys['ArrowDown'] || keys['KeyS']) player.targetY += player.speed * frameScale;

        const halfY = H * 0.5;
        player.targetX = Math.max(4, Math.min(W - player.w - 4, player.targetX));
        player.targetY = Math.max(halfY, Math.min(H - player.h - 8, player.targetY));
        player._lastX = player.x;
        player._lastY = player.y;
        const prevX = player.x, prevY = player.y;
        player.update(dt, player.targetX, player.targetY);
        player.invuln = Math.max(0, player.invuln - dt);
        moveSpeed = Math.min(1.6, (Math.abs(player.x - prevX) + Math.abs(player.y - prevY)) / 5.5);
      }

      // Auto fire (slightly faster at higher difficulty)
      shoot();

      // Engine trail: fixed time cadence, bounded count, and only while the ship moves.
      trailSpawnTimer -= dt;
      if (moveSpeed > 0.06 && trailSpawnTimer <= 0 && trails.length < 28) {
        trails.push({
          x: player.x + player.w / 2,
          y: player.y + player.h,
          life: 0.62,
          size: 4 + Math.random() * 2.5
        });
        trailSpawnTimer = 0.075;
      }

      // Player beam projectiles
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update(frameScale);
        if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40)
          removePooled(bullets, i, bulletPool, MAX_BULLET_POOL);
      }

      // Level phases: fight → clearing → breather → next
      const cfg = waveCfg();
      wave.timer = (wave.timer || 0) + dt;
      const phaseSec = wave.timer;
      if (wave.phase === 'fight' && phaseSec >= cfg.dur) {
        advanceWavePhase();
      } else if (wave.phase === 'clearing') {
        // Safety: after 12s remove leftover fodder so level can't soft-lock
        if (phaseSec > 12 && enemies.length) {
          for (let i = enemies.length - 1; i >= 0; i--) {
            createExplosion(enemies[i].x + enemies[i].w/2, enemies[i].y + enemies[i].h/2, enemies[i].color, 8, true);
          }
          clearPooled(enemies, enemyPool, MAX_ENEMY_POOL);
        }
        if (enemies.length === 0 && !boss) advanceWavePhase();
      } else if (wave.phase === 'breather' && phaseSec >= 2.2) {
        advanceWavePhase();
      }

      enemySpawnTimer += dt;
      const canSpawn = wave.phase === 'fight';
      if (canSpawn) {
        const dens = 1.35 * cfg.spawnMul;
        const spawnRate = Math.max(10, ((BASE.spawnBase - 24) / dens - difficulty * 6) / ENEMY_COUNT_SCALE) / 60;
        if (enemySpawnTimer > spawnRate) {
          spawnEnemy();
          if (wave.n <= 2) spawnEnemy(); // +1 враг на первой и второй волнах
          const extra = (0.08 + cfg.spawnMul * 0.10) * ENEMY_COUNT_SCALE;
          if (Math.random() < extra) spawnEnemy();
          if (wave.n >= 2 && Math.random() < 0.12 * ENEMY_COUNT_SCALE) spawnEnemy();
          if (wave.n >= 3 && Math.random() < 0.10 * ENEMY_COUNT_SCALE) spawnEnemy();
          enemySpawnTimer = 0;
        }
      } else {
        enemySpawnTimer = 0;
      }

      // Nuclear bombs are never spawned during a boss encounter.
      if (boss) {
        bombSpawnTimer = 0;
        for (let i = powerUps.length - 1; i >= 0; i--) {
          if (powerUps[i].type === 'bomb') removeAtSwap(powerUps, i);
        }
      } else {
        bombSpawnTimer += dt;
        if (bombSpawnTimer >= nextBombAt) {
          spawnBombPickup();
          bombSpawnTimer = 0;
          nextBombAt = 15 + Math.random() * 13;
        }
      }

      // Power-ups (falling bombs) — collect by touch OR shoot to detonate
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.speed * frameScale;
        p.bob += 0.08 * frameScale;
        p.x += Math.sin(p.bob) * 0.4 * frameScale;

        let triggered = false;
        const px = p.x + p.w / 2;
        const py = p.y + p.h / 2;

        // Shot by player bullets → nuclear detonation
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < p.x + p.w && b.x + b.w > p.x &&
              b.y < p.y + p.h && b.y + b.h > p.y) {
            removePooled(bullets, j, bulletPool, MAX_BULLET_POOL);
            triggered = true;
            break;
          }
        }

        // Collect by touching ship
        if (!triggered &&
            p.x < player.x + player.w && p.x + p.w > player.x &&
            p.y < player.y + player.h && p.y + p.h > player.y) {
          triggered = true;
        }

        if (triggered) {
          removeAtSwap(powerUps, i);
          if (p.type === 'bomb' && !boss) detonateBomb(px, py);
          continue;
        }

        if (p.y > H + 40) removeAtSwap(powerUps, i);
      }

      // Boss (levels 5 & 10)
      if (boss) {
        const bossScenario = LEVEL_SCENARIOS[(boss.levelStyle || selectedLevel) - 1] || LEVEL_SCENARIOS[0];
        boss.phase = (boss.phase || 0) + bossScenario.moveRate * (boss.combatPhase === 2 ? 0.085 : 0.052) * frameScale;
        boss.fireClock = (boss.fireClock || 0) + dt;
        boss.minionClock = (boss.minionClock || 0) + dt;
        boss.y = Math.min(82, boss.y + 1.25 * frameScale);
        const bossCenter = W / 2 - boss.w / 2;
        const bossAmp = Math.max(0, W * bossScenario.moveAmp);
        const waveMotion = Math.sin(boss.phase);
        let bossOffset = waveMotion;
        if (bossScenario.move === 1) bossOffset = (2 / Math.PI) * Math.asin(Math.sin(boss.phase)); // sharp sweep
        else if (bossScenario.move === 2) bossOffset = Math.sin(boss.phase * 1.7); // quick double weave
        else if (bossScenario.move === 3) bossOffset = Math.sin(boss.phase) * Math.cos(boss.phase * 0.5); // figure-eight
        else if (bossScenario.move === 4) bossOffset = Math.sin(boss.phase) * 0.72 + Math.sin(boss.phase * 2.3) * 0.28;
        else if (bossScenario.move === 5) bossOffset = Math.sin(boss.phase) * 0.55 + Math.sin(boss.phase * 2.1) * 0.45;
        else if (bossScenario.move === 6) bossOffset = Math.sin(boss.phase) * Math.cos(boss.phase * 1.35);
        else if (bossScenario.move === 7) bossOffset = Math.tanh(Math.sin(boss.phase) * 2.8) * 0.82;
        else if (bossScenario.move === 8) bossOffset = Math.sin(boss.phase) * 0.38 + Math.sin(boss.phase * 3.1) * 0.62;
        else if (bossScenario.move === 9) bossOffset = Math.sin(boss.phase * 0.72) * 0.7 + Math.cos(boss.phase * 1.9) * 0.3;
        boss.x = Math.max(8, Math.min(W - boss.w - 8, bossCenter + bossOffset * bossAmp));
        if (boss.y >= 82 && bossScenario.move >= 3) {
          boss.y = 82 + Math.sin(boss.phase * 0.65) * (bossScenario.move === 5 ? 12 : 6);
        }
        // Phase transition at 50% HP. Phase 2 switches to rotating fan volleys.
        if (boss.combatPhase === 1 && boss.hp <= boss.maxHp * 0.5) {
          boss.combatPhase = 2;
          boss.phase2Clock = 0;
          boss.fireClock = 0;
          boss.telegraph = 1.0; // NEW: one-second phase-transition warning
          boss.telegraphAngle = Math.atan2(player.y + player.h / 2 - (boss.y + boss.h),
            player.x + player.w / 2 - (boss.x + boss.w / 2));
          showToast('БОСС: ЯРОСТЬ');
          haptic([35, 25, 55]);
          hitstopTimer = Math.max(hitstopTimer, 0.05); // NEW: ~50 ms hitstop
          addShake(9);
        }
        if (wave.phase === 'fight') {
          boss.phase2Clock += dt;
          if (boss.telegraph > 0) {
            boss.telegraph = Math.max(0, boss.telegraph - dt);
            if (boss.telegraph === 0) {
              const sx = boss.x + boss.w / 2, sy = boss.y + boss.h;
              const base = boss.combatPhase === 2
                ? boss.volleyAngle
                : Math.atan2(player.y + player.h / 2 - sy, player.x + player.w / 2 - sx);
              const offsets = boss.combatPhase === 2 ? bossScenario.shots2 : bossScenario.shots1;
              const speed = boss.combatPhase === 2 ? bossScenario.speed2 : bossScenario.speed1;
              for (const offset of offsets) {
                const angle = base + offset;
                enemyBullets.push(makeEnemyBullet({ x: sx - 5, y: sy, w: 10, h: 16,
                  vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                  speed, damage: 1, bossShot: true }));
              }
            }
          } else {
            const interval = boss.combatPhase === 2 ? bossScenario.interval2 : bossScenario.interval1;
            if (boss.fireClock >= interval) {
              boss.fireClock = 0;
              boss.telegraph = 1.0; // NEW: one-second laser telegraph in both phases
              if (boss.combatPhase === 2) {
                boss.volleyAngle += bossScenario.rotate;
                boss.telegraphAngle = boss.volleyAngle;
              } else {
                boss.telegraphAngle = Math.atan2(player.y + player.h / 2 - (boss.y + boss.h),
                  player.x + player.w / 2 - (boss.x + boss.w / 2));
                boss.volleyAngle = boss.telegraphAngle;
              }
            }
          }
        }

        // Minions only during fight — not during clearing (prevents soft-lock)
        // NEW: phase two reinforces more often.
        if (wave.phase === 'fight' && boss.minionClock > (boss.combatPhase === 2 ? 1.15 : 2.08)) {
          boss.minionClock = 0;
          const ms = 26;
          enemies.push(makeEnemy({
            x: boss.x + boss.w/2 - ms/2, y: boss.y + boss.h,
            w: ms, h: ms, speed: 2.2, hp: 1, maxHp: 1,
            type: 'fast', color: [255, 40, 130],
            rot: 0, rotSpeed: 0.06, ai: 'chase',
            phase: Math.random() * Math.PI * 2, vx: 0,
            aimLean: 0.5, fireCd: 99, dive: false
          }));
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < boss.x + boss.w && b.x + b.w > boss.x &&
              b.y < boss.y + boss.h && b.y + b.h > boss.y) {
            boss.hp -= (b.dmg || 1);
            removePooled(bullets, j, bulletPool, MAX_BULLET_POOL);
            createHitSpark(b.x, b.y);
            bossBar.style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
            if (boss.hp <= 0) {
              createExplosion(boss.x + boss.w/2, boss.y + boss.h/2, [255,45,150], 60, true);
              playExplosion('boss', ((boss.x + boss.w/2) / Math.max(1, W)) * 2 - 1);
              score += 500;
              scoreEl.textContent = score;
              boss = null;
              bossBarWrap.style.display = 'none';
              bossLabel.style.display = 'none';
              showToast('БОСС УНИЧТОЖЕН');
              killFlash = 0.5;
              slowMo = 12; hitstopTimer = Math.max(hitstopTimer, 0.05); // NEW: ~50 ms hitstop
              addShake(12);
              break;
            }
          }
        }
      }
      if (powerModeTimer > 0) powerModeTimer = Math.max(0, powerModeTimer - frameScale);

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.update(frameScale);

        // Simple fall — no floating
        if (wave.phase === 'clearing') e.y += 1.2 * frameScale;
        e.rotSpeed = e.rotSpeed || 0;
        // Level-specific enemy motion: weaving, tracking, diving and orbiting.
        if (wave.phase !== 'clearing' && e.y >= -e.h) {
          const enemyCenter = e.x + e.w / 2;
          const playerCenter = player.x + player.w / 2;
          if (e.ai === 'weave') {
            e.x += Math.sin(e.phase * 1.35) * 1.05 * frameScale;
          } else if (e.ai === 'chase' || e.ai === 'kamikaze') {
            const steer = e.ai === 'kamikaze' ? 0.024 : 0.012;
            e.x += Math.max(-2.0, Math.min(2.0, (playerCenter - enemyCenter) * steer)) * frameScale;
          } else if (e.ai === 'flank') {
            e.x += (e.flankDir || 1) * (1.0 + Math.sin(e.phase) * 0.6) * frameScale;
            if (e.x < 12 || e.x + e.w > W - 12) e.flankDir = -(e.flankDir || 1);
          } else if (e.ai === 'dive' && e.y > 20) {
            e.x += Math.max(-2.8, Math.min(2.8, (playerCenter - enemyCenter) * 0.026)) * frameScale;
            e.y += Math.sin(e.phase * 2.2) * 0.45 * frameScale;
          } else if (e.ai === 'orbit') {
            e.x += Math.sin(e.phase * 1.8) * 1.9 * frameScale;
            e.y += Math.cos(e.phase * 1.2) * 0.55 * frameScale;
          } else if (e.ai === 'tank') {
            e.x += Math.sin(e.phase * 0.65) * 0.45 * frameScale;
          }
        }
        e.x = Math.max(4, Math.min(W - e.w - 4, e.x));

        // Intercept every enemy that enters the central falling corridor.
        // Targets are assigned once; a failed/expired missile releases its target for retry.
        const enemyCenterX = e.x + e.w / 2;
        const centralCorridor = enemyCenterX >= W * 0.20 && enemyCenterX <= W * 0.80;
        if (defenseModeEnabled && !e.interceptAssigned && centralCorridor && e.y >= H * 0.12) {
          if (launchDefenseMissile(e)) e.interceptAssigned = true;
        }

        // NEW: shooter AI fires aimed projectiles on a dt-based cooldown.
        if (e.ai === 'shooter' && e.y >= 0) {
          e.fireCd = (e.fireCd == null ? 1.2 : e.fireCd) - dt;
          if (e.fireCd <= 0 && enemyBullets.length < 36) {
            const sx = e.x + e.w / 2, sy = e.y + e.h;
            const tx = player.x + player.w / 2, ty = player.y + player.h / 2;
            const angle = Math.atan2(ty - sy, tx - sx);
            const speed = 4.2;
            enemyBullets.push(makeEnemyBullet({ x: sx - 4, y: sy, w: 8, h: 14,
              vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
              speed, damage: 1 }));
            e.fireCd = 1.35 + Math.random() * 0.55;
          }
        }

        // Bullet collision — only hit fully visible enemies
        if (e.y >= 0) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x &&
              b.y < e.y + e.h && b.y + b.h > e.y) {
            e.hp -= (b.dmg || 1);
            createHitSpark(b.x + b.w / 2, b.y);
            if (b.type === 'beam') {
              createExplosion(b.x + b.w / 2, b.y, [0, 230, 255], 8, true);
              createHitSpark(e.x + e.w / 2, e.y + e.h / 2);
            }
            removePooled(bullets, j, bulletPool, MAX_BULLET_POOL);

            if (e.hp <= 0) {
              const killColor = b.type === 'beam' ? [80, 240, 255] : e.color;
              const fat = false;
              createExplosion(e.x + e.w / 2, e.y + e.h / 2, killColor, fat ? 34 : (e.type === 'tank' ? 22 : 14));
              if (b.type === 'beam') createExplosion(e.x + e.w / 2, e.y + e.h / 2, [255, 255, 255], 8, true);
              removePooled(enemies, i, enemyPool, MAX_ENEMY_POOL);
              const points = e.type === 'tank' ? 30 : (e.type === 'fast' ? 15 : 10);
              const awarded = points * Math.min(combo + 1, 5);
              score += awarded;
              floatingTexts.push({ x: e.x + e.w / 2, y: e.y, text: '+' + awarded,
                life: 0.95, maxLife: 0.95, vy: -34, color: '#5AE4AA' });
              scoreEl.textContent = score;
              director.killStreak = Math.min(20, director.killStreak + 1);
              wave.kills++;
              updateCombo();

              addShake(fat ? 9 : (e.type === 'tank' ? 7 : 3));
            } else {

              addShake(2);
            }
            break;
          }
        }
        }

        // The enemy may have been removed after a bullet hit; do not process it again.
        if (e.hp <= 0) continue;

        // Enemy bodies no longer damage the ship on contact. A missed enemy
        // still costs a life only when it escapes past the bottom of the arena.

        // Off screen — during clearing just despawn (no life penalty)
        if (e.y > H + 50 || e.x < -80 || e.x > W + 80) {
          removePooled(enemies, i, enemyPool, MAX_ENEMY_POOL);
          if (wave.phase === 'fight' && e.y > H + 50) {
            if (loseLife(25, 6)) return;
          }
        }
      }

      // Side-launched homing interceptors destroy their assigned targets.
      updateDefenseMissiles(dt);

      // Enemy projectiles: delta-time movement, bounds and player hit detection.
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.update(frameScale);
        if (eb.x < -30 || eb.x > W + 30 || eb.y < -30 || eb.y > H + 30) {
          removePooled(enemyBullets, i, enemyBulletPool, MAX_ENEMY_BULLET_POOL);
          continue;
        }
        if (eb.x < player.x + player.w - 12 && eb.x + eb.w > player.x + 12 &&
            eb.y < player.y + player.h - 8 && eb.y + eb.h > player.y + 8) {
          removePooled(enemyBullets, i, enemyBulletPool, MAX_ENEMY_BULLET_POOL);
          if (player.invuln <= 0 && loseLife([255, 80, 100], 8)) return;
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'ring' || p.type === 'flash') {
          p.size += (p.type === 'ring' ? 2.4 : 1.0) * frameScale;
        } else {
          p.x += p.vx * frameScale;
          p.y += p.vy * frameScale;
          const drag = Math.pow(0.96, frameScale);
          p.vx *= drag;
          p.vy *= drag;
          if (p.type === 'ember') p.vy -= 0.035 * frameScale;
        }
        p.life -= p.decay * frameScale;
        if (p.life <= 0) {
          const last = particles.length - 1;
          const expired = particles[i];
          if (i !== last) particles[i] = particles[last];
          particles.pop();
          releaseParticle(expired);
        }
      }

      // Trails
      for (let i = trails.length - 1; i >= 0; i--) {
        trails[i].life -= 3.6 * dt;
        trails[i].y += 90 * dt;
        if (trails[i].life <= 0) {
          const last = trails.length - 1;
          if (i !== last) trails[i] = trails[last];
          trails.pop();
        }
      }

      // Combo timer
      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) {
          combo = 0;
          comboEl.classList.remove('show');
        }
      }

      // Shake decay
      if (shake > 0) shake *= Math.pow(0.85, frameScale);
      if (shake < 0.3) shake = 0;

      // Parallax scrolling: nebula layer is deliberately slower than the star field.
      parallaxNebulaOffset = (parallaxNebulaOffset + 3.5 * dt) % Math.max(1, H);
      parallaxStarOffset = (parallaxStarOffset + 17 * dt) % Math.max(1, H);
      // Foreground map props remain individually animated.
      for (const a of asteroids) {
        a.y += a.speed * frameScale;
        a.rot += a.rotSpeed * frameScale;
        if (a.y - a.r > H) {
          a.y = -a.r;
          a.x = Math.random() * W;
