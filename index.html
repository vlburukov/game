<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>vlburukov — Space Blast</title>
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="Space Blast — neon arcade shooter">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space Blast">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="space-blast-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="space-blast-icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: #0A0A0A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
      position: fixed;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #0A0A0A;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left, .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    .hud-right { align-items: flex-end; }
    .hud-mini {
      padding: 5px 10px;
      border-radius: 12px;
      background: rgba(10,10,10,0.72);
      border: 1px solid rgba(255,255,255,0.1);
      color: #9CA3AF;
      font-size: 10px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .hud-mini b { color: #F3F4F6; margin-left: 4px; font-size: 12px; }
    .hud-label { color: #9CA3AF; font-size: 9px; letter-spacing: 1.5px; margin-bottom: 2px; }
    #pause-btn {
      pointer-events: auto;
      border: 1px solid rgba(90,228,170,0.45);
      background: rgba(10,10,10,0.75);
      color: #5AE4AA;
      width: 42px; height: 42px;
      border-radius: 14px;
      font-size: 20px; font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    #pause-btn:active { transform: scale(.94); }
    #score-box {
      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 16px;
      border: 1px solid rgba(90, 228, 170, 0.28);
    }

    #score {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #5AE4AA;
      text-shadow: 0 0 12px rgba(90, 228, 170, 0.35);
    }

    #lives {
      font-size: 18px;
      letter-spacing: 4px;
      color: #F87171;
      text-shadow: none;
      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #FFFFFF;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #overlay .subtitle {
      color: #9CA3AF;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    #final-score {
      font-size: 56px;
      font-weight: 800;
      margin: 8px 0 6px;
      color: #5AE4AA;
      text-shadow: 0 0 24px rgba(90, 228, 170, 0.3);
    }

    #final-label {
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn {
      background: #5AE4AA;
      border: none;
      color: #0A0A0A;
      font-size: 17px;
      font-weight: 800;
      padding: 16px 48px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
      box-shadow: 0 4px 20px rgba(90, 228, 170, 0.25);
      letter-spacing: 0.5px;
    }

    .btn:active { transform: scale(0.96); filter: brightness(0.95); }
    .menu-actions { display:flex; flex-direction:column; gap:12px; width:min(280px,100%); }
    .btn-secondary {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.14);
      color: #F3F4F6;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: none;
    }
    .btn-secondary:active { border-color: rgba(90,228,170,0.55); color: #5AE4AA; }
    .shop-card {
      width:min(340px,100%); max-height:62vh; overflow:auto; margin:0 0 14px;
      padding:12px; border:1px solid rgba(255,255,255,0.1); border-radius:16px;
      background:rgba(16,16,16,.95); text-align:left;
    }
    .shop-row { display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 4px; border-bottom:1px solid rgba(148,163,184,.12); }
    .shop-row:last-child { border-bottom:0; }
    .shop-name { color:#e2e8f0; font-size:14px; font-weight:700; }
    .shop-desc { color:#94a3b8; font-size:11px; margin-top:3px; }
    .shop-buy { border:1px solid rgba(90,228,170,.5); background:rgba(90,228,170,.12);
      color:#5AE4AA; border-radius:12px; padding:9px 10px; font-weight:700; min-width:76px; }
    .shop-buy:disabled { opacity:.35; }
    #boss-bar-wrap { position:absolute; top:126px; left:12%; width:76%; height:10px;
      border:1px solid rgba(90,228,170,.55); border-radius:8px; overflow:hidden;
      background:rgba(0,0,0,.65); z-index:12; display:none; }
    #boss-bar { height:100%; width:100%; background:#5AE4AA;
      box-shadow:0 0 12px rgba(90,228,170,.45); transition:width .1s; }
    #boss-label { position:absolute; top:108px; width:100%; text-align:center; font-size:10px;
      color:#5AE4AA; letter-spacing:3px; z-index:12; display:none; text-shadow:none; }
    .power-toast { position:absolute; top:150px; left:0; right:0; text-align:center;
      color:#5AE4AA; font-weight:800; font-size:13px; text-shadow:0 0 12px rgba(90,228,170,.35);
      z-index:16; pointer-events:none; opacity:0; transition:opacity .2s; }
    .power-toast.show { opacity:1; }

    #combo {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 800;
      color: #5AE4AA;
      text-shadow: 0 0 16px rgba(90, 228, 170, 0.45);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      z-index: 15;
    }

    #combo.show {
      opacity: 1;
    }

    .hint {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      color: #475569;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
      padding: 0 20px;
    }

    .hint.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="hud-left">
        <div id="score-box"><div class="hud-label">СЧЁТ</div><div id="score">0</div></div>
        <div class="hud-mini">РЕКОРД <b id="best-score">0</b></div>
        <div class="hud-mini">ВРЕМЯ <b id="survival-time">0:00</b></div>
      </div>
      <div class="hud-right">
        <div id="lives">♥ ♥ ♥ ♥</div>
        <button id="pause-btn" aria-label="Пауза">Ⅱ</button>
        <button id="auto-btn" style="display:none;">АВТО</button>
      </div>
    </div>

    <div id="combo">x2</div>
    <div id="boss-label">БИТВА С БОССОМ</div>
    <div id="boss-bar-wrap"><div id="boss-bar"></div></div>
    <div id="power-toast" class="power-toast"></div>

    <canvas id="game"></canvas>

    <div class="hint" id="hint"></div>

    <div id="overlay">
      <h1>SPACE BLAST</h1>
      <p class="subtitle">NEON ARCADE · ВЫЖИВАНИЕ<br>Боссы · оружие · улучшения</p>
      <div class="menu-actions">
        <button class="btn" id="start-btn">ИГРАТЬ</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const hint = document.getElementById('hint');
    const comboEl = document.getElementById('combo');
    const bestScoreEl = document.getElementById('best-score');
    const survivalTimeEl = document.getElementById('survival-time');
    const pauseBtn = document.getElementById('pause-btn');
    const autoBtn = document.getElementById('auto-btn');
    const bossBarWrap = document.getElementById('boss-bar-wrap');
    const bossBar = document.getElementById('boss-bar');
    const bossLabel = document.getElementById('boss-label');
    const powerToast = document.getElementById('power-toast');
    let W, H, dpr;
    let animationId = null;
    let gameRunning = false;
    let isPaused = false;
    let score = 0;
    let bestScore = 0;
    try {
      bestScore = Number(localStorage.getItem('spaceBlastBest') || 0);
    } catch(e) {}
    bestScoreEl.textContent = bestScore;

    let selectedWeapon = 'beam';
    let autoRocket = false; // optional auto mode, default manual tap
    try {
      selectedWeapon = localStorage.getItem('spaceBlastWeapon') || 'beam';
      if (selectedWeapon === 'knives') selectedWeapon = 'beam';
    } catch(e) {}

    function updateAutoBtn() {
      if (!autoBtn) return;
      const show = selectedWeapon === 'rockets';
      autoBtn.style.display = show ? 'block' : 'none';
      if (!show) autoRocket = false;
      autoBtn.style.borderColor = autoRocket ? '#5AE4AA' : 'rgba(90,228,170,0.45)';
      autoBtn.style.background = autoRocket ? 'rgba(90,228,170,0.25)' : 'rgba(10,10,10,0.75)';
      autoBtn.textContent = autoRocket ? 'АВТО' : 'ТАП';
    }
    window.updateAutoBtn = updateAutoBtn;
    if (autoBtn) {
      autoBtn.addEventListener('click', () => {
        if (selectedWeapon !== 'rockets') return;
        autoRocket = !autoRocket;
        updateAutoBtn();
        showToast(autoRocket ? 'АВТО РЕЖИМ' : 'РУЧНОЙ РЕЖИМ');
      });
    }
    updateAutoBtn();
    let moveSpeed = 0;
    // Adaptive action director — dynamic difficulty + events
    let director = {
      pressure: 1,
      killStreak: 0,
      safeTimer: 0,
      eventTimer: 0,
      nextEvent: 16,
      mode: 'flow' // flow | assault | swarm | calm
    };

    // Settings (saved)
    let settings = {
      sound: true,
      shake: 'medium',
      particles: 'medium'
    };
    try {
      settings = Object.assign(settings, JSON.parse(localStorage.getItem('spaceBlastSettings') || '{}'));
      delete settings['vibration']; // discard old saved preference
    } catch(e) {}

    function saveSettings() {
      try { localStorage.setItem('spaceBlastSettings', JSON.stringify(settings)); } catch(e) {}
    }

    // --- Immersive procedural audio ---
    let audioCtx = null;
    let masterGain = null;
    let noiseBuffer = null;

    function ensureAudio() {
      if (!settings.sound) return null;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.55;
          masterGain.connect(audioCtx.destination);
          const len = Math.floor(audioCtx.sampleRate * 1.2);
          noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    let musicNodes = [];
    let musicPlaying = false;

    function startMusic() {
      const ctx = ensureAudio();
      if (!ctx || !masterGain || musicPlaying) return;
      musicPlaying = true;
      const notes = [146, 155, 174, 146, 138, 155, 146, 130];
      const bpm = 112;
      const beat = 60 / bpm;
      function playLoop() {
        if (!musicPlaying || !gameRunning) return;
        const t0 = ctx.currentTime;
        notes.forEach((freq, i) => {
          const start = t0 + i * beat;
          // Filtered lead
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, start);
          filter.frequency.exponentialRampToValueAtTime(300, start + beat * 0.7);
          filter.Q.value = 1.2;
          g.gain.setValueAtTime(0.0001, start);
          g.gain.exponentialRampToValueAtTime(0.028, start + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, start + beat * 0.8);
          osc.connect(filter);
          filter.connect(g);
          g.connect(masterGain);
          osc.start(start);
          osc.stop(start + beat * 0.85);
          musicNodes.push(osc);
          // Soft sine layer
          const sine = ctx.createOscillator();
          const sg = ctx.createGain();
          sine.type = 'sine';
          sine.frequency.value = freq * 2;
          sg.gain.setValueAtTime(0.0001, start);
          sg.gain.exponentialRampToValueAtTime(0.012, start + 0.06);
          sg.gain.exponentialRampToValueAtTime(0.0001, start + beat * 0.6);
          sine.connect(sg);
          sg.connect(masterGain);
          sine.start(start);
          sine.stop(start + beat * 0.7);
          musicNodes.push(sine);
        });
        // Deep filtered bass
        const bass = ctx.createOscillator();
        const bf = ctx.createBiquadFilter();
        const bg = ctx.createGain();
        bass.type = 'square';
        bass.frequency.value = 65;
        bf.type = 'lowpass';
        bf.frequency.value = 180;
        bg.gain.setValueAtTime(0.0001, t0);
        bg.gain.exponentialRampToValueAtTime(0.055, t0 + 0.06);
        bg.gain.exponentialRampToValueAtTime(0.0001, t0 + notes.length * beat * 0.92);
        bass.connect(bf);
        bf.connect(bg);
        bg.connect(masterGain);
        bass.start(t0);
        bass.stop(t0 + notes.length * beat);
        musicNodes.push(bass);
        setTimeout(playLoop, notes.length * beat * 1000);
      }
      playLoop();
    }

    function stopMusic() {
      musicPlaying = false;
      musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
      musicNodes = [];
    }

    function envGain(ctx, start, peak, attack, hold, release) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), start + attack);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.7), start + attack + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, start + attack + hold + release);
      return g;
    }

    /** type: hit | small | medium | large | nuclear | boss */
    function playExplosion(type, pan) {
      const ctx = ensureAudio();
      if (!ctx || !masterGain || !noiseBuffer) return;
      const t0 = ctx.currentTime;
      pan = pan || 0;
      let out = masterGain;
      if (ctx.createStereoPanner) {
        const panner = ctx.createStereoPanner();
        panner.pan.value = Math.max(-0.85, Math.min(0.85, pan));
        panner.connect(masterGain);
        out = panner;
      }
      const profiles = {
        hit:     { noise: 0.16, noiseDur: 0.07, thump: 95, thumpPeak: 0.18, crack: 560, crackPeak: 0.07, rumble: 0 },
        small:   { noise: 0.3,  noiseDur: 0.22, thump: 72, thumpPeak: 0.34, crack: 390, crackPeak: 0.15, rumble: 40 },
        medium:  { noise: 0.48, noiseDur: 0.42, thump: 48, thumpPeak: 0.55, crack: 280, crackPeak: 0.26, rumble: 30 },
        large:   { noise: 0.62, noiseDur: 0.62, thump: 36, thumpPeak: 0.7, crack: 220, crackPeak: 0.32, rumble: 22 },
        boss:    { noise: 0.62, noiseDur: 0.72, thump: 34, thumpPeak: 0.72, crack: 190, crackPeak: 0.34, rumble: 22 },
        nuclear: { noise: 0.88, noiseDur: 1.2,  thump: 26, thumpPeak: 0.95, crack: 150, crackPeak: 0.42, rumble: 16 }
      };
      const p = profiles[type] || profiles.small;

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const nFilter = ctx.createBiquadFilter();
      nFilter.type = 'lowpass';
      nFilter.frequency.setValueAtTime(1600 + Math.random() * 700, t0);
      nFilter.frequency.exponentialRampToValueAtTime(160 + Math.random() * 90, t0 + p.noiseDur * 0.65);
      nFilter.Q.value = 0.65;
      const nGain = envGain(ctx, t0, p.noise, 0.004, p.noiseDur * 0.12, p.noiseDur * 0.88);
      noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(out);
      noise.start(t0); noise.stop(t0 + p.noiseDur + 0.05);

      const thump = ctx.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(p.thump * (0.9 + Math.random() * 0.2), t0);
      thump.frequency.exponentialRampToValueAtTime(26, t0 + 0.2 + p.noiseDur * 0.15);
      const tGain = envGain(ctx, t0, p.thumpPeak, 0.006, 0.04, 0.25 + p.noiseDur * 0.12);
      thump.connect(tGain); tGain.connect(out);
      thump.start(t0); thump.stop(t0 + 0.5);

      const crack = ctx.createOscillator();
      crack.type = 'triangle';
      crack.frequency.setValueAtTime(p.crack * (0.85 + Math.random() * 0.3), t0);
      crack.frequency.exponentialRampToValueAtTime(p.crack * 0.22, t0 + 0.09);
      const cGain = envGain(ctx, t0, p.crackPeak, 0.002, 0.012, 0.1);
      crack.connect(cGain); cGain.connect(out);
      crack.start(t0); crack.stop(t0 + 0.14);

      if (p.rumble > 0) {
        const rumble = ctx.createOscillator();
        rumble.type = 'sine';
        rumble.frequency.setValueAtTime(p.rumble, t0);
        rumble.frequency.linearRampToValueAtTime(p.rumble * 0.55, t0 + p.noiseDur);
        const rGain = envGain(ctx, t0, type === 'nuclear' ? 0.55 : 0.26, 0.02, p.noiseDur * 0.28, p.noiseDur * 0.72);
        rumble.connect(rGain); rGain.connect(out);
        rumble.start(t0); rumble.stop(t0 + p.noiseDur + 0.12);
      }

      if (type === 'nuclear') {
        const boom2 = ctx.createOscillator();
        boom2.type = 'sine';
        boom2.frequency.setValueAtTime(48, t0 + 0.12);
        boom2.frequency.exponentialRampToValueAtTime(20, t0 + 0.55);
        const b2g = envGain(ctx, t0 + 0.12, 0.48, 0.02, 0.08, 0.45);
        boom2.connect(b2g); b2g.connect(out);
        boom2.start(t0 + 0.12); boom2.stop(t0 + 0.7);

        const sizzle = ctx.createBufferSource();
        sizzle.buffer = noiseBuffer;
        const sF = ctx.createBiquadFilter();
        sF.type = 'highpass';
        sF.frequency.value = 2500;
        const sG = envGain(ctx, t0, 0.18, 0.01, 0.18, 0.95);
        sizzle.connect(sF); sF.connect(sG); sG.connect(out);
        sizzle.start(t0); sizzle.stop(t0 + 1.15);
      }
    }

    function explosionSoundFromCount(count, x) {
      const pan = W ? ((x || W / 2) / W) * 2 - 1 : 0;
      if (count >= 70) playExplosion('large', pan);
      else if (count >= 28) playExplosion('medium', pan);
      else if (count >= 10) playExplosion('small', pan);
      else playExplosion('hit', pan);
    }

    function playFlyby(pan) {
      const ctx = ensureAudio();
      if (!ctx || !masterGain || !noiseBuffer) return;
      const t0 = ctx.currentTime;
      pan = pan || 0;
      let out = masterGain;
      if (ctx.createStereoPanner) {
        const panner = ctx.createStereoPanner();
        panner.pan.value = Math.max(-0.9, Math.min(0.9, pan));
        panner.connect(masterGain);
        out = panner;
      }
      // Clean high-speed pass
      const n = ctx.createBufferSource();
      n.buffer = noiseBuffer;
      const nf = ctx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(1400, t0);
      nf.frequency.exponentialRampToValueAtTime(500, t0 + 0.14);
      nf.Q.value = 1.8;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t0);
      ng.gain.exponentialRampToValueAtTime(0.2, t0 + 0.012);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      n.connect(nf); nf.connect(ng); ng.connect(out);
      n.start(t0); n.stop(t0 + 0.18);
    }

    function playKillRocket(pan) {
      const ctx = ensureAudio();
      if (!ctx || !masterGain || !noiseBuffer) return;
      const t0 = ctx.currentTime;
      pan = pan || 0;
      let out = masterGain;
      if (ctx.createStereoPanner) {
        const panner = ctx.createStereoPanner();
        panner.pan.value = Math.max(-0.85, Math.min(0.85, pan));
        panner.connect(masterGain);
        out = panner;
      }
      // Massive impact thump
      const thump = ctx.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(85, t0);
      thump.frequency.exponentialRampToValueAtTime(28, t0 + 0.35);
      const tg = ctx.createGain();
      tg.gain.setValueAtTime(0.0001, t0);
      tg.gain.exponentialRampToValueAtTime(0.85, t0 + 0.008);
      tg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
      thump.connect(tg); tg.connect(out);
      thump.start(t0); thump.stop(t0 + 0.5);
      // Secondary body
      const thump2 = ctx.createOscillator();
      thump2.type = 'triangle';
      thump2.frequency.setValueAtTime(160, t0);
      thump2.frequency.exponentialRampToValueAtTime(40, t0 + 0.25);
      const t2g = ctx.createGain();
      t2g.gain.setValueAtTime(0.0001, t0);
      t2g.gain.exponentialRampToValueAtTime(0.55, t0 + 0.01);
      t2g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      thump2.connect(t2g); t2g.connect(out);
      thump2.start(t0); thump2.stop(t0 + 0.35);
      // Crack + debris
      const crack = ctx.createOscillator();
      crack.type = 'square';
      crack.frequency.setValueAtTime(420, t0);
      crack.frequency.exponentialRampToValueAtTime(80, t0 + 0.08);
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.0001, t0);
      cg.gain.exponentialRampToValueAtTime(0.35, t0 + 0.003);
      cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      crack.connect(cg); cg.connect(out);
      crack.start(t0); crack.stop(t0 + 0.15);
      // Noise burst
      const n = ctx.createBufferSource();
      n.buffer = noiseBuffer;
      const nf = ctx.createBiquadFilter();
      nf.type = 'lowpass';
      nf.frequency.setValueAtTime(2200, t0);
      nf.frequency.exponentialRampToValueAtTime(180, t0 + 0.4);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t0);
      ng.gain.exponentialRampToValueAtTime(0.7, t0 + 0.006);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      n.connect(nf); nf.connect(ng); ng.connect(out);
      n.start(t0); n.stop(t0 + 0.55);
      // Rumble tail
      const rum = ctx.createOscillator();
      rum.type = 'sine';
      rum.frequency.setValueAtTime(32, t0 + 0.05);
      rum.frequency.linearRampToValueAtTime(18, t0 + 0.6);
      const rg = ctx.createGain();
      rg.gain.setValueAtTime(0.0001, t0 + 0.05);
      rg.gain.exponentialRampToValueAtTime(0.4, t0 + 0.08);
      rg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
      rum.connect(rg); rg.connect(out);
      rum.start(t0 + 0.05); rum.stop(t0 + 0.75);
    }

    let lastBeamAudioAt = 0;
    let lastRocketAudioAt = 0;

    function playShot(kind) {
      const audio = ensureAudio();
      if (!audio || !masterGain) return;
      const now = audio.currentTime;

      if (kind === 'rocket') {
        if (now - lastRocketAudioAt < 0.085) return;
        lastRocketAudioAt = now;

        const sub = audio.createOscillator();
        const subGain = audio.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(210, now);
        sub.frequency.exponentialRampToValueAtTime(72, now + 0.24);
        subGain.gain.setValueAtTime(0.0001, now);
        subGain.gain.exponentialRampToValueAtTime(0.12, now + 0.012);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.27);
        sub.connect(subGain);
        subGain.connect(masterGain);
        sub.start(now);
        sub.stop(now + 0.29);

        const edge = audio.createOscillator();
        const edgeFilter = audio.createBiquadFilter();
        const edgeGain = audio.createGain();
        edge.type = 'triangle';
        edge.frequency.setValueAtTime(520, now);
        edge.frequency.exponentialRampToValueAtTime(150, now + 0.16);
        edgeFilter.type = 'lowpass';
        edgeFilter.frequency.setValueAtTime(1500, now);
        edgeFilter.frequency.exponentialRampToValueAtTime(420, now + 0.18);
        edgeGain.gain.setValueAtTime(0.0001, now);
        edgeGain.gain.exponentialRampToValueAtTime(0.045, now + 0.008);
        edgeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);
        edge.connect(edgeFilter);
        edgeFilter.connect(edgeGain);
        edgeGain.connect(masterGain);
        edge.start(now);
        edge.stop(now + 0.21);
      } else {
        if (now - lastBeamAudioAt < 0.052) return;
        lastBeamAudioAt = now;

        const zap = audio.createOscillator();
        const zapFilter = audio.createBiquadFilter();
        const zapGain = audio.createGain();
        zap.type = 'sawtooth';
        zap.frequency.setValueAtTime(1180, now);
        zap.frequency.exponentialRampToValueAtTime(390, now + 0.075);
        zapFilter.type = 'lowpass';
        zapFilter.frequency.setValueAtTime(2600, now);
        zapFilter.frequency.exponentialRampToValueAtTime(900, now + 0.075);
        zapFilter.Q.value = 0.7;
        zapGain.gain.setValueAtTime(0.0001, now);
        zapGain.gain.exponentialRampToValueAtTime(0.052, now + 0.003);
        zapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
        zap.connect(zapFilter);
        zapFilter.connect(zapGain);
        zapGain.connect(masterGain);
        zap.start(now);
        zap.stop(now + 0.09);

        const body = audio.createOscillator();
        const bodyGain = audio.createGain();
        body.type = 'sine';
        body.frequency.setValueAtTime(190, now);
        body.frequency.exponentialRampToValueAtTime(115, now + 0.045);
        bodyGain.gain.setValueAtTime(0.0001, now);
        bodyGain.gain.exponentialRampToValueAtTime(0.022, now + 0.004);
        bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.052);
        body.connect(bodyGain);
        bodyGain.connect(masterGain);
        body.start(now);
        body.stop(now + 0.06);
      }
    }

    function fireRocketToward(px, py) {
      if (!gameRunning || isPaused) return false;
      const now = performance.now();
      if (now - lastShot < 220) return false;
      lastShot = now;
      const center = player.x + player.w / 2;
      const sy = player.y + 4;
      let baseAng = Math.atan2(py - sy, px - center);
      if (Math.hypot(px - center, py - sy) < 30) baseAng = -Math.PI / 2;
      const spd = 10;
      // 3 anti-rockets in a spread
      const spreads = [-0.18, 0, 0.18];
      for (const off of spreads) {
        const ang = baseAng + off;
        bullets.push({
          type: 'rocket',
          x: center - 8 + (off * 18), y: sy, w: 18, h: 30,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          speed: spd, side: 0, dmg: 3,
          rot: ang + Math.PI / 2,
          guidance: 0.3,
          trailTimer: 0, life: 0
        });
      }
      playShot('rocket');
      if (bullets.length > 80) bullets.splice(0, bullets.length - 80);
      return true;
    }

    function fireAutoRocket() {

    function shoot() {
      if (!gameRunning) return;

      let hasVisible = false;

    function spawnEnemy(forceAi) {
      const size = 42 + Math.random() * 22;
      const p = director.pressure;
      const fastChance = Math.min(0.04 + p * 0.04, 0.2) * BASE.fastMul;
      const tankChance = Math.min(0.03 + p * 0.025, 0.14);
      const roll = Math.random();
      let type = 'normal';
      if (roll < tankChance) type = 'tank';
      else if (roll < tankChance + fastChance) type = 'fast';

      let speed, hp, color;
      const cfgSp = (typeof waveCfg === 'function' ? waveCfg() : null);
      const waveSpeed = cfgSp ? cfgSp.speedMul : 1;
      const rocketSlow = 1;
      const speedBoost = (0.85 + p * 0.15) * BASE.speedMul * rocketSlow * waveSpeed * 0.92;

      if (type === 'fast') {
        speed = (3.2 + Math.random() * 1.2) * speedBoost;
        hp = 1;
        color = [255, 100, 120];
      } else if (type === 'tank') {
        speed = (1.8 + Math.random() * 0.6) * speedBoost;
        hp = BASE.tankHp + (p > 1.6 ? 1 : 0);
        color = [140, 140, 160];
      } else {
        speed = (2.4 + Math.random() * 1.0) * speedBoost;
        hp = 1;
        color = [200, 160, 120];
      }

      // AI mix shifts with director mode
      const aiRoll = Math.random();
      let ai = 'weave';
      if (forceAi) ai = forceAi;
      else if (director.mode === 'assault') {
        if (aiRoll > 0.55) ai = 'chase';
        else if (aiRoll > 0.35) ai = 'kamikaze';
        else if (aiRoll > 0.2) ai = 'shooter';
        else ai = 'flank';
      } else if (director.mode === 'swarm') {
        ai = aiRoll > 0.5 ? 'weave' : 'chase';
      } else if (director.mode === 'calm') {
        ai = aiRoll > 0.7 ? 'chase' : 'weave';
      } else {
        if (aiRoll > 0.9) ai = 'kamikaze';
        else if (aiRoll > 0.78) ai = 'flank';
        else if (aiRoll > 0.62) ai = 'shooter';
        else if (type === 'fast' || aiRoll > 0.4) ai = 'chase';
        else if (type === 'tank' || aiRoll < 0.18) ai = 'tank';
      }

      if (ai === 'kamikaze') {
        color = [255, 70, 70];
        speed *= 1.1;
      } else if (ai === 'shooter') {
        color = [100, 190, 220];
      } else if (ai === 'flank') {
        color = [230, 190, 80];
      }

      const fromSide = false;
      const spawnY = -size - 10;
      enemies.push({
        x: fromSide ? (Math.random() < 0.5 ? -size - 30 : W + 30) : Math.random() * (W - size - 20) + 10,
        y: fromSide ? (20 + Math.random() * H * 0.25) : spawnY,
        w: size,
        h: size,
        speed,
        hp,
        maxHp: hp,
        type,
        color,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.08,
        ai,
        phase: Math.random() * Math.PI * 2,
        vx: fromSide ? (Math.random() < 0.5 ? 2.0 : -2.0) : (Math.random() - 0.5) * 1.0,
        aimLean: 0.35 + Math.random() * 0.45,
        fireCd: 50 + Math.random() * 45,
        dive: false
      });
      const enemyCap = 68;
      if (enemies.length > enemyCap) enemies.splice(0, enemies.length - enemyCap);
    }

    function triggerDirectorEvent() {
      // Only during active fight — never during clearing/breather

      const roll = Math.random();

        if (wave.n >= 6 && Math.random() < 0.35) spawnEnemy('kamikaze');
      } else if (roll < 0.55) {

        spawnEnemy('weave');

      } else if (roll < 0.78) {
        director.mode = 'assault';
        showToast('↗ ФЛАНГ');
        spawnEnemy('flank');
      } else {
        // Quiet moment — no toast, just briefly lower pressure
        director.mode = 'calm';

      director.nextEvent = 20 + Math.random() * 14;
