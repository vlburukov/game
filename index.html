    function cachedGradient(key, factory) {
      if (!gradientCache.has(key)) { if (gradientCache.size > 12) gradientCache.clear(); gradientCache.set(key, factory()); }
      return gradientCache.get(key);
    }
    function clearGradientCache() { gradientCache.clear(); }

    function drawShip(x, y, w, h) {
      // Clean stealth fighter: one centered exhaust plume and a breathing hull outline.
      const pulse = 0.5 + 0.5 * Math.sin(time * 0.105);
      const flameWave = 0.5 + 0.5 * Math.sin(time * 0.24);
      const flameLength = 10 + flameWave * 7;
      const flameWidth = 3.2 + flameWave * 1.2;
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      // One single flame directly behind the ship, drawn first so it sits underneath the hull.
      ctx.save();
      ctx.globalAlpha = 0.78 + flameWave * 0.2;
      const flame = ctx.createLinearGradient(0, h / 2 - 3, 0, h / 2 + flameLength);
      flame.addColorStop(0, 'rgba(185, 250, 255, 0.98)');
      flame.addColorStop(0.28, 'rgba(65, 220, 255, 0.95)');
      flame.addColorStop(0.68, 'rgba(35, 145, 255, 0.55)');
      flame.addColorStop(1, 'rgba(35, 145, 255, 0)');
      ctx.fillStyle = flame;
      ctx.beginPath();
      ctx.moveTo(-flameWidth * 0.55, h / 2 - 2);
      ctx.quadraticCurveTo(-flameWidth * 0.9, h / 2 + flameLength * 0.48, 0, h / 2 + flameLength);
      ctx.quadraticCurveTo(flameWidth * 0.9, h / 2 + flameLength * 0.48, flameWidth * 0.55, h / 2 - 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Metallic graphite hull: brighter facets keep the ship readable against space.
      const body = ctx.createLinearGradient(-w * 0.48, -h * 0.25, w * 0.42, h * 0.35);
      body.addColorStop(0, '#526579');
      body.addColorStop(0.32, '#26394c');
      body.addColorStop(0.7, '#182838');
      body.addColorStop(1, '#40566b');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 - 4);
      ctx.lineTo(w / 2 - 1, h / 2 - 8);
      ctx.lineTo(w / 2 - 10, h / 2 + 2);
      ctx.lineTo(0, h / 2 - 12);
      ctx.lineTo(-(w / 2 - 10), h / 2 + 2);
      ctx.lineTo(-(w / 2 - 1), h / 2 - 8);
      ctx.closePath();
      ctx.fill();

      // Raised center armor panel.
      ctx.fillStyle = '#71879a';
      ctx.globalAlpha = 0.34 + pulse * 0.12;
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 - 2);
      ctx.lineTo(6, -h / 2 + 10);
      ctx.lineTo(4, h / 2 - 13);
      ctx.lineTo(0, h / 2 - 9);
      ctx.lineTo(-4, h / 2 - 13);
      ctx.lineTo(-6, -h / 2 + 10);
      ctx.closePath();
      ctx.fill();

      // Intercept mode switches the ship's breathing contour from cyan to green.
      const pulseColor = defenseModeEnabled
        ? { r: 100, g: 255, b: 155, glow: 'rgba(65, 255, 135, 0.95)' }
        : { r: 115, g: 225, b: 255, glow: 'rgba(65, 205, 255, 0.9)' };
      ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(${pulseColor.r}, ${pulseColor.g}, ${pulseColor.b}, ${0.48 + pulse * 0.48})`;
      ctx.lineWidth = 1.15 + pulse * 0.45;
      ctx.shadowColor = pulseColor.glow;
      ctx.shadowBlur = 2 + pulse * 7;
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 - 4);
      ctx.lineTo(w / 2 - 1, h / 2 - 8);
      ctx.lineTo(w / 2 - 10, h / 2 + 2);
      ctx.lineTo(0, h / 2 - 12);
      ctx.lineTo(-(w / 2 - 10), h / 2 + 2);
      ctx.lineTo(-(w / 2 - 1), h / 2 - 8);
      ctx.closePath();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Cockpit removed: keep a clean, uninterrupted fighter silhouette.
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x + e.w / 2, e.y + e.h / 2);
      ctx.rotate(e.rot || 0);
      const [r, g, b] = e.color;
      const pulse = 0.85 + Math.sin((e.phase || 0) * 3) * 0.15;

      const ai = e.ai || 'weave';

      // Soft aura — simplified (no gradient per enemy)
      ctx.globalAlpha = 0.28 * pulse;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.arc(0, 0, e.w * 0.68, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Shape by type / AI
      ctx.beginPath();
      if (e.type === 'tank') {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
          const px = Math.cos(a) * e.w * 0.46;
          const py = Math.sin(a) * e.h * 0.46;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else if (e.type === 'fast' || ai === 'kamikaze') {
        // Arrowhead
        ctx.moveTo(0, -e.h * 0.52);
        ctx.lineTo(e.w * 0.42, e.h * 0.18);
        ctx.lineTo(e.w * 0.12, e.h * 0.1);
        ctx.lineTo(e.w * 0.18, e.h * 0.48);
        ctx.lineTo(-e.w * 0.18, e.h * 0.48);
        ctx.lineTo(-e.w * 0.12, e.h * 0.1);
        ctx.lineTo(-e.w * 0.42, e.h * 0.18);
        ctx.closePath();
      } else if (ai === 'flank') {
        // Crescent / blade
        ctx.moveTo(0, -e.h * 0.45);
        ctx.quadraticCurveTo(e.w * 0.55, 0, 0, e.h * 0.45);
        ctx.quadraticCurveTo(e.w * 0.18, 0, 0, -e.h * 0.45);
        ctx.closePath();
      } else if (ai === 'shooter') {
        // Ring-core disc
        ctx.arc(0, 0, e.w * 0.42, 0, Math.PI * 2);
      } else {
        // Crystal shard
        ctx.moveTo(0, -e.h * 0.5);
        ctx.lineTo(e.w * 0.38, -e.h * 0.08);
        ctx.lineTo(e.w * 0.22, e.h * 0.48);
        ctx.lineTo(-e.w * 0.22, e.h * 0.48);
        ctx.lineTo(-e.w * 0.38, -e.h * 0.08);
        ctx.closePath();
      }

      // Body — solid color, no gradient
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * pulse})`;
      ctx.lineWidth = 1.1;
      ctx.stroke();

      // Core gem — simple
      ctx.fillStyle = `rgba(255,255,255,${0.75 + pulse * 0.15})`;
      ctx.beginPath();
      ctx.arc(0, -e.h * 0.05, e.w * 0.13, 0, Math.PI * 2);
      ctx.fill();

      // Accent dots / "eyes"
      if (e.type !== 'tank') {
        ctx.fillStyle = 'rgba(10,12,20,0.85)';
        ctx.beginPath();
        ctx.arc(-e.w * 0.14, -e.h * 0.12, e.w * 0.07, 0, Math.PI * 2);
        ctx.arc(e.w * 0.14, -e.h * 0.12, e.w * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.5 + pulse * 0.3})`;
        ctx.beginPath();
        ctx.arc(-e.w * 0.12, -e.h * 0.14, e.w * 0.025, 0, Math.PI * 2);
        ctx.arc(e.w * 0.16, -e.h * 0.14, e.w * 0.025, 0, Math.PI * 2);
        ctx.fill();
      }

      if (e.type === 'tank' && e.hp < e.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-e.w * 0.3, e.h * 0.52, e.w * 0.6, 5);
        ctx.fillStyle = '#9CA3AF';
        ctx.fillRect(-e.w * 0.3, e.h * 0.52, e.w * 0.6 * (e.hp / e.maxHp), 5);
      }
      ctx.restore();
    }

    function draw() {
      // Background — равномерное космическое поле без чёрной полосы сверху.
      const spaceGradient = cachedGradient(`space-bg:${W}:${H}`, () => {
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, '#02050d');
        gradient.addColorStop(0.48, '#070b19');
        gradient.addColorStop(1, '#01040c');
        return gradient;
      });
      ctx.fillStyle = spaceGradient;
      ctx.fillRect(0, 0, W, H);

      // Очень лёгкие цветные облака: фон остаётся космосом, а не плотным туманом.
      drawTiledLayer(parallaxNebulaLayer, parallaxNebulaOffset, 0.24);

      // Vignette
      const vig = cachedGradient(`vignette:${W}:${H}:${currentMap.vignette}`, () => { const g = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85); g.addColorStop(0, 'transparent'); g.addColorStop(1, currentMap.vignette); return g; });
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);

      // Screen shake — плавное колебание вместо случайного смещения каждый кадр.
      ctx.save();
      if (shake > 0) {
        const shakePhase = time * 0.72;
        ctx.translate(
          Math.sin(shakePhase) * shake * 0.36,
          Math.cos(shakePhase * 0.83) * shake * 0.29
        );
      }

      // Cached star layer moves faster than the nebula for depth.
      drawTiledLayer(parallaxStarLayer, parallaxStarOffset, 1);

      // Asteroids (subtle gray)
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.fillStyle = 'rgba(80, 90, 95, 0.45)';
        ctx.beginPath();
        ctx.moveTo(a.r, 0);
        for (let i = 1; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          const rr = a.r * (0.7 + (i % 2) * 0.3);
          ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Engine trails — simpler fill, no gradient
      for (const t of trails) {
        ctx.globalAlpha = t.life * 0.45;
        ctx.fillStyle = 'rgba(120, 80, 200, 0.7)';
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Compact energy-pulse projectiles: a bright narrow bolt with a short fading tail.
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const b of bullets) {
        const cx = b.x + b.w / 2;
        const pulse = 0.88 + Math.sin(time * 0.4 + (b.pulse || 0)) * 0.12;

        // Short cyan afterglow behind the moving pulse.
        ctx.fillStyle = `rgba(0, 220, 255, ${0.22 * pulse})`;
        ctx.fillRect(cx - 1.5, b.y + 8, 3, 8);
        ctx.fillStyle = `rgba(70, 245, 255, ${0.48 * pulse})`;
        ctx.fillRect(cx - 1, b.y + 5, 2, 10);

        // Slim, saturated energy body.
        ctx.fillStyle = `rgba(0, 205, 255, ${0.82 * pulse})`;
        ctx.fillRect(cx - 1.6, b.y + 2, 3.2, 11);
        ctx.fillStyle = '#eaffff';
        ctx.fillRect(cx - 0.7, b.y + 1, 1.4, 11);

        // Crisp white leading point.
        ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
        ctx.fillRect(cx - 1, b.y, 2, 3);
      }
      ctx.restore();

      // Enemy bullets
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const eb of enemyBullets) {
        ctx.fillStyle = 'rgba(255,80,80,0.35)';
        ctx.beginPath();
        ctx.arc(eb.x + eb.w / 2, eb.y + eb.h / 2, 10, 0, Math.PI * 2);
        ctx.fill();
        eb.draw(ctx);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(eb.x + 1, eb.y + 2, Math.max(1, eb.w - 2), Math.max(1, eb.h - 4));
      }

      ctx.restore();

      // Enemies and optional side-launched defense missiles.
      for (const e of enemies) e.draw();
      drawDefenseMissiles();

      // Neon boss and pre-attack laser warning.
      if (boss) {
        if (boss.telegraph > 0) {
          const sx = boss.x + boss.w / 2, sy = boss.y + boss.h;
          const ex = sx + Math.cos(boss.telegraphAngle) * Math.max(W, H) * 1.4;
          const ey = sy + Math.sin(boss.telegraphAngle) * Math.max(W, H) * 1.4;
          const warn = 0.35 + (1 - boss.telegraph / 1.0) * 0.55;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const nx = -Math.sin(boss.telegraphAngle) * 2.5, ny = Math.cos(boss.telegraphAngle) * 2.5;
          ctx.strokeStyle = `rgba(255,35,55,${warn})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
          ctx.moveTo(sx + nx, sy + ny); ctx.lineTo(ex + nx, ey + ny);
          ctx.moveTo(sx - nx, sy - ny); ctx.lineTo(ex - nx, ey - ny); ctx.stroke();
          ctx.strokeStyle = `rgba(255,90,90,${warn * 0.22})`; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
          ctx.restore();
        }
        ctx.save();
        const bossPhaseTwo = boss.combatPhase === 2;
        ctx.shadowBlur = bossPhaseTwo ? 18 : 13;
        ctx.shadowColor = bossPhaseTwo ? '#ff1f35' : '#ff2d75';
        ctx.fillStyle = bossPhaseTwo ? '#7f1d1d' : '#a21caf';
        ctx.beginPath();
        ctx.moveTo(boss.x + boss.w*.5, boss.y + boss.h);
        ctx.lineTo(boss.x, boss.y + boss.h*.2);
        ctx.lineTo(boss.x + boss.w*.12, boss.y);
        ctx.lineTo(boss.x + boss.w*.88, boss.y);
        ctx.lineTo(boss.x + boss.w, boss.y + boss.h*.2);

        ctx.strokeStyle = bossPhaseTwo ? '#ff3344' : '#ff6aa9'; ctx.lineWidth = bossPhaseTwo ? 3 : 2; ctx.stroke();

          ctx.moveTo(boss.x + 8, boss.y + 18); ctx.lineTo(boss.x - 8, boss.y - 5); ctx.lineTo(boss.x + 25, boss.y + 10);
          ctx.moveTo(boss.x + boss.w - 8, boss.y + 18); ctx.lineTo(boss.x + boss.w + 8, boss.y - 5); ctx.lineTo(boss.x + boss.w - 25, boss.y + 10);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#fff'; ctx.fillRect(boss.x+22,boss.y+20,12,6);
        ctx.fillRect(boss.x+boss.w-34,boss.y+20,12,6);
        ctx.fillStyle = bossPhaseTwo ? '#fff1f2' : '#ff2d75'; ctx.fillRect(boss.x+boss.w*.35,boss.y+36,boss.w*.3,5);
        ctx.restore();
      }

      // Falling nuclear bomb pickups (large, easy to catch)
      for (const p of powerUps) {
        if (p.type !== 'bomb') continue;
        const cx = p.x + p.w / 2;
        const cy = p.y + p.h / 2;
        const pulse = 0.7 + Math.sin(time * 0.15 + p.bob) * 0.3;
        ctx.save();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.28 * pulse; ctx.fillStyle = '#ff6b2d';
        ctx.beginPath();
        ctx.arc(cx, cy, 32, 0, Math.PI * 2);
        ctx.fill(); ctx.restore();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(cx, cy + 2, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff6b2d';
        ctx.beginPath();
        ctx.arc(cx, cy + 2, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffe566';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☢', cx, cy + 2);
        ctx.fillStyle = '#c2410c';
        ctx.fillRect(cx - 18, cy + 12, 8, 10);
        ctx.fillRect(cx + 10, cy + 12, 8, 10);
        ctx.restore();
      }

      // Floating score popups above defeated enemies.
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '800 15px -apple-system, BlinkMacSystemFont, sans-serif';
      for (const ft of floatingTexts) {
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.fillStyle = ft.color;
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 6;
        ctx.fillText(ft.text, ft.x, ft.y);
      }
      ctx.restore();

      // Blink while invulnerable; collision protection is handled in update().
      if (player.invuln <= 0 || Math.floor(time / 3) % 2 === 0) {
        player.draw(ctx);
      }

      // Rocket lock-on rings
      for (const ring of lockRings) {
        ctx.strokeStyle = `rgba(90,228,170,${ring.life * 0.85})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${ring.life * 0.35})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.r * 0.55, 0, Math.PI * 2);
        ctx.stroke();
      }

      // NEW: additive neon blending for particles, sparks and explosions.
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const a = Math.max(0, p.life);
        const px = p.x | 0, py = p.y | 0;
        if (p.type === 'flash') {
          ctx.globalAlpha = a * 0.75;
          ctx.fillStyle = `rgba(255,255,240,${a})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 0.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (p.type === 'ring') {
          ctx.strokeStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a * 0.5})`;
          ctx.lineWidth = 1.5 + (1 - a) * 4;
          ctx.beginPath();
          ctx.arc(px, py, p.size * (1.05 - a * 0.4), 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.type === 'spark') {
          ctx.strokeStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a})`;
          ctx.lineWidth = Math.max(1, p.size * 0.4);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px - p.vx * 1.6, py - p.vy * 1.6);
          ctx.stroke();
          ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 0.3 * a, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'ember') {
          ctx.globalAlpha = a * 0.85;
          ctx.fillStyle = `rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 1.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a * 0.8})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * (0.55 + a * 0.35), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1; ctx.restore();

      // Nuclear explosion — elegant full-screen clear
      if (bombFlash > 0 || bombShockwaves.length) {
        ctx.save();
        const ox = bombOriginX || W / 2;
        const oy = bombOriginY || H * 0.45;

        if (bombFlash > 0) {
          // Soft full-screen white bloom
          const intensity = Math.min(0.75, bombFlash * 0.85);
          ctx.globalAlpha = intensity;
          const flash = cachedGradient(`nuclear:${W}:${H}:${ox}:${oy}`, () => { const g = ctx.createRadialGradient(ox, oy, 2, ox, oy, Math.max(W, H) * 1.1); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.15, 'rgba(255,255,220,0.9)'); g.addColorStop(0.4, 'rgba(180,255,220,0.45)'); g.addColorStop(0.7, 'rgba(120,180,255,0.2)'); g.addColorStop(1, 'rgba(0,0,0,0)'); return g; });
          ctx.fillStyle = flash;
          ctx.fillRect(0, 0, W, H);

          // Gentle mint/white screen wash that fades
          ctx.globalAlpha = Math.min(0.25, bombFlash * 0.3);
          ctx.fillStyle = 'rgba(200, 255, 230, 1)';
          ctx.fillRect(0, 0, W, H);
        }

        // Elegant expanding rings
        for (const sw of bombShockwaves) {
          const a = Math.max(0, sw.life);
          ctx.globalAlpha = a * 0.75;
          ctx.strokeStyle = `rgba(${sw.color},${a})`;
          ctx.lineWidth = sw.width + (1 - a) * 5;
          ctx.beginPath();
          ctx.arc(ox, oy, sw.r, 0, Math.PI * 2);
          ctx.stroke();
          // Soft outer glow
          ctx.globalAlpha = a * 0.2;
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(ox, oy, sw.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // Kill-cam flash
      if (killFlash > 0) {
        ctx.fillStyle = `rgba(90,228,170,${killFlash * 0.25})`;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = `rgba(255,255,255,${killFlash * 0.18})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    let lastFrameTime = 0;
    function loop(timestamp) {
      const now = timestamp || performance.now();
      const dt = lastFrameTime ? Math.min(1 / 30, Math.max(0, (now - lastFrameTime) / 1000)) : 1 / 60;
      lastFrameTime = now;

      if (perf.lastT) {
        const fps = 1000 / Math.max(1, now - perf.lastT);
        perf.fps = perf.fps * 0.88 + fps * 0.12;
        perf.frames++;
        if (perf.frames % 25 === 0) {
          // Hysteresis prevents rapid quality switching around the FPS threshold.
          if (!perf.lowFps && perf.fps < 46) perf.lowFps = true;
          else if (perf.lowFps && perf.fps > 54) perf.lowFps = false;
          // Keep the user's graphics preference intact; particleMul() scales effects temporarily.
        }
      }
      perf.lastT = now;

      if (slowMo > 0) slowMo = Math.max(0, slowMo - dt * 60);
      // NEW: freeze simulation for ~50 ms while rendering continues smoothly.
      if (hitstopTimer > 0) hitstopTimer = Math.max(0, hitstopTimer - dt);
      else update(dt * (slowMo > 0 ? 0.5 : 1));
      const frameScale = dt * 60;
      for (let i = lockRings.length - 1; i >= 0; i--) {
        lockRings[i].life -= 3 * dt;
        lockRings[i].r += 72 * dt;
        if (lockRings[i].life <= 0) removeAtSwap(lockRings, i);
      }
      draw();
      if (gameRunning) animationId = requestAnimationFrame(loop);
      else animationId = null;
    }

    function updateLives() {
      if (lives <= 0) {
        livesEl.textContent = '💀';
      } else {
        livesEl.textContent = '♥ '.repeat(lives).trim();
      }
    }

    function startGame(level) {
      if (level != null) selectedLevel = level;
      selectedLevel = Math.min(20, maxUnlocked, Math.max(1, selectedLevel || 1));
      try { localStorage.setItem('spaceBlastLevel', String(selectedLevel)); } catch(e) {}
      initStars();

      score = 0;
      lives = 4;
      boss = null; bossSpawnedFor = 0; powerModeTimer = 0;
      defenseMissiles.length = 0; defenseModeEnabled = false; defenseModeUsed = false; successfulIntercepts = 0; defenseSpawnCounter = 0;
      defenseToggle.classList.remove('active'); defenseToggle.textContent = 'ПЕРЕХВАТ: ВЫКЛ'; defenseToggle.setAttribute('aria-pressed', 'false');
      bombFlash = 0; bombRing = 0; bombSpawnTimer = 0; bombShockwaves = [];
      nextBombAt = 10 + Math.random() * 10;
      powerUps = [];
      bossBarWrap.style.display = 'none'; bossLabel.style.display = 'none';
      combo = 0;
      comboTimer = 0;
      killFlash = 0; slowMo = 0; hitstopTimer = 0; lockRings = [];
      gameTime = 0;
      lastShownSecond = -1;
      perf.frames = 0;
      perf.lastT = 0;
      perf.fps = 60;
      perf.lowFps = false;
      difficulty = 1;
      wave = { n: 1, phase: 'fight', timer: 0, kills: 0 };
      noEnemyTimer = 0;
      const cfg = waveCfg();
      director = { pressure: cfg.pressure, killStreak: 0, safeTimer: 0, eventTimer: 0, nextEvent: 22, mode: 'flow' };
      clearPooled(bullets, bulletPool, MAX_BULLET_POOL);
      clearPooled(enemyBullets, enemyBulletPool, MAX_ENEMY_BULLET_POOL);
      clearPooled(enemies, enemyPool, MAX_ENEMY_POOL);
      floatingTexts.length = 0; player.invuln = 0;
      clearParticles();
      trails = [];
      trailSpawnTimer = 0;
      shake = 0;
      scoreEl.textContent = '0';
      survivalTimeEl.textContent = '0:00';
      isPaused = false;
      pauseBtn.textContent = 'Ⅱ';
      updateLives();
      comboEl.classList.remove('show');
      player.x = W / 2 - player.w / 2;
      player.y = H - 90;
      player.targetX = player.x;
      player.targetY = player.y;
      overlay.classList.add('hidden');
      hint.classList.add('hidden');
      gameRunning = true;
      lastFrameTime = 0;
      enemySpawnTimer = 0;
      shotCooldown = 0;
      showToast(`УР. ${selectedLevel} · ВОЛНА 1`);
      if (!animationId) loop();
      ensureAudio();
      unlockAudio();
      startMusic();

    }

    function gameOver() {
      stopMusic();
      gameRunning = false;
      isPaused = false;
      pauseBtn.textContent = 'Ⅱ';
      const isNewRecord = score > bestScore;
      if (isNewRecord) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        try { localStorage.setItem('spaceBlastBest', String(bestScore)); } catch(e) {}
      }

      const wpnName = 'Луч';
      const shareText = `Space Blast: ${score} очков · ур.${wave.n} · ${wpnName}`;
      const interceptSummary = defenseModeUsed ? `<p class="subtitle" style="margin:0 0 14px">Успешных перехватов: <strong>${successfulIntercepts}</strong></p>` : '';
      overlay.innerHTML = `
        <h1>GAME OVER</h1>
        <div id="final-score">${score}</div>
        <div id="final-label">очков</div>
        <p class="subtitle" style="margin-bottom:12px">Время ${formatTime(gameTime)} · Уровень ${wave.n}<br>Оружие: ${wpnName}${isNewRecord ? '<br>🏅 Новый рекорд' : ''}</p>
        ${interceptSummary}
        <button class="btn" id="restart-btn">ЕЩЁ РАЗ</button>
        <button class="btn-secondary" id="share-btn" style="margin-top:10px">ПОДЕЛИТЬСЯ</button>
        <button class="btn-secondary" id="menu-btn" style="margin-top:10px">В МЕНЮ</button>
      `;
      overlay.classList.remove('hidden');
      const nextBtn = document.getElementById('next-level-btn');
      if (nextBtn) nextBtn.addEventListener('click', () => { selectedLevel = Math.min(20, selectedLevel + 1); try { localStorage.setItem('spaceBlastLevel', String(selectedLevel)); } catch(e) {} startGame(selectedLevel); });
      document.getElementById('menu-btn').addEventListener('click', showMainMenu);
      const shareBtn = document.getElementById('share-btn');
      if (shareBtn) shareBtn.addEventListener('click', async () => {
        try {
          if (navigator.share) await navigator.share({ title: 'Space Blast', text: shareText, url: location.href });
          else if (navigator.clipboard) { await navigator.clipboard.writeText(shareText + ' ' + location.href); showToast('Скопировано'); }
        } catch (e) {}
      });
    }

    function togglePause() {
      if (!gameRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶' : 'Ⅱ';
      if (isPaused) {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        overlay.innerHTML = `
          <h1>ПАУЗА</h1>
          <p class="subtitle">Игра остановлена.</p>
          <div class="menu-actions">
            <button class="btn" id="resume-btn">ПРОДОЛЖИТЬ</button>
            <button class="btn-secondary" id="pause-settings-btn">⚙ НАСТРОЙКИ</button>
            <button class="btn-secondary" id="pause-menu-btn">В ГЛАВНОЕ МЕНЮ</button>
          </div>
        `;
        overlay.classList.remove('hidden');
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('pause-settings-btn').addEventListener('click', openSettings);
        document.getElementById('pause-menu-btn').addEventListener('click', showMainMenu);
      } else {
        if (audioCtx && audioCtx.state !== 'running' && settings.sound) audioCtx.resume().catch(() => {});
        overlay.classList.add('hidden');
        lastFrameTime = 0;
        if (gameRunning && !animationId) loop();
      }
    }

    defenseToggle.addEventListener('click', () => {
      if (!gameRunning || isPaused) return;
      defenseModeEnabled = !defenseModeEnabled;
      if (defenseModeEnabled) defenseModeUsed = true;
      defenseSpawnCounter = 0;
      defenseToggle.classList.toggle('active', defenseModeEnabled);
      defenseToggle.textContent = defenseModeEnabled ? 'ПЕРЕХВАТ: ВКЛ' : 'ПЕРЕХВАТ: ВЫКЛ';
      defenseToggle.setAttribute('aria-pressed', String(defenseModeEnabled));
      showToast(defenseModeEnabled ? 'СИСТЕМА ПЕРЕХВАТА ВКЛЮЧЕНА' : 'СИСТЕМА ПЕРЕХВАТА ВЫКЛЮЧЕНА');
    });
    pauseBtn.addEventListener('click', togglePause);
    window.addEventListener('keydown', e => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
      }
    });
    // NEW: suspend audio while hidden; resume only when gameplay is active again.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
        if (gameRunning && !isPaused) togglePause();
      } // On iOS, audio resumes on the next touch/click through unlockAudio().
    });

    function showToast(message) {
      powerToast.textContent = message;
      powerToast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => powerToast.classList.remove('show'), 1500);
    }

    function selStyle(active) {
      return active
        ? 'border-color:#5AE4AA;box-shadow:0 0 12px rgba(90,228,170,.22);background:rgba(90,228,170,.12);color:#5AE4AA'
        : '';
    }

    function renderMainMenu() {
      let levels = '';
      for (let i = 1; i <= 20; i++) {
        const open = i <= maxUnlocked;
        const selected = i === selectedLevel;
        const style = open ? (selected ? selStyle(true) : '') : 'opacity:0.35;pointer-events:none';
        levels += `<button class="btn-secondary lvl-btn" data-lvl="${i}" style="padding:8px 0;min-width:42px;${style}">${open ? i : '🔒'}</button>`;
      }
      return `<h1>SPACE BLAST</h1>
        <div style="width:min(360px,100%);text-align:left;margin-bottom:14px;max-height:34vh;overflow-y:auto;padding:2px 4px">
          <div style="color:#9CA3AF;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">УРОВЕНЬ</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${levels}</div>
        </div>
        <div class="menu-actions">
          <button class="btn" id="start-btn">ИГРАТЬ · УР. ${selectedLevel}</button>
          <button class="btn-secondary" id="settings-btn">НАСТРОЙКИ</button>
        </div>`;
    }

    function openSettings() {
      gameRunning = false;
      isPaused = false;
      const row = (label, key, options) => {
        const btns = options.map(([val, name]) =>
          `<button class="btn-secondary set-opt" data-key="${key}" data-val="${val}" style="padding:10px 12px;font-size:13px;${selStyle(String(settings[key])===String(val))}">${name}</button>`
        ).join('');
        return `<div style="margin-bottom:12px"><div style="color:#64748b;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">${label}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${btns}</div></div>`;
      };
      overlay.innerHTML = `<h1>НАСТРОЙКИ</h1>
        <div style="width:min(320px,100%);text-align:left;max-height:58vh;overflow:auto;padding:0 4px">
          ${row('ЗВУК', 'sound', [[true,'Вкл'],[false,'Выкл']])}
          ${row('ТРЯСКА ЭКРАНА', 'shake', [['off','Выкл'],['low','Слабо'],['medium','Средне'],['high','Сильно']])}
          ${row('ЧАСТИЦЫ / ЭФФЕКТЫ', 'particles', [['low','Мало'],['medium','Норм'],['high','Много']])}
        </div>
        <div class="menu-actions" style="margin-top:14px">
          <button class="btn-secondary" id="settings-back">НАЗАД</button>
        </div>`;
      overlay.classList.remove('hidden');
      overlay.querySelectorAll('.set-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          let val = btn.dataset.val;
          if (key === 'sound') val = val === 'true';
          settings[key] = val;
          saveSettings();
          if (key === 'sound') {
            if (val) {
              unlockAudio();
            } else {
              stopMusic();
            }
          }
          openSettings();
        });
      });
      document.getElementById('settings-back').addEventListener('click', showMainMenu);
    }

    function bindMainMenu() {
      const start = document.getElementById('start-btn');
      if (start) start.addEventListener('click', () => startGame(selectedLevel));
      const settings = document.getElementById('settings-btn');
      if (settings) settings.addEventListener('click', openSettings);
      overlay.querySelectorAll('.lvl-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const lvl = Number(btn.dataset.lvl);
          if (lvl > maxUnlocked) return;
          selectedLevel = lvl;
          try { localStorage.setItem('spaceBlastLevel', String(selectedLevel)); } catch(e) {}
          showMainMenu();
        });
      });
    }

    function showMainMenu() {
      stopMusic();
      gameRunning = false; isPaused = false;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      clearPooled(bullets, bulletPool, MAX_BULLET_POOL); clearPooled(enemyBullets, enemyBulletPool, MAX_ENEMY_BULLET_POOL); clearPooled(enemies, enemyPool, MAX_ENEMY_POOL); clearParticles(); trails = []; powerUps = [];
      bombShockwaves = []; defenseMissiles.length = 0; defenseModeEnabled = false;
      defenseToggle.classList.remove('active'); defenseToggle.textContent = 'ПЕРЕХВАТ: ВЫКЛ'; defenseToggle.setAttribute('aria-pressed', 'false');
      boss = null; bossBarWrap.style.display = 'none'; bossLabel.style.display = 'none';
      comboEl.classList.remove('show'); powerToast.classList.remove('show');
      overlay.innerHTML = renderMainMenu();
      overlay.classList.remove('hidden');
      hint.classList.remove('hidden');
      bindMainMenu();
    }

    // Boot: menu only, never auto-start
    showMainMenu();
    if (!animationId) loop();

    // PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    draw();
  </script>
</body>
</html>
