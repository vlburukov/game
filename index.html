    function updateDirector(dt) {
      if (wave.phase !== 'fight') {
        difficulty = director.pressure;
        return;
      }
      // Stay near level design pressure; small boost from streaks
      const cfg = waveCfg();
      let target = cfg.pressure + Math.min(0.2, director.killStreak * 0.015);
      if (director.mode === 'assault') target += 0.12;
      if (director.mode === 'swarm') target += 0.08;
      if (director.mode === 'calm') target -= 0.12;
      target = Math.max(cfg.pressure - 0.15, Math.min(cfg.pressure + 0.3, target));
      director.pressure += (target - director.pressure) * Math.min(1, dt * 0.3);
      difficulty = director.pressure;

      director.eventTimer += dt;
      if (director.eventTimer >= director.nextEvent) triggerDirectorEvent();
      if ((director.mode === 'assault' || director.mode === 'swarm') && director.eventTimer > 6) {
        director.mode = 'flow';
      }
      if (director.mode === 'calm' && director.eventTimer > 5) director.mode = 'flow';
    }

    function createExplosion(x, y, color, count = 14, silent) {
      if (!silent) explosionSoundFromCount(count, x);
      let n = Math.max(4, Math.round(count * particleMul()));
      if (perf.lowFps) n = Math.min(n, 10);
      const base = color || [255, 160, 60];
      // Core flash ring (fewer of these)
      if (Math.random() < 0.7) {
        const fl = getParticle();
        fl.x = x; fl.y = y; fl.vx = 0; fl.vy = 0; fl.life = 1; fl.decay = 0.09;
        fl.color = [255, 255, 240]; fl.size = 8 + count * 0.25; fl.type = 'flash';
        particles.push(fl);
      }
      if (Math.random() < 0.6) {
        const rg = getParticle();
        rg.x = x; rg.y = y; rg.vx = 0; rg.vy = 0; rg.life = 1; rg.decay = 0.06;
        rg.color = base; rg.size = 14 + count * 0.4; rg.type = 'ring';
        particles.push(rg);
      }
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5.5 + 1.5;
        const isSpark = Math.random() < 0.4;
        const c = isSpark
          ? [255, 210 + Math.random() * 40, 140 + Math.random() * 50]
          : [
              Math.min(255, base[0] + (Math.random() * 30 - 8)),
              Math.min(255, base[1] + (Math.random() * 30 - 8)),
              Math.min(255, base[2] + (Math.random() * 20 - 4))
            ];
        const p = getParticle();
        p.x = x; p.y = y;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed - Math.random() * 1.2;
        p.life = 1;
        p.decay = isSpark ? 0.025 + Math.random() * 0.03 : 0.018 + Math.random() * 0.02;
        p.color = c;
        p.size = isSpark ? Math.random() * 2.5 + 0.8 : Math.random() * 4 + 1.5;
        p.type = isSpark ? 'spark' : 'dust';
        particles.push(p);
      }
      // Fewer embers
      const embers = Math.min(5, Math.round(2 * particleMul()));
      for (let i = 0; i < embers; i++) {
        const em = getParticle();
        em.x = x + (Math.random() - 0.5) * 6;
        em.y = y + (Math.random() - 0.5) * 6;
        em.vx = (Math.random() - 0.5) * 1;
        em.vy = -1.2 - Math.random() * 2;
        em.life = 1;
        em.decay = 0.015 + Math.random() * 0.012;
        em.color = [255, 140 + Math.random() * 70, 40];
        em.size = 1.8 + Math.random() * 2;
        em.type = 'ember';
        particles.push(em);
      }
      const cap = settings.particles === 'low' || perf.lowFps ? 40
        : settings.particles === 'high' ? 150 : 95;
      if (particles.length > cap) {
        const excess = particles.splice(0, particles.length - cap);
        for (const p of excess) releaseParticle(p);
      }
    }

    function metaCfg() {
      return META_CFG[Math.min(META_CFG.length, Math.max(1, selectedLevel)) - 1];
    }

    function waveCfg() {
      const meta = metaCfg();
      const rw = RUN_WAVE[Math.min(3, Math.max(1, wave.n)) - 1];
      const mul = rw.mul;
      return {
        n: wave.n,
        dur: 40,
        spawnMul: meta.spawnMul * mul,
        speedMul: meta.speedMul * (wave.n === 3 ? 1.05 : wave.n === 1 ? 0.90 : 0.96),
        pressure: meta.pressure * mul,
        label: rw.label
      };
    }

    function spawnLevelBoss(hard) {
      if (boss) return;
      const meta = selectedLevel;
      const bossHp = BASE.bossHp + (hard ? 22 : 12) + Math.floor(meta * 2.2);
      boss = { x: W/2 - 48, y: -100, w: 96, h: 64, hp: bossHp,
        maxHp: bossHp, phase: 0, fireClock: 0 };
      bossBarWrap.style.display = 'block';
      bossLabel.style.display = 'block';
      showToast(hard ? 'ФИНАЛЬНЫЙ БОСС' : 'БОСС');
    }

    function completeRun() {
      // Beat current meta-level → unlock next on menu
      let unlockedNext = false;
      if (selectedLevel >= maxUnlocked && maxUnlocked < 10) {
        maxUnlocked = selectedLevel + 1;
        unlockedNext = true;
        try { localStorage.setItem('spaceBlastMaxLevel', String(maxUnlocked)); } catch(e) {}
      }
      let mapJustOpened = false;
      if (selectedLevel >= 10) {
        maxUnlocked = 10;
        try { localStorage.setItem('spaceBlastMaxLevel', '10'); } catch(e) {}
        if (!unlockedMap2) {
          unlockedMap2 = true;
          mapJustOpened = true;
          try { localStorage.setItem('spaceBlastMap2', '1'); } catch(e) {}
        }
      }
      winRun(unlockedNext, mapJustOpened);
    }

    function nextWaveInRun() {
      if (wave.n >= 3) {
        completeRun();
        return;
      }
      wave.n += 1;
      wave.kills = 0;
      wave.timer = 0;
      wave.phaseStartedAt = performance.now();
      wave.phase = 'fight';
      enemies = [];
      enemyBullets = [];
      bullets = [];
      const cfg = waveCfg();
      director.pressure = cfg.pressure;
      director.mode = wave.n === 3 ? 'assault' : (wave.n === 2 ? 'swarm' : 'flow');
      director.eventTimer = 0;
      director.nextEvent = 20 + Math.random() * 12;
      showToast(wave.n === 3 ? 'ТРЕТЬЯ ВОЛНА' : cfg.label);
      // Boss on wave 3 starting from meta-level 3+
      if (wave.n === 3 && selectedLevel >= 3) {
        spawnLevelBoss(selectedLevel >= 8);
      }
    }

    function advanceWavePhase() {
      if (wave.phase === 'fight') {
        wave.phase = 'clearing';
        wave.phaseStartedAt = performance.now();
        director.mode = 'calm';
        showToast('ЗАЧИСТКА');
      } else if (wave.phase === 'clearing') {
        if (enemies.length === 0 && !boss) {
          wave.phase = 'breather';
          wave.phaseStartedAt = performance.now();
          director.mode = 'calm';
          showToast(`ВОЛНА ${wave.n} ✓`);
        }
      } else if (wave.phase === 'breather') {
        nextWaveInRun();
      }
    }

    function winRun(unlockedNext, mapJustOpened) {
      gameRunning = false;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        try { localStorage.setItem('spaceBlastBest', String(bestScore)); } catch(e) {}
      }

      const wpnName = 'Луч';
      let extra = '';
      if (unlockedNext) extra += `<br>Открыт уровень ${maxUnlocked}`;
      if (mapJustOpened) extra += '<br>Открыта карта: Aurora Drift';
      const shareText = `Space Blast: ур.${selectedLevel} пройден! ${score} очков · ${wpnName}`;
      overlay.innerHTML = `
        <h1>ПОБЕДА</h1>
        <div id="final-score">${score}</div>
        <div id="final-label">3 волны · уровень ${selectedLevel}</div>
        <p class="subtitle" style="margin-bottom:18px">Время ${formatTime(gameTime)} · ${wpnName}${extra}</p>
        <button class="btn" id="restart-btn">ЕЩЁ РАЗ</button>
        <button class="btn-secondary" id="share-btn" style="margin-top:10px">ПОДЕЛИТЬСЯ</button>
        <button class="btn-secondary" id="menu-btn" style="margin-top:10px">В МЕНЮ</button>
      `;
      overlay.classList.remove('hidden');
      document.getElementById('restart-btn').addEventListener('click', () => startGame(selectedLevel));
      document.getElementById('menu-btn').addEventListener('click', showMainMenu);
      const shareBtn = document.getElementById('share-btn');
      if (shareBtn) shareBtn.addEventListener('click', async () => {
        try {
          if (navigator.share) await navigator.share({ title: 'Space Blast', text: shareText, url: location.href });
          else if (navigator.clipboard) { await navigator.clipboard.writeText(shareText + ' ' + location.href); showToast('Скопировано'); }
        } catch (e) {}
      });
    }

    function createHitSpark(x, y) {
      const n = Math.max(1, Math.round(3 * particleMul()));
      for (let i = 0; i < n; i++) {
        const p = getParticle();
        p.x = x; p.y = y;
        p.vx = (Math.random() - 0.5) * 5.5;
        p.vy = (Math.random() - 0.5) * 5.5;
        p.life = 0.65;
        p.decay = 0.055;
        p.color = [0, 230, 255];
        p.size = Math.random() * 2 + 0.8;
        p.type = 'spark';
        particles.push(p);
      }
      const sparkCap = perf.lowFps ? 55 : 150;
      if (particles.length > sparkCap) {
        const excess = particles.splice(0, particles.length - sparkCap);
        for (const p of excess) releaseParticle(p);
      }
    }

    function updateCombo() {
      combo++;
      comboTimer = 90;
      if (combo >= 2) {
        comboEl.textContent = `x${combo}`;
        comboEl.classList.add('show');
      }
      // Kill-cam flash on streak 3, 5, 8...
      if (combo === 3 || combo === 5 || combo >= 8 && combo % 3 === 0) {
        killFlash = combo >= 8 ? 0.55 : 0.4;
        slowMo = combo >= 5 ? 10 : 6;
        addShake(combo >= 5 ? 7 : 4);

      }
    }

    function playLock() {
      const ctx = ensureAudio();
      if (!ctx || !masterGain) return;
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(720, t0);
      o.frequency.exponentialRampToValueAtTime(1400, t0 + 0.06);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.08, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.1);
    }

    function formatTime(seconds) {
      const total = Math.floor(seconds);
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }

    function loseLife(vib, shakeAmt) {
      lives--;
      updateLives();
      combo = 0;
      comboEl.classList.remove('show');
      director.killStreak = 0;
      director.pressure = Math.max(0.8, director.pressure - 0.18);
      director.mode = 'calm';
      director.eventTimer = 0;
      director.nextEvent = 14 + Math.random() * 8;

      addShake(shakeAmt);
      if (lives <= 0) {
        gameOver();
        return true;
      }
      return false;
    }

    let bombOriginX = 0;
    let bombOriginY = 0;
    let bombShockwaves = [];

    function detonateBomb(ox, oy) {
      if (!gameRunning || isPaused) return;
      const bx = ox != null ? ox : W / 2;
      const by = oy != null ? oy : H * 0.45;
      bombOriginX = bx;
      bombOriginY = by;

      const bossWasActive = !!boss;
      let cleared = enemies.length;
      for (const e of enemies) {
        score += e.type === 'tank' ? 25 : 10;
        createExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color, 14, true);
      }
      enemies = [];

      if (boss) {
        createExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, [255, 80, 40], 80, true);
        boss = null;
        score += 500;
        bossBarWrap.style.display = 'none';
        bossLabel.style.display = 'none';
      }
      scoreEl.textContent = score;

      // Elegant nuclear explosion — full-screen clear
      bombFlash = 1.4;
      bombRing = 1;
      bombShockwaves = [
        { r: 0, max: Math.max(W, H) * 0.7, life: 1, width: 4, color: '255,255,240' },
        { r: 0, max: Math.max(W, H) * 1.0, life: 1, width: 3, color: '90,228,170' },
        { r: 0, max: Math.max(W, H) * 1.35, life: 1, width: 2.5, color: '180,140,255' },
        { r: 0, max: Math.max(W, H) * 1.7, life: 1, width: 2, color: '255,160,80' }
      ];
      addShake(16);
      playExplosion('nuclear', (bx / Math.max(1, W)) * 2 - 1);

      // Soft center bloom + sparse elegant sparks
      createExplosion(bx, by, [255, 255, 220], 60, true);
      createExplosion(bx, by, [90, 228, 170], 40, true);

      for (let i = 0; i < 12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 5;
        const p = getParticle();
        p.x = bx; p.y = by;
        p.vx = Math.cos(ang) * spd;
        p.vy = Math.sin(ang) * spd;
        p.life = 1;
        p.decay = 0.012 + Math.random() * 0.012;
        p.color = Math.random() < 0.5 ? [255, 255, 200] : [90, 228, 170];
        p.size = 2 + Math.random() * 3;
        p.type = 'spark';
        particles.push(p);
      }

      showToast(bossWasActive ? '☢ ЯДЕРНЫЙ ВЗРЫВ · БОСС УНИЧТОЖЕН!' : `☢ ЯДЕРНЫЙ ВЗРЫВ · ЦЕЛЕЙ: ${cleared}`);

    }

    function spawnBombPickup() {
      const size = 40;
      powerUps.push({
        type: 'bomb',
        x: 24 + Math.random() * (W - size - 48),
        y: -size - 10,
        w: size,
        h: size,
        speed: 1.5 + Math.random() * 0.5,
        bob: Math.random() * Math.PI * 2
      });
    }

    function update() {
      if (!gameRunning || isPaused) return;
      time++;
      gameTime += 1 / 60; // approx seconds
      if (bombFlash > 0) bombFlash = Math.max(0, bombFlash - 0.016);
      if (bombRing > 0) bombRing = Math.max(0, bombRing - 0.018);
      for (let i = bombShockwaves.length - 1; i >= 0; i--) {
        const sw = bombShockwaves[i];
        sw.r += (sw.max - sw.r) * 0.08 + 6;
        sw.life -= 0.016;
        if (sw.life <= 0 || sw.r >= sw.max) bombShockwaves.splice(i, 1);
      }
      survivalTimeEl.textContent = formatTime(gameTime);

      updateDirector(1 / 60);

      // Player movement
      if (selectedWeapon === 'rockets') {
        // Fixed center-bottom — only tap targets
        player.targetX = W / 2 - player.w / 2;
        player.targetY = H - 90;
        player.x += (player.targetX - player.x) * 0.2;
        player.y += (player.targetY - player.y) * 0.2;
        moveSpeed = 0;
      } else {
        if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD']) player.targetX += player.speed;
        if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= player.speed;
        if (keys['ArrowDown'] || keys['KeyS']) player.targetY += player.speed;

        const halfY = H * 0.5;
        player.targetX = Math.max(4, Math.min(W - player.w - 4, player.targetX));
        player.targetY = Math.max(halfY, Math.min(H - player.h - 8, player.targetY));
        player._lastX = player.x;
        player._lastY = player.y;
        const prevX = player.x;
        const prevY = player.y;
        const lerp = sensitivityLerp();
        player.x += (player.targetX - player.x) * lerp;
        player.y += (player.targetY - player.y) * lerp;
        moveSpeed = Math.min(1.6, (Math.abs(player.x - prevX) + Math.abs(player.y - prevY)) / 5.5);
      }

      // Auto fire (slightly faster at higher difficulty)
      shoot();

      // Trail — reduced frequency and simpler
      if (time % 3 === 0 && trails.length < 40) {
        trails.push({
          x: player.x + player.w / 2,
          y: player.y + player.h,
          life: 0.85,
          size: 5 + Math.random() * 3
        });
      }
      if (trails.length > 40) trails.shift();

      // Bullets — beam / knives / homing rockets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.type === 'rocket') {
          // Light guidance toward nearest enemy
          if (b.guidance > 0 && enemies.length > 0) {
            let nearest = enemies[0];
            let best = 1e9;
            const bx = b.x + b.w / 2, by = b.y + b.h / 2;
            for (let k = 0; k < Math.min(enemies.length, 12); k++) {
              const e = enemies[k];
              const dx = e.x + e.w / 2 - bx;
              const dy = e.y + e.h / 2 - by;
              const d2 = dx * dx + dy * dy;
              if (d2 < best) { best = d2; nearest = e; }
            }
            const want = Math.atan2((nearest.y + nearest.h/2) - by, (nearest.x + nearest.w/2) - bx);
            let cur = Math.atan2(b.vy, b.vx || 0.001);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const turn = Math.max(-0.08, Math.min(0.08, diff)) * b.guidance;
            cur += turn;
            const spd = b.speed || 8;
            b.vx = Math.cos(cur) * spd;
            b.vy = Math.sin(cur) * spd;
          }
          b.life = (b.life || 0) + 1;
          b.x += b.vx;
          b.y += b.vy;
          b.rot = Math.atan2(b.vy, b.vx || 0.001) + Math.PI / 2;
          b.trailTimer = (b.trailTimer || 0) + 1;
          const trailEvery = settings.particles === 'low' || perf.lowFps ? 5 : 3;
          if (b.trailTimer % trailEvery === 0) {
            const tp = getParticle();
            tp.x = b.x + b.w / 2 + (Math.random() - 0.5) * 3;
            tp.y = b.y + b.h * 0.7;
            tp.vx = -b.vx * 0.1 + (Math.random() - 0.5) * 0.8;
            tp.vy = -b.vy * 0.07 + 0.8;
            tp.life = 0.65; tp.decay = 0.05;
            tp.color = Math.random() < 0.35 ? [90, 228, 170] : [255, 140 + Math.random() * 60, 50];
            tp.size = 2.5 + Math.random() * 2.5;
            tp.type = 'dust';
            particles.push(tp);
          }
        } else if (b.type === 'knife') {
          b.x += b.vx;
          b.y += b.vy;
          b.rot += b.spin || 0.15;
        } else {
          b.x += b.vx || 0;
          b.y += b.vy != null ? b.vy : -b.speed;
        }
        if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) bullets.splice(i, 1);
      }

      // Enemy projectiles disabled (no damage-from-bullets)
      enemyBullets.length = 0;

      // Level phases: fight → clearing → breather → next
      const cfg = waveCfg();
      if (!wave.phaseStartedAt) wave.phaseStartedAt = performance.now();
      const phaseSec = (performance.now() - wave.phaseStartedAt) / 1000;
      wave.timer = phaseSec;
      if (wave.phase === 'fight' && phaseSec >= cfg.dur) {
        advanceWavePhase();
      } else if (wave.phase === 'clearing') {
        // Safety: after 12s remove leftover fodder so level can't soft-lock
        if (phaseSec > 12 && enemies.length) {
          for (let i = enemies.length - 1; i >= 0; i--) {
            createExplosion(enemies[i].x + enemies[i].w/2, enemies[i].y + enemies[i].h/2, enemies[i].color, 8, true);
          }
          enemies = [];
        }
        if (enemies.length === 0 && !boss) advanceWavePhase();
      } else if (wave.phase === 'breather' && phaseSec >= 2.2) {
        advanceWavePhase();
      }

      enemySpawnTimer++;
      const canSpawn = wave.phase === 'fight';
      if (canSpawn) {
        const dens = 1.35 * cfg.spawnMul;
        const spawnRate = Math.max(10, ((BASE.spawnBase - 24) / dens - difficulty * 6) / ENEMY_COUNT_SCALE);
        if (enemySpawnTimer > spawnRate) {
          spawnEnemy();
          const extra = (autoRocket ? 0.22 : (0.08 + cfg.spawnMul * 0.10)) * ENEMY_COUNT_SCALE;
          if (Math.random() < extra) spawnEnemy();
          if (autoRocket && Math.random() < 0.18 * ENEMY_COUNT_SCALE) spawnEnemy();
          if (wave.n >= 2 && Math.random() < (autoRocket ? 0.22 : 0.12) * ENEMY_COUNT_SCALE) spawnEnemy();
          if (wave.n >= 3 && Math.random() < (autoRocket ? 0.18 : 0.10) * ENEMY_COUNT_SCALE) spawnEnemy();
          enemySpawnTimer = 0;
        }
      } else {
        enemySpawnTimer = 0;
      }

      // Nuclear bomb pickups — ~2 per minute (random interval ~20–40s)
      bombSpawnTimer++;
      if (bombSpawnTimer >= nextBombAt) {
        spawnBombPickup();
        bombSpawnTimer = 0;
        nextBombAt = 60 * (15 + Math.random() * 13); // 15–28 seconds, ~2.5/min
      }

      // Power-ups (falling bombs) — collect by touch OR shoot to detonate
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.speed;
        p.bob += 0.08;
        p.x += Math.sin(p.bob) * 0.4;

        let triggered = false;
        const px = p.x + p.w / 2;
        const py = p.y + p.h / 2;

        // Shot by player bullets → nuclear detonation
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < p.x + p.w && b.x + b.w > p.x &&
              b.y < p.y + p.h && b.y + b.h > p.y) {
            bullets.splice(j, 1);
            triggered = true;
            break;
          }
        }

        // Collect by touching ship
        if (!triggered &&
            p.x < player.x + player.w && p.x + p.w > player.x &&
            p.y < player.y + player.h && p.y + p.h > player.y) {
          triggered = true;
        }

        if (triggered) {
          powerUps.splice(i, 1);
          if (p.type === 'bomb') detonateBomb(px, py);
          continue;
        }

        if (p.y > H + 40) powerUps.splice(i, 1);
      }

      // Boss (levels 5 & 10)
      if (boss) {
        boss.phase = (boss.phase || 0) + 0.035;
        boss.fireClock = (boss.fireClock || 0) + 1;
        boss.y = Math.min(82, boss.y + 1.25);
        boss.x = Math.max(8, Math.min(W - boss.w - 8,
          W/2 - boss.w/2 + Math.sin(boss.phase) * Math.max(0, W*0.32)));
        // Minions only during fight — not during clearing (prevents soft-lock)
        if (wave.phase === 'fight' && boss.fireClock > 125) {
          boss.fireClock = 0;
          const ms = 26;
          enemies.push({
            x: boss.x + boss.w/2 - ms/2, y: boss.y + boss.h,
            w: ms, h: ms, speed: 2.2, hp: 1, maxHp: 1,
            type: 'fast', color: [255, 40, 130],
            rot: 0, rotSpeed: 0.06, ai: 'chase',
            phase: Math.random() * Math.PI * 2, vx: 0,
            aimLean: 0.5, fireCd: 99, dive: false
          });
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < boss.x + boss.w && b.x + b.w > boss.x &&
              b.y < boss.y + boss.h && b.y + b.h > boss.y) {
            boss.hp -= (b.dmg || 1);
            bullets.splice(j, 1);
            createHitSpark(b.x, b.y);
            bossBar.style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
            if (boss.hp <= 0) {
              createExplosion(boss.x + boss.w/2, boss.y + boss.h/2, [255,45,150], 60, true);
              playExplosion('boss', ((boss.x + boss.w/2) / Math.max(1, W)) * 2 - 1);
              score += 500;
              scoreEl.textContent = score;
              boss = null;
              bossBarWrap.style.display = 'none';
              bossLabel.style.display = 'none';
              showToast('БОСС УНИЧТОЖЕН');
              killFlash = 0.5;
              slowMo = 12; addShake(12);
              break;
            }
          }
        }
      }
      if (powerModeTimer > 0) powerModeTimer--;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.phase = (e.phase || 0) + 0.04 + e.speed * 0.01;
        // Orient ballistic missiles toward player in rocket mode
      if (selectedWeapon === 'rockets') {
        const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
        const dy = (player.y + player.h / 2) - (e.y + e.h / 2);
        e.rot = Math.atan2(dy, dx) + Math.PI / 2;
        // incoming whoosh disabled
      } else {
        e.rot += e.rotSpeed;
      }

        // Simple fall — no floating
        e.y += e.speed * 2.8;
        if (wave.phase === 'clearing') e.y += 1.2;
        e.rotSpeed = e.rotSpeed || 0;
        e.x = Math.max(4, Math.min(W - e.w - 4, e.x));

        // Bullet collision — only hit fully visible enemies
        if (e.y >= 0) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x &&
              b.y < e.y + e.h && b.y + b.h > e.y) {
            e.hp -= (b.dmg || 1);
            createHitSpark(b.x + b.w / 2, b.y);
            if (b.type === 'beam') {
              createExplosion(b.x + b.w / 2, b.y, [0, 230, 255], 8, true);
              createHitSpark(e.x + e.w / 2, e.y + e.h / 2);
            }
            bullets.splice(j, 1);

            if (e.hp <= 0) {
              const killColor = b.type === 'beam' ? [80, 240, 255] : e.color;
              const fat = b.type === 'rocket';
              createExplosion(e.x + e.w / 2, e.y + e.h / 2, killColor, fat ? 34 : (e.type === 'tank' ? 22 : 14));
              if (fat) {
                createExplosion(e.x + e.w / 2, e.y + e.h / 2, [90, 228, 170], 16, true);
                const pan = W ? (((e.x + e.w / 2) / W) * 2 - 1) : 0;
                playKillRocket(pan);
              }
              if (b.type === 'beam') createExplosion(e.x + e.w / 2, e.y + e.h / 2, [255, 255, 255], 8, true);
              enemies.splice(i, 1);
              const points = e.type === 'tank' ? 30 : (e.type === 'fast' ? 15 : 10);
              score += points * Math.min(combo + 1, 5);
              scoreEl.textContent = score;
              director.killStreak = Math.min(20, director.killStreak + 1);
              wave.kills++;
              updateCombo();

              addShake(fat ? 9 : (e.type === 'tank' ? 7 : 3));
            } else {

              addShake(2);
            }
            break;
          }
        }
        }

        // The enemy may have been removed after a bullet hit; do not process it again.
        if (e.hp <= 0) continue;

        // Player collision — smaller hurtbox for comfort
        if (e.x < player.x + player.w - 14 && e.x + e.w > player.x + 14 &&
            e.y < player.y + player.h - 10 && e.y + e.h > player.y + 10) {
          createExplosion(e.x + e.w / 2, e.y + e.h / 2, [255, 60, 80], 20);
          enemies.splice(i, 1);
          if (loseLife([30, 40, 50], 12)) return;
        }

        // Off screen — during clearing just despawn (no life penalty)
        if (e.y > H + 50 || e.x < -80 || e.x > W + 80) {
          enemies.splice(i, 1);
          if (wave.phase === 'fight' && e.y > H + 50) {
            if (loseLife(25, 6)) return;
          }
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'ring' || p.type === 'flash') {
          p.size += p.type === 'ring' ? 2.4 : 1.0;
        } else {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          if (p.type === 'ember') p.vy -= 0.035;
        }
        p.life -= p.decay;
        if (p.life <= 0) {
          releaseParticle(particles.splice(i, 1)[0]);
        }
      }

      // Trails
      for (let i = trails.length - 1; i >= 0; i--) {
        trails[i].life -= 0.06;
        trails[i].y += 1.5;
        if (trails[i].life <= 0) trails.splice(i, 1);
      }

      // Combo timer
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
          combo = 0;
          comboEl.classList.remove('show');
        }
      }

      // Shake decay
      if (shake > 0) shake *= 0.85;
      if (shake < 0.3) shake = 0;

      // Stars + map props
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) {
          s.y = -5;
          s.x = Math.random() * W;
        }
      }
      for (const c of nebulaClouds) {
        c.y += c.speed;
        if (c.y - c.r > H) {
          c.y = -c.r;
          c.x = Math.random() * W;
        }
      }
      for (const a of asteroids) {
        a.y += a.speed;
        a.rot += a.rotSpeed;
        if (a.y - a.r > H) {
          a.y = -a.r;
          a.x = Math.random() * W;
        }
      }
    }

    function drawShip(x, y, w, h) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      // Strong engine glow
      const glow = 0.65 + Math.sin(time * 0.28) * 0.35;
      const grad = ctx.createRadialGradient(0, h / 2 + 8, 0, 0, h / 2 + 14, 28);
      grad.addColorStop(0, `rgba(180, 100, 255, ${glow})`);
      grad.addColorStop(0.4, `rgba(0, 220, 255, ${glow * 0.5})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, h / 2 + 12, 28, 0, Math.PI * 2);
      ctx.fill();

      // Soft body glow
      const bodyG = ctx.createRadialGradient(0, 0, 4, 0, 0, w * 0.55);
      bodyG.addColorStop(0, 'rgba(0, 220, 255, 0.25)');
      bodyG.addColorStop(1, 'transparent');
      ctx.fillStyle = bodyG;
      ctx.beginPath();
      ctx.arc(0, 0, w * 0.55, 0, Math.PI * 2);
      ctx.fill();

      // Main body
      ctx.fillStyle = '#f0f9ff';
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 - 4);
      ctx.lineTo(w / 2 - 1, h / 2 - 8);
      ctx.lineTo(w / 2 - 10, h / 2 + 2);
      ctx.lineTo(0, h / 2 - 12);
      ctx.lineTo(-(w / 2 - 10), h / 2 + 2);
      ctx.lineTo(-(w / 2 - 1), h / 2 - 8);
      ctx.closePath();
      ctx.fill();

      // Edge highlight
      ctx.strokeStyle = 'rgba(0, 220, 255, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Cockpit
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.ellipse(0, -h / 6, 9, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(-2, -h / 6 - 2, 3.5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wings accent
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.moveTo(-w / 2 + 6, h / 2 - 10);
      ctx.lineTo(-w / 2 - 6, h / 2 + 4);
      ctx.lineTo(-w / 2 + 14, h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w / 2 - 6, h / 2 - 10);
      ctx.lineTo(w / 2 + 6, h / 2 + 4);
      ctx.lineTo(w / 2 - 14, h / 2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x + e.w / 2, e.y + e.h / 2);
      ctx.rotate(e.rot || 0);
      const [r, g, b] = e.color;
      const pulse = 0.85 + Math.sin((e.phase || 0) * 3) * 0.15;

      // Rocket mode: ballistic missiles
      if (selectedWeapon === 'rockets') {
        // Missile body
        ctx.fillStyle = '#d4d4d8';
        ctx.beginPath();
        ctx.moveTo(0, -e.h * 0.55);
        ctx.lineTo(e.w * 0.18, e.h * 0.15);
        ctx.lineTo(e.w * 0.12, e.h * 0.45);
        ctx.lineTo(-e.w * 0.12, e.h * 0.45);
        ctx.lineTo(-e.w * 0.18, e.h * 0.15);
        ctx.closePath();
        ctx.fill();
        // Nose cone
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.moveTo(0, -e.h * 0.55);
        ctx.lineTo(e.w * 0.1, -e.h * 0.15);
        ctx.lineTo(-e.w * 0.1, -e.h * 0.15);
        ctx.closePath();
        ctx.fill();
        // Fins
        ctx.fillStyle = '#71717a';
        ctx.beginPath();
        ctx.moveTo(-e.w * 0.12, e.h * 0.25);
        ctx.lineTo(-e.w * 0.32, e.h * 0.5);
        ctx.lineTo(-e.w * 0.08, e.h * 0.42);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(e.w * 0.12, e.h * 0.25);
        ctx.lineTo(e.w * 0.32, e.h * 0.5);
        ctx.lineTo(e.w * 0.08, e.h * 0.42);
        ctx.closePath();
        ctx.fill();
        // Exhaust flame
        ctx.fillStyle = `rgba(255,${140 + Math.random()*60},40,0.85)`;
        ctx.beginPath();
        ctx.moveTo(-e.w * 0.08, e.h * 0.45);
        ctx.lineTo(0, e.h * 0.75 + Math.random() * 6);
        ctx.lineTo(e.w * 0.08, e.h * 0.45);
        ctx.fill();
        ctx.restore();
        return;
      }

      const ai = e.ai || 'weave';

      // Soft aura — simplified (no gradient per enemy)
      ctx.globalAlpha = 0.28 * pulse;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.arc(0, 0, e.w * 0.68, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Shape by type / AI
      ctx.beginPath();
      if (e.type === 'tank') {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
          const px = Math.cos(a) * e.w * 0.46;
          const py = Math.sin(a) * e.h * 0.46;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else if (e.type === 'fast' || ai === 'kamikaze') {
        // Arrowhead
        ctx.moveTo(0, -e.h * 0.52);
        ctx.lineTo(e.w * 0.42, e.h * 0.18);
        ctx.lineTo(e.w * 0.12, e.h * 0.1);
        ctx.lineTo(e.w * 0.18, e.h * 0.48);
        ctx.lineTo(-e.w * 0.18, e.h * 0.48);
        ctx.lineTo(-e.w * 0.12, e.h * 0.1);
        ctx.lineTo(-e.w * 0.42, e.h * 0.18);
        ctx.closePath();
      } else if (ai === 'flank') {
        // Crescent / blade
        ctx.moveTo(0, -e.h * 0.45);
        ctx.quadraticCurveTo(e.w * 0.55, 0, 0, e.h * 0.45);
        ctx.quadraticCurveTo(e.w * 0.18, 0, 0, -e.h * 0.45);
        ctx.closePath();
      } else if (ai === 'shooter') {
        // Ring-core disc
        ctx.arc(0, 0, e.w * 0.42, 0, Math.PI * 2);
      } else {
        // Crystal shard
        ctx.moveTo(0, -e.h * 0.5);
        ctx.lineTo(e.w * 0.38, -e.h * 0.08);
        ctx.lineTo(e.w * 0.22, e.h * 0.48);
        ctx.lineTo(-e.w * 0.22, e.h * 0.48);
        ctx.lineTo(-e.w * 0.38, -e.h * 0.08);
        ctx.closePath();
      }

      // Body — solid color, no gradient
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * pulse})`;
      ctx.lineWidth = 1.1;
      ctx.stroke();

      // Core gem — simple
      ctx.fillStyle = `rgba(255,255,255,${0.75 + pulse * 0.15})`;
      ctx.beginPath();
      ctx.arc(0, -e.h * 0.05, e.w * 0.13, 0, Math.PI * 2);
      ctx.fill();

      // Accent dots / "eyes"
      if (e.type !== 'tank') {
        ctx.fillStyle = 'rgba(10,12,20,0.85)';
        ctx.beginPath();
        ctx.arc(-e.w * 0.14, -e.h * 0.12, e.w * 0.07, 0, Math.PI * 2);
        ctx.arc(e.w * 0.14, -e.h * 0.12, e.w * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.5 + pulse * 0.3})`;
        ctx.beginPath();
        ctx.arc(-e.w * 0.12, -e.h * 0.14, e.w * 0.025, 0, Math.PI * 2);
        ctx.arc(e.w * 0.16, -e.h * 0.14, e.w * 0.025, 0, Math.PI * 2);
        ctx.fill();
      }

      if (e.type === 'tank' && e.hp < e.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-e.w * 0.3, e.h * 0.52, e.w * 0.6, 5);
        ctx.fillStyle = '#9CA3AF';
        ctx.fillRect(-e.w * 0.3, e.h * 0.52, e.w * 0.6 * (e.hp / e.maxHp), 5);
      }
      ctx.restore();
    }

    function draw() {
      // Background — Deep Void
      ctx.fillStyle = currentMap.bg;
      ctx.fillRect(0, 0, W, H);

      // Nebula clouds — draw every other frame or simplify
      if (time % 2 === 0) {
        for (const c of nebulaClouds) {
          ctx.globalAlpha = c.alpha * 0.8;
          ctx.fillStyle = `hsla(${c.hue}, 70%, 40%, 1)`;
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // Vignette
      const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
      vig.addColorStop(0, 'transparent');
      vig.addColorStop(1, currentMap.vignette);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);

      // Screen shake
      ctx.save();
      if (shake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * shake,
          (Math.random() - 0.5) * shake
        );
      }

      // Stars
      const [sr, sg, sb] = currentMap.starColor;
      for (const s of stars) {
        ctx.fillStyle = `rgba(${sr},${sg},${sb},${s.brightness})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Asteroids (subtle gray)
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.fillStyle = 'rgba(80, 90, 95, 0.45)';
        ctx.beginPath();
        ctx.moveTo(a.r, 0);
        for (let i = 1; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          const rr = a.r * (0.7 + (i % 2) * 0.3);
          ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Engine trails — simpler fill, no gradient
      for (const t of trails) {
        ctx.globalAlpha = t.life * 0.45;
        ctx.fillStyle = 'rgba(120, 80, 200, 0.7)';
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Projectiles
      for (const b of bullets) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        if (b.type === 'rocket') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(b.rot || 0);
          // Kinzhal-style missile
          // Body
          ctx.fillStyle = '#e4e4e7';
          ctx.beginPath();
          ctx.moveTo(0, -16);
          ctx.lineTo(5, 6);
          ctx.lineTo(3, 10);
          ctx.lineTo(-3, 10);
          ctx.lineTo(-5, 6);
          ctx.closePath();
          ctx.fill();
          // Dark band
          ctx.fillStyle = '#3f3f46';
          ctx.fillRect(-4, -2, 8, 5);
          // Nose
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(0, -16);
          ctx.lineTo(3.5, -6);
          ctx.lineTo(-3.5, -6);
          ctx.closePath();
          ctx.fill();
          // Fins
          ctx.fillStyle = '#52525b';
          ctx.beginPath();
          ctx.moveTo(-3, 6);
          ctx.lineTo(-9, 14);
          ctx.lineTo(-2, 10);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(3, 6);
          ctx.lineTo(9, 14);
          ctx.lineTo(2, 10);
          ctx.closePath();
          ctx.fill();
          // Exhaust
          const fl = 18 + Math.random() * 8;
          ctx.fillStyle = 'rgba(255,140,40,0.9)';
          ctx.beginPath();
          ctx.moveTo(-3, 10);
          ctx.lineTo(0, fl);
          ctx.lineTo(3, 10);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,230,120,0.95)';
          ctx.beginPath();
          ctx.moveTo(-1.5, 10);
          ctx.lineTo(0, 10 + fl * 0.5);
          ctx.lineTo(1.5, 10);
          ctx.fill();
          ctx.restore();
        } else if (b.type === 'knife') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(b.rot || 0);
          ctx.fillStyle = '#e2e8f0';
          ctx.beginPath();
          ctx.moveTo(0, -11);
          ctx.lineTo(4, 6);
          ctx.lineTo(0, 3);
          ctx.lineTo(-4, 6);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-1.5, 3, 3, 8);
          ctx.fillStyle = '#f472b6';
          ctx.fillRect(-2, 9, 4, 2);
          ctx.restore();
        } else {
          // Beautiful neon beam
          b.pulse = (b.pulse || 0) + 0.4;
          const pulse = 0.8 + Math.sin(b.pulse) * 0.2;
          // Outer bloom
          const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
          bloom.addColorStop(0, `rgba(0,255,255,${0.7 * pulse})`);
          bloom.addColorStop(0.4, `rgba(0,180,255,${0.35 * pulse})`);
          bloom.addColorStop(0.7, `rgba(100,0,255,${0.15 * pulse})`);
          bloom.addColorStop(1, 'transparent');
          ctx.fillStyle = bloom;
          ctx.beginPath();
          ctx.arc(cx, cy, 22, 0, Math.PI * 2);
          ctx.fill();
          // Vertical glow streak
          const streak = ctx.createLinearGradient(cx, b.y - 10, cx, b.y + b.h + 12);
          streak.addColorStop(0, 'rgba(0,255,255,0)');
          streak.addColorStop(0.15, `rgba(0,255,255,${0.5 * pulse})`);
          streak.addColorStop(0.4, `rgba(255,255,255,${0.8 * pulse})`);
          streak.addColorStop(0.6, `rgba(0,220,255,${0.6 * pulse})`);
          streak.addColorStop(1, 'rgba(0,100,255,0)');
          ctx.fillStyle = streak;
          ctx.fillRect(cx - 7, b.y - 12, 14, b.h + 24);
          // Core
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(b.x + 3, b.y, Math.max(2, b.w - 6), b.h);
          ctx.fillStyle = '#00ffff';
          ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
          ctx.fillStyle = '#e0ffff';
          ctx.fillRect(b.x + 4, b.y + 3, Math.max(1, b.w - 8), Math.max(1, b.h - 6));
          // Bright tip
          ctx.fillStyle = `rgba(255,255,255,${pulse})`;
          ctx.beginPath();
          ctx.arc(cx, b.y + 1, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(0,255,255,${0.6 * pulse})`;
          ctx.beginPath();
          ctx.arc(cx, b.y + 1, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Enemy bullets
      for (const eb of enemyBullets) {
        ctx.fillStyle = 'rgba(255,80,80,0.35)';
        ctx.beginPath();
        ctx.arc(eb.x + eb.w / 2, eb.y + eb.h / 2, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fda4af';
        ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(eb.x + 1, eb.y + 2, Math.max(1, eb.w - 2), Math.max(1, eb.h - 4));
      }

      // Enemies
      for (const e of enemies) {
        drawEnemy(e);
      }

      // Neon boss
      if (boss) {
        ctx.save();
        ctx.shadowBlur = 24; ctx.shadowColor = '#ff2d75';
        ctx.fillStyle = '#a21caf';
        ctx.beginPath();
        ctx.moveTo(boss.x + boss.w*.5, boss.y + boss.h);
        ctx.lineTo(boss.x, boss.y + boss.h*.2);
        ctx.lineTo(boss.x + boss.w*.12, boss.y);
        ctx.lineTo(boss.x + boss.w*.88, boss.y);
        ctx.lineTo(boss.x + boss.w, boss.y + boss.h*.2);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#ff6aa9'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillRect(boss.x+22,boss.y+20,12,6);
        ctx.fillRect(boss.x+boss.w-34,boss.y+20,12,6);
        ctx.fillStyle = '#ff2d75'; ctx.fillRect(boss.x+boss.w*.35,boss.y+36,boss.w*.3,5);
        ctx.restore();
      }

      // Falling nuclear bomb pickups (large, easy to catch)
      for (const p of powerUps) {
        if (p.type !== 'bomb') continue;
        const cx = p.x + p.w / 2;
        const cy = p.y + p.h / 2;
        const pulse = 0.7 + Math.sin(time * 0.15 + p.bob) * 0.3;
        ctx.save();
        const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 32);
        g.addColorStop(0, `rgba(255, 180, 40, ${0.6 * pulse})`);
        g.addColorStop(0.5, `rgba(255, 60, 30, ${0.28 * pulse})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(cx, cy + 2, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff6b2d';
        ctx.beginPath();
        ctx.arc(cx, cy + 2, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffe566';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☢', cx, cy + 2);
        ctx.fillStyle = '#c2410c';
        ctx.fillRect(cx - 18, cy + 12, 8, 10);
        ctx.fillRect(cx + 10, cy + 12, 8, 10);
        ctx.restore();
      }

      drawShip(player.x, player.y, player.w, player.h);

      // Rocket lock-on rings
      for (const ring of lockRings) {
        ctx.strokeStyle = `rgba(90,228,170,${ring.life * 0.85})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${ring.life * 0.35})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.r * 0.55, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Particles — optimized drawing (fewer gradients)
      for (const p of particles) {
        const a = Math.max(0, p.life);
        const px = p.x | 0, py = p.y | 0;
        if (p.type === 'flash') {
          ctx.globalAlpha = a * 0.75;
          ctx.fillStyle = `rgba(255,255,240,${a})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 0.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (p.type === 'ring') {
          ctx.strokeStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a * 0.5})`;
          ctx.lineWidth = 1.5 + (1 - a) * 4;
          ctx.beginPath();
          ctx.arc(px, py, p.size * (1.05 - a * 0.4), 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.type === 'spark') {
          ctx.strokeStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a})`;
          ctx.lineWidth = Math.max(1, p.size * 0.4);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px - p.vx * 1.6, py - p.vy * 1.6);
          ctx.stroke();
          ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 0.3 * a, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'ember') {
          ctx.globalAlpha = a * 0.85;
          ctx.fillStyle = `rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 1.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a * 0.8})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size * (0.55 + a * 0.35), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Nuclear explosion — elegant full-screen clear
      if (bombFlash > 0 || bombShockwaves.length) {
        ctx.save();
        const ox = bombOriginX || W / 2;
        const oy = bombOriginY || H * 0.45;

        if (bombFlash > 0) {
          // Soft full-screen white bloom
          const intensity = Math.min(0.75, bombFlash * 0.85);
          ctx.globalAlpha = intensity;
          const flash = ctx.createRadialGradient(ox, oy, 2, ox, oy, Math.max(W, H) * 1.1);
          flash.addColorStop(0, 'rgba(255,255,255,1)');
          flash.addColorStop(0.15, 'rgba(255,255,220,0.9)');
          flash.addColorStop(0.4, 'rgba(180,255,220,0.45)');
          flash.addColorStop(0.7, 'rgba(120,180,255,0.2)');
          flash.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = flash;
          ctx.fillRect(0, 0, W, H);

          // Gentle mint/white screen wash that fades
          ctx.globalAlpha = Math.min(0.25, bombFlash * 0.3);
          ctx.fillStyle = 'rgba(200, 255, 230, 1)';
          ctx.fillRect(0, 0, W, H);
        }

        // Elegant expanding rings
        for (const sw of bombShockwaves) {
          const a = Math.max(0, sw.life);
          ctx.globalAlpha = a * 0.75;
          ctx.strokeStyle = `rgba(${sw.color},${a})`;
          ctx.lineWidth = sw.width + (1 - a) * 5;
          ctx.beginPath();
          ctx.arc(ox, oy, sw.r, 0, Math.PI * 2);
          ctx.stroke();
          // Soft outer glow
          ctx.globalAlpha = a * 0.2;
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(ox, oy, sw.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // Kill-cam flash
      if (killFlash > 0) {
        ctx.fillStyle = `rgba(90,228,170,${killFlash * 0.25})`;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = `rgba(255,255,255,${killFlash * 0.18})`;
        ctx.fillRect(0, 0, W, H);
        killFlash = Math.max(0, killFlash - 0.04);
      }
      ctx.restore();
    }

    function loop() {
      const now = performance.now();
      if (perf.lastT) {
        const fps = 1000 / Math.max(1, now - perf.lastT);
        perf.fps = perf.fps * 0.88 + fps * 0.12;
        perf.frames++;
        if (perf.frames % 25 === 0) {
          perf.lowFps = perf.fps < 50;
          // Auto-drop particles if struggling
          if (perf.fps < 42 && settings.particles !== 'low') {
            settings.particles = 'low';
          } else if (perf.fps < 48 && settings.particles === 'high') {
            settings.particles = 'medium';
          }
        }
      }
      perf.lastT = now;

      if (slowMo > 0) {
        slowMo--;
        if (slowMo % 2 === 0) update();
      } else {
        update();
      }
      for (let i = lockRings.length - 1; i >= 0; i--) {
        lockRings[i].life -= 0.05;
        lockRings[i].r += 1.2;
        if (lockRings[i].life <= 0) lockRings.splice(i, 1);
      }
      draw();
      if (gameRunning) {
        animationId = requestAnimationFrame(loop);
      } else {
        animationId = null;
      }
    }

    function updateLives() {
      if (lives <= 0) {
        livesEl.textContent = '💀';
      } else {
        livesEl.textContent = '♥ '.repeat(lives).trim();
      }
    }

    function startGame(level) {
      if (level != null) selectedLevel = level;
      selectedLevel = Math.min(maxUnlocked, Math.max(1, selectedLevel || 1));
      try { localStorage.setItem('spaceBlastLevel', String(selectedLevel)); } catch(e) {}
      currentMap = MAPS[selectedMapId] || MAPS.void;
      initStars();

      score = 0;
      lives = 4;
      boss = null; bossSpawnedFor = 0; powerModeTimer = 0;
      bombFlash = 0; bombRing = 0; bombSpawnTimer = 0; bombShockwaves = [];
      nextBombAt = 60 * (10 + Math.random() * 10);
      powerUps = [];
      bossBarWrap.style.display = 'none'; bossLabel.style.display = 'none';
      combo = 0;
      comboTimer = 0;
      killFlash = 0; slowMo = 0; lockRings = [];
      gameTime = 0;
      difficulty = 1;
      wave = { n: 1, phase: 'fight', timer: 0, kills: 0, phaseStartedAt: performance.now() };
      noEnemyTimer = 0;
      const cfg = waveCfg();
      director = { pressure: cfg.pressure, killStreak: 0, safeTimer: 0, eventTimer: 0, nextEvent: 22, mode: 'flow' };
      bullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];
      trails = [];
      shake = 0;
      scoreEl.textContent = '0';
      survivalTimeEl.textContent = '0:00';
      isPaused = false;
      pauseBtn.textContent = 'Ⅱ';
      updateLives();
      comboEl.classList.remove('show');
      player.x = W / 2 - player.w / 2;
      player.y = H - 90;
      player.targetX = player.x;
      player.targetY = player.y;
      overlay.classList.add('hidden');
      hint.classList.add('hidden');
      gameRunning = true;
      enemySpawnTimer = 0;
      lastShot = 0;
      showToast(`УР. ${selectedLevel} · ВОЛНА 1`);
      if (!animationId) loop();
      ensureAudio();
      startMusic();

    }

    function gameOver() {
      stopMusic();
      gameRunning = false;
      isPaused = false;
      pauseBtn.textContent = 'Ⅱ';
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        try { localStorage.setItem('spaceBlastBest', String(bestScore)); } catch(e) {}
      }

      const wpnName = 'Луч';
      const shareText = `Space Blast: ${score} очков · ур.${wave.n} · ${wpnName}`;
      overlay.innerHTML = `
        <h1>GAME OVER</h1>
        <div id="final-score">${score}</div>
        <div id="final-label">очков</div>
        <p class="subtitle" style="margin-bottom:18px">Время ${formatTime(gameTime)} · Уровень ${wave.n}<br>Оружие: ${wpnName}${score >= bestScore ? '<br>🏅 Новый рекорд' : ''}</p>
        <button class="btn" id="restart-btn">ЕЩЁ РАЗ</button>
        <button class="btn-secondary" id="share-btn" style="margin-top:10px">ПОДЕЛИТЬСЯ</button>
        <button class="btn-secondary" id="menu-btn" style="margin-top:10px">В МЕНЮ</button>
      `;
      overlay.classList.remove('hidden');
      document.getElementById('restart-btn').addEventListener('click', () => startGame(selectedLevel));
      document.getElementById('menu-btn').addEventListener('click', showMainMenu);
      const shareBtn = document.getElementById('share-btn');
      if (shareBtn) shareBtn.addEventListener('click', async () => {
        try {
          if (navigator.share) await navigator.share({ title: 'Space Blast', text: shareText, url: location.href });
          else if (navigator.clipboard) { await navigator.clipboard.writeText(shareText + ' ' + location.href); showToast('Скопировано'); }
        } catch (e) {}
      });
    }

    function togglePause() {
      if (!gameRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶' : 'Ⅱ';
      if (isPaused) {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        overlay.innerHTML = `
          <h1>ПАУЗА</h1>
          <p class="subtitle">Игра остановлена.</p>
          <div class="menu-actions">
            <button class="btn" id="resume-btn">ПРОДОЛЖИТЬ</button>
            <button class="btn-secondary" id="pause-settings-btn">⚙ НАСТРОЙКИ</button>
            <button class="btn-secondary" id="pause-menu-btn">В ГЛАВНОЕ МЕНЮ</button>
          </div>
        `;
        overlay.classList.remove('hidden');
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('pause-settings-btn').addEventListener('click', openSettings);
        document.getElementById('pause-menu-btn').addEventListener('click', showMainMenu);
      } else {
        overlay.classList.add('hidden');
        if (gameRunning && !animationId) loop();
      }
    }

    pauseBtn.addEventListener('click', togglePause);
    window.addEventListener('keydown', e => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && gameRunning && !isPaused) togglePause();
    });

    function showToast(message) {
      powerToast.textContent = message;
      powerToast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => powerToast.classList.remove('show'), 1500);
    }

    function selStyle(active) {
      return active
        ? 'border-color:#5AE4AA;box-shadow:0 0 12px rgba(90,228,170,.22);background:rgba(90,228,170,.12);color:#5AE4AA'
        : '';
    }

    function renderMainMenu() {
      let levels = '';
      for (let i = 1; i <= 10; i++) {
        const open = i <= maxUnlocked;
        const sel = i === selectedLevel;
        const st = open
          ? (sel ? selStyle(true) : '')
          : 'opacity:0.35;pointer-events:none';
        levels += `<button class="btn-secondary lvl-btn" data-lvl="${i}" style="padding:8px 0;min-width:42px;${st}">${open ? i : '🔒'}</button>`;
      }
      const map2btn = unlockedMap2
        ? `<button class="btn-secondary map-btn" data-map="aurora" style="${selStyle(selectedMapId==='aurora')}">Aurora Drift</button>`
        : '';
      return `<h1>SPACE BLAST</h1>
        <div style="width:min(320px,100%);text-align:left;margin-bottom:14px">
          <div style="color:#9CA3AF;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">УРОВЕНЬ</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${levels}</div>
          <div style="color:#9CA3AF;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">КАРТА</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button class="btn-secondary map-btn" data-map="void" style="${selStyle(selectedMapId==='void')}">Deep Void</button>
            ${map2btn}
          </div>
        </div>
        <div class="menu-actions">
          <button class="btn" id="start-btn">ИГРАТЬ · УР. ${selectedLevel}</button>
          <button class="btn-secondary" id="settings-btn">⚙ НАСТРОЙКИ</button>
        </div>`;
    }

    function openSettings() {
      gameRunning = false;
      isPaused = false;
      const row = (label, key, options) => {
        const btns = options.map(([val, name]) =>
          `<button class="btn-secondary set-opt" data-key="${key}" data-val="${val}" style="padding:10px 12px;font-size:13px;${selStyle(String(settings[key])===String(val))}">${name}</button>`
        ).join('');
        return `<div style="margin-bottom:12px"><div style="color:#64748b;font-size:10px;letter-spacing:1.5px;margin-bottom:6px">${label}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${btns}</div></div>`;
      };
      overlay.innerHTML = `<h1>НАСТРОЙКИ</h1>
        <p class="subtitle">Сохраняются на этом устройстве</p>
        <div style="width:min(320px,100%);text-align:left;max-height:58vh;overflow:auto;padding:0 4px">
          ${row('ЗВУК', 'sound', [[true,'Вкл'],[false,'Выкл']])}
          ${row('ТРЯСКА ЭКРАНА', 'shake', [['off','Выкл'],['low','Слабо'],['medium','Средне'],['high','Сильно']])}
          ${row('ЧАСТИЦЫ / ЭФФЕКТЫ', 'particles', [['low','Мало'],['medium','Норм'],['high','Много']])}
        </div>
        <div class="menu-actions" style="margin-top:14px">
          <button class="btn-secondary" id="settings-back">НАЗАД</button>
        </div>`;
      overlay.classList.remove('hidden');
      overlay.querySelectorAll('.set-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          let val = btn.dataset.val;
          if (key === 'sound') val = val === 'true';
          settings[key] = val;
          saveSettings();
          if (key === 'vibration' && val)
          if (key === 'sound' && val) playExplosion('medium', 0);
          openSettings();
        });
      });
      document.getElementById('settings-back').addEventListener('click', showMainMenu);
    }

    function bindMainMenu() {
      const start = document.getElementById('start-btn');
      if (start) start.addEventListener('click', () => startGame(selectedLevel));
      const settings = document.getElementById('settings-btn');
      if (settings) settings.addEventListener('click', openSettings);
      overlay.querySelectorAll('.lvl-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const lvl = Number(btn.dataset.lvl);
          if (lvl > maxUnlocked) return;
          selectedLevel = lvl;
          try { localStorage.setItem('spaceBlastLevel', String(selectedLevel)); } catch(e) {}
          showMainMenu();
        });
      });
      overlay.querySelectorAll('.map-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.map;
          if (id === 'aurora' && !unlockedMap2) return;
          applyMap(id);
          showMainMenu();
        });
      });
    }

    function showMainMenu() {
      stopMusic();
      gameRunning = false; isPaused = false;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      bullets = []; enemyBullets = []; enemies = []; particles = []; trails = []; powerUps = [];
      bombShockwaves = [];
      boss = null; bossBarWrap.style.display = 'none'; bossLabel.style.display = 'none';
      comboEl.classList.remove('show'); powerToast.classList.remove('show');
      overlay.innerHTML = renderMainMenu();
      overlay.classList.remove('hidden');
      hint.classList.remove('hidden');
      bindMainMenu();
      if (window.updateAutoBtn) window.updateAutoBtn();
    }

    // Boot: menu only, never auto-start
    showMainMenu();
    if (!animationId) loop();

    // PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    draw();
  </script>
</body>
</html>
